  /* ---------- 붙여넣은 글 읽기 ---------- */

  // 서식에서 쓰는 이름표들 (사장님이 조금 다르게 적어도 알아듣도록)
  var LABELS = [
    { key: 'customerName', words: ['고객이름', '고객명', '예약자', '성함', '이름'] },
    { key: 'phone',        words: ['연락처', '전화번호', '핸드폰', '휴대폰', '전화', '번호'] },
    { key: 'pickupDate',   words: ['픽업날짜', '픽업일자', '픽업일', '수령일', '픽업', '날짜'] },
    { key: 'pickupTime',   words: ['픽업시간', '수령시간', '시간'] },
    { key: 'request',      words: ['주문요청사항', '주문내용', '요청사항', '주문', '요청', '메뉴', '내용'] },
    { key: 'price',        words: ['판매가', '결제금액', '가격', '금액'] },
    { key: 'note',         words: ['참고사항', '특이사항', '참고', '비고', '메모'] }
  ];
  // 긴 단어부터 찾아야 "픽업날짜"가 "픽업"으로 잘리지 않음
  var LABEL_WORDS = LABELS.reduce(function (a, l) { return a.concat(l.words); }, [])
    .sort(function (a, b) { return b.length - a.length; });
  var LABEL_RE = new RegExp('(' + LABEL_WORDS.join('|') + ')\\s*[:：]', 'g');
  // 콜론 없이 "이름 김민지 / 전화 010-…" 처럼 적은 경우용
  var LABEL_RE_LOOSE = new RegExp('(?:^|[\\s/|,\\-])(' + LABEL_WORDS.join('|') + ')\\s*[:：]?[ \\t]+', 'g');
  function labelKey(word) {
    var f = LABELS.find(function (l) { return l.words.indexOf(word) >= 0; });
    return f ? f.key : null;
  }

  function parseReservations(text) {
    var raw = String(text || '');
    if (!raw.trim()) return [];
    // 1) "고객이름: 김민지" 처럼 콜론이 있는 서식
    var labeled = parseLabeled(raw, LABEL_RE);
    if (labeled.length) return labeled;
    // 2) "이름 김민지 / 전화 010-..." 처럼 콜론 없이 적은 서식
    //    (이름표가 3종류 이상 나올 때만 서식으로 인정 - 일반 대화를 오해하지 않도록)
    var loose = parseLabeled(raw, LABEL_RE_LOOSE, 3);
    if (loose.length) return loose;
    var byLine = parseFree(raw, true);
    if (byLine.length) return byLine;
    return parseFree(raw, false);   // 줄마다 못 찾으면 전체를 한 건으로
  }

  /* 방식 A - "고객이름: 김민지" 처럼 이름표가 있는 글 */
  function parseLabeled(text, re, minKinds) {
    re.lastIndex = 0;
    var marks = [], kinds = {}, m;
    while ((m = re.exec(text)) !== null) {
      var key = labelKey(m[1]);
      if (!key) continue;
      kinds[key] = true;
      marks.push({ key: key, start: m.index, valueFrom: m.index + m[0].length });
    }
    if (!marks.length) return [];
    if (minKinds && Object.keys(kinds).length < minKinds) return [];

    var out = [], cur = null;
    marks.forEach(function (mk, i) {
      var end = i + 1 < marks.length ? marks[i + 1].start : text.length;
      var value = text.slice(mk.valueFrom, end)
        .replace(/^[\s\-|/,]+/, '').replace(/[\s\-|/,]+$/, '').trim();
      // 이미 채운 항목이 또 나오면 다음 사람 주문으로 봄
      if (!cur || cur[mk.key] !== undefined) {
        if (cur) out.push(cur);
        cur = {};
      }
      cur[mk.key] = value;
    });
    if (cur) out.push(cur);

    return out.map(normalize).filter(function (r) {
      return r.customerName && r.customerName !== '이름없음';
    });
  }

  /* 방식 B - 카톡 대화처럼 자유롭게 적힌 글 */
  function parseFree(text, perLine) {
    var chunks = perLine ? String(text).split(/\r?\n/) : [String(text)];
    var out = [];
    var speaker = '';

    chunks.forEach(function (chunk) {
      var s = String(chunk).replace(/\t/g, ' ');
      if (!s.trim()) return;

      // 카톡 내보내기 형식의 말머리 제거
      var k1 = s.match(/^\[([^\]]{1,20})\]\s*\[[^\]]{1,20}\]\s*/);
      if (k1) { speaker = k1[1]; s = s.slice(k1[0].length); }
      var k2 = s.match(/^\d{4}년\s*\d{1,2}월\s*\d{1,2}일\s*(오전|오후)\s*\d{1,2}:\d{2},\s*([^:]{1,20}):\s*/);
      if (k2) { speaker = k2[2].trim(); s = s.slice(k2[0].length); }

      var pm = s.match(/01[016789][-.\s]?\d{3,4}[-.\s]?\d{4}/);
      var date = findDate(s);
      if (!pm && !date) return;

      var mm = s.match(/([0-9]{1,3}(?:,[0-9]{3})+|[0-9]{4,7})\s*원/);
      var price = mm ? U.toNum(mm[1]) : 0;

      var rest = s;
      [pm && pm[0], mm && mm[0]].forEach(function (x) { if (x) rest = rest.replace(x, ' '); });
      var time = findTime(rest);
      rest = stripDateTime(rest);

      // 카톡 말머리가 있으면 그 사람이 곧 고객
      var name = speaker || pickName(rest);
      var request = cleanRequest(rest, name);

      out.push(normalize({
        customerName: name, phone: pm ? pm[0] : '', pickupDate: date,
        pickupTime: time, request: request, price: price
      }));
    });

    return out.filter(function (r) { return r.customerName && r.customerName !== '이름없음'; });
  }

  /* ---------- 값 다듬기 ---------- */

  // 이름이 아닌 흔한 말들 (카톡 대화에서 이름으로 잘못 잡히는 것 방지)
  var NOT_NAME = /^(안녕하세요|안녕하십니까|감사합니다|감사해요|고맙습니다|부탁드립니다|부탁드려요|부탁해요|죄송합니다|알겠습니다|알겠어요|가능할까요|가능한가요|가능해요|맞나요|맞을까요|문의드립니다|문의드려요|예약이요|주문이요|네네|넵넵|여보세요|사장님)$/;
  function looksLikeName(w) {
    if (!w) return false;
    if (NOT_NAME.test(w)) return false;
    if (/케이크|주문|예약|픽업|가격|금액|문의|배송|포장/.test(w)) return false;
    return true;
  }
  // 남은 글에서 사람 이름처럼 보이는 첫 단어 고르기
  function pickName(text) {
    // "박지훈입니다", "김민지예요", "이서연님" 처럼 뒤에 말이 붙은 경우를 먼저 봄
    var tagged = text.match(/([가-힣]{2,4})(?:입니다|입니당|이라고|이에요|예요|이구요|이고요|님|씨)/);
    if (tagged && looksLikeName(tagged[1])) return tagged[1];
    var re = /[가-힣]{2,4}/g, m;
    while ((m = re.exec(text)) !== null) {
      if (looksLikeName(m[0])) return m[0];
    }
    return '';
  }

  // 주문내용에서 인사말·이름·군더더기를 걷어냄 (미리보기에서 고칠 수 있으니 완벽할 필요는 없음)
  function cleanRequest(text, name) {
    var s = text;
    if (name) s = s.replace(new RegExp(name + '(입니다|입니당|이라고|이에요|예요|이구요|이고요|님|씨)?', 'g'), ' ');
    return s
      .replace(/(안녕하세요|안녕하십니까|감사합니다|감사해요|고맙습니다|부탁드립니다|부탁드려요|부탁해요|예약할게요|예약이요|주문할게요|주문이요|맞나요|맞을까요|가능할까요|가능한가요|찾으러 ?갈게요|가지러 ?갈게요)/g, ' ')
      .replace(/(예약자|연락처|고객명|고객이름|픽업날짜|픽업시간|참고사항|주문요청사항)/g, ' ')
      .replace(/[?!]+/g, ' ')
      // 전화번호·날짜를 걷어내고 남은 조사 부스러기 정리
      .replace(/(^|\s)(이고요|이구요|입니다|입니당|이에요|예요|에|은|는|이|가|요)(?=\s|$)/g, ' ')
      .replace(/\s{2,}/g, ' ').replace(/^[\s/,|\-]+|[\s/,|\-]+$/g, '').trim();
  }

  function findDate(s) {
    var m = s.match(/(20\d{2})\s*[-.\/년]\s*(\d{1,2})\s*[-.\/월]\s*(\d{1,2})/);
    if (m) return m[1] + '-' + U.pad(+m[2]) + '-' + U.pad(+m[3]);
    m = s.match(/(\d{1,2})\s*월\s*(\d{1,2})\s*일/);
    if (m) return yearFor(+m[1], +m[2]);
    m = s.match(/(?:^|[^\d])(\d{1,2})\s*[\/.]\s*(\d{1,2})(?![\d:])/);
    if (m) return yearFor(+m[1], +m[2]);
    return '';
  }
  // 월/일만 적혀 있으면 올해로 보되, 이미 지난 날짜면 내년으로
  function yearFor(mon, day) {
    var now = new Date();
    var y = now.getFullYear();
    var d = y + '-' + U.pad(mon) + '-' + U.pad(day);
    if (d < U.today()) d = (y + 1) + '-' + U.pad(mon) + '-' + U.pad(day);
    return d;
  }
  // 금액 읽기 - "15만원", "14만원", "72,000원", "1480000" 모두 처리
  function parseMoney(v) {
    var s = String(v === null || v === undefined ? '' : v).replace(/[,\s]/g, '');
    if (!s) return 0;
    if (!/[억만천]/.test(s)) return U.toNum(s);
    var unit = { '억': 100000000, '만': 10000, '천': 1000 };
    var total = 0, re = /(\d+(?:\.\d+)?)\s*([억만천])?/g, m;
    while ((m = re.exec(s)) !== null) {
      total += parseFloat(m[1]) * (m[2] ? unit[m[2]] : 1);
    }
    return Math.round(total);
  }

  var MORNING = /^(새벽|아침|오전)$/;
  function findTime(s) {
    // "아침 8시", "오후 2시", "저녁 7시" 처럼 때를 나타내는 말이 앞에 붙은 경우
    var ampm = s.match(/(새벽|아침|오전|낮|점심|오후|저녁|밤)\s*(\d{1,2})\s*(?:시|:)\s*(\d{1,2})?/);
    if (ampm) {
      var h = +ampm[2];
      var morning = MORNING.test(ampm[1]);
      if (!morning && h < 12) h += 12;
      if (morning && h === 12) h = 0;
      return U.pad(h) + ':' + U.pad(ampm[3] ? +ampm[3] : 0);
    }
    var m = s.match(/(?:^|[^\d])(\d{1,2})\s*:\s*(\d{2})/);
    if (m) return U.pad(+m[1]) + ':' + U.pad(+m[2]);
    m = s.match(/(\d{1,2})\s*시\s*(\d{1,2})?\s*분?/);
    if (m) {
      var h = +m[1];
      // "2시" 처럼 오전/오후를 안 적었으면 케이크 픽업 시간대(오후)로 봄
      if (h >= 1 && h <= 8) h += 12;
      return U.pad(h) + ':' + U.pad(m[2] ? +m[2] : 0);
    }
    return '';
  }
  function stripDateTime(s) {
    return s
      .replace(/20\d{2}\s*[-.\/년]\s*\d{1,2}\s*[-.\/월]\s*\d{1,2}\s*일?/g, ' ')
      .replace(/\d{1,2}\s*월\s*\d{1,2}\s*일/g, ' ')
      .replace(/(오전|오후)?\s*\d{1,2}\s*[:시]\s*\d{0,2}\s*분?/g, ' ')
      .replace(/\d{1,2}\s*[\/.]\s*\d{1,2}/g, ' ');
  }

  // 읽어낸 값을 주문 형식으로 정리
  function normalize(r) {
    var date = r.pickupDate ? (findDate(r.pickupDate) || r.pickupDate) : '';
    if (!/^\d{4}-\d{2}-\d{2}$/.test(date)) date = '';
    // 시간을 따로 안 적고 "픽업날짜: 12월 24일 오후 5시" 처럼 함께 적은 경우도 읽어냄
    var time = (r.pickupTime && findTime(r.pickupTime)) ||
               (r.pickupDate && findTime(String(r.pickupDate).replace(/20\d{2}\s*[-.\/년]\s*\d{1,2}\s*[-.\/월]\s*\d{1,2}\s*일?/g, ' '))) || '';
    var name = String(r.customerName || '').replace(/(님|씨)$/, '').trim();

    // "택배배송" 처럼 시간이 아닌 내용을 적으셨으면 참고사항에 옮겨 적어 둡니다
    var note = String(r.note || '').trim();
    var rawTime = String(r.pickupTime || '').trim();
    if (rawTime && !time) {
      note = (rawTime + (note ? ' / ' + note : '')).trim();
    }

    return {
      customerName: name,
      phone: U.phone(String(r.phone || '').trim()),
      pickupDate: date || U.today(),
      pickupTime: time || '14:00',
      request: String(r.request || '').trim(),
      price: parseMoney(r.price),
      note: note
    };
  }

  /* ---------- 이벤트 연결 ---------- */
  function bind(view) {
    U.$('#orderForm', view).addEventListener('submit', saveForm);
    U.$('#formReset', view).onclick = resetForm;
    U.$('#pasteImport', view).onclick = pasteModal;

    U.$('#autoCost', view).onclick = function () {
      var f = U.$('#orderForm', view);
      var r = Cost.calcFromText(f.request.value);
      if (!r.ok) { U.toast(r.reason); return; }
      f.cost.value = Math.round(r.total / 10) * 10;   // 10원 단위로 정리
      if (!U.toNum(f.price.value)) f.price.value = r.suggested;
      U.toast('원가 ' + U.won(r.total) + ' — ' + r.name + ' (' + r.sourceLabel + ')');
    };

    U.$('#calPrev', view).onclick = function () { calMonth = U.shiftMonth(calMonth, -1); refreshCal(); };
    U.$('#calNext', view).onclick = function () { calMonth = U.shiftMonth(calMonth, 1); refreshCal(); };

    view.addEventListener('click', function (e) {
      var day = e.target.closest('.day[data-date]');
      if (day) { dayModal(day.dataset.date); return; }
      var t = e.target;
      if (t.dataset.editOrder) loadToForm(t.dataset.editOrder);
    });

    function refreshCal() {
      U.$('#calTitle', view).textContent = U.monthTitle(calMonth);
      U.$('#calBody', view).innerHTML = calendarGrid();
    }
  }

  return { render: render, all: all, byMonth: byMonth, byDate: byDate,
           statusText: statusText, statusCls: statusCls, parseReservations: parseReservations };
})();

/* ===== js/monthly.js ===== */
/* 월별 정산 - 한 달(1일~말일) 주문 전체 리스트 + 매출/원가 한눈에 보기
   원가는 주문서에 적어둔 값을 우선 쓰고, 비어 있으면 [원가표] 값을 자동으로 가져옵니다. */
window.Monthly = (function () {

  var month = U.thisMonth();

  function render(view) {
    var orders = Orders.byMonth(month);
    var live = orders.filter(function (o) { return o.status !== 'canceled'; });

    var sales = sum(live, 'price');
    var cost = live.reduce(function (a, o) { return a + Cost.orderCost(o).value; }, 0);
    var profit = sales - cost;
    var rate = sales ? Math.round(profit / sales * 100) : 0;
    var deposit = sum(live.filter(function (o) { return o.status !== 'done'; }), 'deposit');

    // 원가가 어디서 왔는지 세어봅니다
    var fromMenu = live.filter(function (o) { return Cost.orderCost(o).from === 'menu'; });
    var noCost = live.filter(function (o) { return Cost.orderCost(o).from === 'none'; });

    view.innerHTML = '' +
      '<div class="card">' +
        '<div class="cal-head">' +
          '<button class="btn ghost small" id="mPrev">‹ 이전달</button>' +
          '<div class="cal-title">' + U.monthTitle(month) + ' 정산 <span class="cap-sub" style="font-weight:400">(1일~' + U.lastDayOfMonth(month) + '일)</span></div>' +
          '<button class="btn ghost small" id="mNext">다음달 ›</button>' +
        '</div>' +
        '<div class="grid four">' +
          tile('주문 건수', live.length + '건', '') +
          tile('총 매출', U.won(sales), 'rose') +
          tile('총 원가', U.won(cost), 'amber') +
          tile('순이익', U.won(profit) + ' (' + rate + '%)', 'mint') +
        '</div>' +
        (deposit ? '<p class="hint" style="margin-top:10px">받은 예약금 중 아직 픽업 전인 금액: <b>' + U.won(deposit) + '</b></p>' : '') +
        costNotice(fromMenu, noCost) +
      '</div>' +

      '<div class="card">' +
        '<div class="row"><h2 style="margin:0">📋 주문 전체 리스트</h2><div class="spacer"></div>' +
        '<button class="btn ghost small" id="mRecalc">🔄 원가 전체 다시 계산</button>' +
        '<button class="btn ghost small" id="mCsv">엑셀(CSV) 저장</button></div>' +
        (orders.length ? orderTable(orders) : '<div class="empty">이 달에는 주문이 없어요.</div>') +
        '<p class="hint" style="margin-top:10px">' +
          '<span class="badge">원가표</span> 표시는 주문서에 원가를 적지 않아서 ' +
          '<b>원가표에서 자동으로 가져온</b> 값이라는 뜻입니다.</p>' +
      '</div>' +

      (live.length ? '<div class="card"><h2>🗓️ 날짜별 합계</h2>' + dailyTable(live) + '</div>' : '') +

      '<div class="card"><h2>🏆 메뉴별 순위</h2>' +
        (live.length ? rankTable(live) : '<div class="empty">데이터가 없어요.</div>') +
      '</div>';

    bind(view, orders, fromMenu);
  }

  /* ---------- 원가 출처 안내 ---------- */
  function costNotice(fromMenu, noCost) {
    var html = '';
    if (fromMenu.length) {
      html += '<div class="info" style="margin-top:12px">💰 원가를 적지 않은 주문 <b>' + fromMenu.length + '건</b>은 ' +
        '<b>원가표 값으로 자동 계산</b>해서 위 금액에 넣었어요. ' +
        '<button class="btn ghost small" id="mFill" style="margin-left:6px">주문서에 저장해 두기</button></div>';
    }
    if (noCost.length) {
      html += '<div class="warn" style="margin-top:10px">⚠️ 원가를 알 수 없는 주문이 <b>' + noCost.length + '건</b> 있어요 ' +
        '(' + noCost.slice(0, 3).map(function (o) { return U.esc(o.customerName); }).join(', ') +
        (noCost.length > 3 ? ' 외' : '') + '). ' +
        '<b>원가표</b>에 해당 메뉴를 추가하거나 주문서에 원가를 직접 적어주세요. ' +
        '<button class="btn ghost small" id="mGoCost" style="margin-left:6px">원가표로 가기</button></div>';
    }
    return html;
  }

  function sum(arr, key) {
    return arr.reduce(function (a, o) { return a + U.toNum(o[key]); }, 0);
  }
  function tile(label, value, cls) {
    return '<div class="stat ' + cls + '"><div class="label">' + label + '</div><div class="value">' + value + '</div></div>';
  }

  function orderTable(orders) {
    var rows = orders.map(function (o) {
      var c = Cost.orderCost(o);
      var profit = U.toNum(o.price) - c.value;
      var costCell = c.from === 'none'
        ? '<span class="badge red">없음</span>'
        : U.num(c.value) + (c.from === 'menu' ? ' <span class="badge">원가표</span>' : '');
      return '<tr' + (o.status === 'canceled' ? ' style="opacity:.45"' : '') + '>' +
        '<td>' + U.korDate(o.pickupDate) + '<br><span class="cap-sub">' + U.esc(o.pickupTime || '') + '</span></td>' +
        '<td><b>' + U.esc(o.customerName) + '</b><br><span class="cap-sub">' + U.esc(U.phone(o.phone)) + '</span></td>' +
        '<td>' + U.esc(o.request || '') + (o.note ? '<br><span class="cap-sub">📌 ' + U.esc(o.note) + '</span>' : '') + '</td>' +
        '<td class="num">' + U.num(o.price) + '</td>' +
        '<td class="num">' + costCell + '</td>' +
        '<td class="num" style="color:' + (profit >= 0 ? 'var(--mint)' : 'var(--red)') + '"><b>' + U.num(profit) + '</b></td>' +
        '<td><span class="badge ' + Orders.statusCls(o.status) + '">' + Orders.statusText(o.status) + '</span></td>' +
        '</tr>';
    }).join('');

    var live = orders.filter(function (o) { return o.status !== 'canceled'; });
    var totalSales = sum(live, 'price');
    var totalCost = live.reduce(function (a, o) { return a + Cost.orderCost(o).value; }, 0);

    return '<div class="table-wrap"><table>' +
      '<thead><tr><th>픽업날짜</th><th>고객</th><th>주문내용</th><th class="num">매출</th><th class="num">원가</th><th class="num">이익</th><th>상태</th></tr></thead>' +
      '<tbody>' + rows + '</tbody>' +
      '<tfoot><tr><td colspan="3">합계 (취소 제외)</td>' +
        '<td class="num">' + U.num(totalSales) + '</td>' +
        '<td class="num">' + U.num(totalCost) + '</td>' +
        '<td class="num">' + U.num(totalSales - totalCost) + '</td><td></td></tr></tfoot>' +
      '</table></div>';
  }

  function dailyTable(live) {
    var map = {};
    live.forEach(function (o) {
      var d = o.pickupDate;
      if (!map[d]) map[d] = { n: 0, price: 0, cost: 0 };
      map[d].n++;
      map[d].price += U.toNum(o.price);
      map[d].cost += Cost.orderCost(o).value;
    });
    var rows = Object.keys(map).sort().map(function (d) {
      var v = map[d];
      return '<tr><td>' + U.korDate(d) + '</td><td class="num">' + v.n + '건</td>' +
        '<td class="num">' + U.num(v.price) + '</td><td class="num">' + U.num(v.cost) + '</td>' +
        '<td class="num">' + U.num(v.price - v.cost) + '</td></tr>';
    }).join('');
    return '<div class="table-wrap"><table><thead><tr><th>날짜</th><th class="num">건수</th>' +
      '<th class="num">매출</th><th class="num">원가</th><th class="num">이익</th></tr></thead><tbody>' + rows + '</tbody></table></div>';
  }

  function rankTable(live) {
    var map = {};
    live.forEach(function (o) {
      // 원가표에서 찾은 메뉴 이름이 있으면 그걸로 묶고, 없으면 주문내용 첫 줄로 묶습니다
      var c = Cost.orderCost(o);
      var key = (c.name || (o.request || '기타').split('\n')[0].slice(0, 24)) || '기타';
      if (!map[key]) map[key] = { n: 0, price: 0, cost: 0 };
      map[key].n++;
      map[key].price += U.toNum(o.price);
      map[key].cost += c.value;
    });
    var rows = Object.keys(map).map(function (k) { return { k: k, v: map[k] }; })
      .sort(function (a, b) { return b.v.n - a.v.n || b.v.price - a.v.price; })
      .slice(0, 10)
      .map(function (x, i) {
        var p = x.v.price - x.v.cost;
        return '<tr><td>' + (i + 1) + '</td><td>' + U.esc(x.k) + '</td><td class="num">' + x.v.n + '건</td>' +
          '<td class="num">' + U.num(x.v.price) + '</td>' +
          '<td class="num">' + U.num(x.v.cost) + '</td>' +
          '<td class="num" style="color:' + (p >= 0 ? 'var(--mint)' : 'var(--red)') + '">' + U.num(p) + '</td></tr>';
      }).join('');
    return '<div class="table-wrap"><table><thead><tr><th>순위</th><th>메뉴</th><th class="num">건수</th>' +
      '<th class="num">매출</th><th class="num">원가</th><th class="num">이익</th></tr></thead><tbody>' + rows + '</tbody></table></div>';
  }

  function bind(view, orders, fromMenu) {
    U.$('#mPrev', view).onclick = function () { month = U.shiftMonth(month, -1); App.render(); };
    U.$('#mNext', view).onclick = function () { month = U.shiftMonth(month, 1); App.render(); };

    var goCost = U.$('#mGoCost', view);
    if (goCost) goCost.onclick = function () { location.hash = '#cost'; };

    // 자동 계산된 원가를 주문서에 실제로 적어 둡니다
    var fill = U.$('#mFill', view);
    if (fill) fill.onclick = function () {
      if (!U.confirmBox('원가가 비어 있는 주문 ' + fromMenu.length + '건에 원가표 값을 넣을까요?')) return;
      var n = 0;
      fromMenu.forEach(function (o) {
        var c = Cost.orderCost(o);
        if (c.from === 'menu' && c.value > 0) { DB.upsert('orders', { id: o.id, cost: c.value }); n++; }
      });
      U.toast(n + '건의 원가를 저장했어요');
      App.render();
    };

    // 원가표를 고친 뒤 이번 달 전체를 다시 계산
    U.$('#mRecalc', view).onclick = function () {
      var live = orders.filter(function (o) { return o.status !== 'canceled'; });
      if (!U.confirmBox(U.monthTitle(month) + ' 주문 ' + live.length + '건의 원가를 원가표 기준으로 다시 계산합니다.\n' +
                        '주문서에 직접 적어두신 원가도 덮어씁니다. 계속할까요?')) return;
      var n = 0, miss = 0;
      live.forEach(function (o) {
        var r = Cost.calcFromText(o.request || '');
        if (r.ok) { DB.upsert('orders', { id: o.id, cost: Math.round(r.total / 10) * 10 }); n++; }
        else miss++;
      });
      U.toast(n + '건 다시 계산했어요' + (miss ? ' (원가표에 없는 ' + miss + '건은 그대로)' : ''));
      App.render();
    };

    U.$('#mCsv', view).onclick = function () {
      var rows = [['픽업날짜', '픽업시간', '고객이름', '연락처', '주문요청사항', '가격(매출)', '원가', '원가출처', '이익', '예약금', '참고사항', '경로', '상태']];
      orders.forEach(function (o) {
        var c = Cost.orderCost(o);
        rows.push([o.pickupDate, o.pickupTime || '', o.customerName, U.phone(o.phone), o.request || '',
          U.toNum(o.price), c.value,
          c.from === 'order' ? '직접 입력' : c.from === 'menu' ? '원가표' : '없음',
          U.toNum(o.price) - c.value, U.toNum(o.deposit),
          o.note || '', o.source || '', Orders.statusText(o.status)]);
      });
      U.downloadCsv(month + '_주문정산.csv', rows);
      U.toast('CSV 파일을 저장했어요');
    };
  }

  return { render: render, setMonth: function (m) { month = m; } };
})();

/* ===== js/inventory.js ===== */
/* 재고 현황 - 케이크 상자, 보냉백, 리본 등 */
window.Inventory = (function () {

  var CATEGORIES = ['상자', '보냉백', '리본', '초·장식', '받침·트레이', '포장지', '기타'];
  var filter = '전체';

  function render(view) {
    var items = DB.list('inventory');
    var shown = filter === '전체' ? items : items.filter(function (i) { return i.category === filter; });
    shown = shown.slice().sort(function (a, b) {
      return (a.category || '').localeCompare(b.category || '') || (a.name || '').localeCompare(b.name || '');
    });

    var low = items.filter(isLow);
    var totalValue = items.reduce(function (a, i) { return a + U.toNum(i.qty) * U.toNum(i.unitPrice); }, 0);

    view.innerHTML = '' +
      '<div class="card">' +
        '<div class="grid three">' +
          tile('전체 품목', items.length + '종', '') +
          tile('재고 금액', U.won(totalValue), 'rose') +
          tile('부족 품목', low.length + '종', low.length ? 'amber' : 'mint') +
        '</div>' +
        (low.length ? '<div class="warn" style="margin-top:12px">⚠️ <b>주문이 필요해요:</b> ' +
          low.map(function (i) { return U.esc(i.name) + ' (' + U.num(i.qty) + U.esc(i.unit || '개') + ' 남음)'; }).join(', ') + '</div>' : '') +
      '</div>' +

      '<div class="card">' +
        '<div class="row"><h2 style="margin:0">📦 재고 현황</h2><div class="spacer"></div>' +
          '<button class="btn ghost small" id="invCsv">CSV 저장</button>' +
          '<button class="btn small" id="addItem">+ 품목 추가</button></div>' +
        '<div class="row" style="margin:10px 0">' +
          ['전체'].concat(CATEGORIES).map(function (c) {
            return '<button class="btn ' + (c === filter ? '' : 'ghost') + ' small" data-filter="' + c + '">' + c + '</button>';
          }).join('') +
        '</div>' +
        (shown.length ? table(shown) : '<div class="empty">등록된 품목이 없어요. [+ 품목 추가]를 눌러보세요.</div>') +
        '<p class="hint" style="margin-top:10px">➖ ➕ 버튼으로 수량을 바로 조절할 수 있어요. ' +
        '현재 수량이 안전재고 이하가 되면 빨갛게 표시되고 위에 알려드립니다.</p>' +
      '</div>';

    bind(view, shown);
  }

  function isLow(i) {
    var min = U.toNum(i.minQty);
    return min > 0 && U.toNum(i.qty) <= min;
  }
  function tile(label, value, cls) {
    return '<div class="stat ' + cls + '"><div class="label">' + label + '</div><div class="value">' + value + '</div></div>';
  }

  function table(items) {
    var rows = items.map(function (i) {
      var qty = U.toNum(i.qty), unit = i.unit || '개';
      return '<tr' + (isLow(i) ? ' class="low"' : '') + '>' +
        '<td><b>' + U.esc(i.name) + '</b>' + (i.memo ? '<br><span class="cap-sub">' + U.esc(i.memo) + '</span>' : '') + '</td>' +
        '<td><span class="badge gray">' + U.esc(i.category || '기타') + '</span></td>' +
        '<td class="num" style="white-space:nowrap">' +
          '<button class="icon-btn" data-minus="' + i.id + '">➖</button>' +
          '<b style="display:inline-block;min-width:46px">' + U.num(qty) + '</b>' +
          '<button class="icon-btn" data-plus="' + i.id + '">➕</button>' +
          ' <span class="cap-sub">' + U.esc(unit) + '</span>' +
        '</td>' +
        '<td class="num">' + (U.toNum(i.minQty) || '-') + '</td>' +
        '<td class="num">' + U.won(i.unitPrice) + '</td>' +
        '<td class="num">' + U.won(qty * U.toNum(i.unitPrice)) + '</td>' +
        '<td class="num">' + (isLow(i) ? '<span class="badge red">부족</span>' : '<span class="badge mint">충분</span>') + '</td>' +
        '<td class="num"><button class="icon-btn" data-edit="' + i.id + '">✏️</button>' +
        '<button class="icon-btn" data-del="' + i.id + '">🗑️</button></td></tr>';
    }).join('');
    return '<div class="table-wrap"><table><thead><tr><th>품목</th><th>분류</th><th class="num">현재 수량</th>' +
      '<th class="num">안전재고</th><th class="num">개당 단가</th><th class="num">재고 금액</th><th class="num">상태</th><th></th></tr></thead>' +
      '<tbody>' + rows + '</tbody></table></div>';
  }

  function itemModal(id) {
    var it = id ? DB.find('inventory', id) : { name: '', category: '상자', qty: 0, unit: '개', minQty: 10, unitPrice: 0, memo: '' };
    var html = '' +
      '<div class="field"><label>품목명 <span style="color:var(--rose)">*</span></label>' +
        '<input id="iName" value="' + U.esc(it.name) + '" placeholder="예: 1호 케이크 상자 (화이트)"></div>' +
      '<div class="grid two">' +
        '<div class="field"><label>분류</label><select id="iCat">' +
          CATEGORIES.map(function (c) { return '<option' + (c === it.category ? ' selected' : '') + '>' + c + '</option>'; }).join('') +
        '</select></div>' +
        '<div class="field"><label>단위</label><input id="iUnit" value="' + U.esc(it.unit || '개') + '" placeholder="개, 롤, 장"></div>' +
        '<div class="field"><label>현재 수량</label><input id="iQty" type="number" step="any" value="' + U.esc(it.qty) + '"></div>' +
        '<div class="field"><label>안전재고 (이하면 알림)</label><input id="iMin" type="number" step="any" value="' + U.esc(it.minQty) + '"></div>' +
        '<div class="field"><label>개당 단가(원)</label><input id="iPrice" type="number" step="any" value="' + U.esc(it.unitPrice) + '"></div>' +
        '<div class="field"><label>구매처 링크 (선택)</label><input id="iUrl" value="' + U.esc(it.url || '') + '" placeholder="https://"></div>' +
      '</div>' +
      '<div class="field"><label>메모</label><input id="iMemo" value="' + U.esc(it.memo || '') + '" placeholder="예: 100개 묶음 구매"></div>' +
      '<div class="row end"><button class="btn ghost" id="iCancel">취소</button><button class="btn" id="iSave">저장</button></div>';

    U.modal(id ? '품목 수정' : '품목 추가', html, function (body) {
      U.$('#iCancel', body).onclick = U.closeModal;
      U.$('#iSave', body).onclick = function () {
        var name = U.$('#iName', body).value.trim();
        if (!name) { U.toast('품목명을 적어주세요'); return; }
        DB.upsert('inventory', {
          id: it.id, name: name,
          category: U.$('#iCat', body).value,
          unit: U.$('#iUnit', body).value.trim() || '개',
          qty: U.toNum(U.$('#iQty', body).value),
          minQty: U.toNum(U.$('#iMin', body).value),
          unitPrice: U.toNum(U.$('#iPrice', body).value),
          url: U.$('#iUrl', body).value.trim(),
          memo: U.$('#iMemo', body).value.trim()
        });
        U.closeModal(); U.toast('저장했어요'); App.render();
      };
    });
  }

  function adjust(id, delta) {
    var it = DB.find('inventory', id); if (!it) return;
    var next = Math.max(0, U.toNum(it.qty) + delta);
    DB.upsert('inventory', { id: id, qty: next });
    App.render();
  }

  function bind(view, shown) {
    U.$('#addItem', view).onclick = function () { itemModal(null); };
    U.$('#invCsv', view).onclick = function () {
      var rows = [['품목명', '분류', '현재수량', '단위', '안전재고', '개당단가', '재고금액', '메모']];
      DB.list('inventory').forEach(function (i) {
        rows.push([i.name, i.category, U.toNum(i.qty), i.unit, U.toNum(i.minQty), U.toNum(i.unitPrice),
          U.toNum(i.qty) * U.toNum(i.unitPrice), i.memo || '']);
      });
      U.downloadCsv('재고현황.csv', rows);
    };
    view.addEventListener('click', function (e) {
      var t = e.target;
      if (t.dataset.filter) { filter = t.dataset.filter; App.render(); }
      if (t.dataset.edit) itemModal(t.dataset.edit);
      if (t.dataset.del && U.confirmBox('이 품목을 삭제할까요?')) { DB.remove('inventory', t.dataset.del); App.render(); }
      if (t.dataset.plus) adjust(t.dataset.plus, 1);
      if (t.dataset.minus) adjust(t.dataset.minus, -1);
    });
  }

  return { render: render, CATEGORIES: CATEGORIES, isLow: isLow };
})();

/* ===== js/gallery.js ===== */
/* 작업 사진 갤러리
   사진은 브라우저 안(IndexedDB)에 저장되고 인터넷으로 올라가지 않습니다. */
window.Gallery = (function () {

  var urlCache = {};   // id -> objectURL (화면을 다시 그릴 때 정리)
  var tagFilter = '전체';

  function render(view) {
    releaseUrls();
    var photos = DB.list('photos').slice().sort(function (a, b) {
      return (b.date || '').localeCompare(a.date || '') || (b.createdAt || '').localeCompare(a.createdAt || '');
    });
    var tags = {};
    photos.forEach(function (p) { (p.tags || []).forEach(function (t) { tags[t] = (tags[t] || 0) + 1; }); });
    var tagList = Object.keys(tags).sort();
    var shown = tagFilter === '전체' ? photos : photos.filter(function (p) { return (p.tags || []).indexOf(tagFilter) >= 0; });

    view.innerHTML = '' +
      '<div class="card">' +
        '<div class="row"><h2 style="margin:0">🖼️ 작업 사진 갤러리</h2><div class="spacer"></div>' +
          '<label class="btn small" for="photoInput" style="margin:0">+ 사진 올리기</label>' +
          '<input type="file" id="photoInput" accept="image/*" multiple style="display:none;width:auto">' +
        '</div>' +
        '<p class="hint">사진 ' + photos.length + '장 · 여러 장을 한 번에 올릴 수 있어요. ' +
        '사진은 자동으로 가볍게 줄여서 저장합니다.</p>' +
        (tagList.length ? '<div class="row" style="margin-bottom:12px">' +
          ['전체'].concat(tagList).map(function (t) {
            return '<button class="btn ' + (t === tagFilter ? '' : 'ghost') + ' small" data-tag="' + U.esc(t) + '">' +
              U.esc(t) + (t === '전체' ? '' : ' ' + tags[t]) + '</button>';
          }).join('') + '</div>' : '') +
        (shown.length ? '<div class="gal" id="galGrid">' + shown.map(card).join('') + '</div>'
          : '<div class="empty">아직 사진이 없어요.<br>지금까지 만든 작업 사진을 올려보세요 📸</div>') +
      '</div>';

    bind(view);
    shown.forEach(loadImage);
  }

  function card(p) {
    return '<figure data-photo="' + p.id + '">' +
      '<img id="img-' + p.id + '" alt="' + U.esc(p.title || '작업 사진') + '" loading="lazy">' +
      '<figcaption><div class="cap-title">' + U.esc(p.title || '(제목 없음)') + '</div>' +
      '<div class="cap-sub">' + (p.date ? U.korDate(p.date) : '') +
      ((p.tags || []).length ? ' · ' + U.esc(p.tags.join(', ')) : '') + '</div></figcaption></figure>';
  }

  function loadImage(p) {
    DB.photoGet(p.id).then(function (blob) {
      if (!blob) return;
      var el = document.getElementById('img-' + p.id);
      if (!el) return;
      var url = URL.createObjectURL(blob);
      urlCache[p.id] = url;
      el.src = url;
    }).catch(function () { });
  }
  function releaseUrls() {
    Object.keys(urlCache).forEach(function (k) { URL.revokeObjectURL(urlCache[k]); });
    urlCache = {};
  }

  /* ---------- 업로드 (자동 축소) ---------- */
  function handleFiles(files) {
    var arr = Array.prototype.slice.call(files).filter(function (f) { return /^image\//.test(f.type); });
    if (!arr.length) return;
    U.toast(arr.length + '장 저장 중...');
    var chain = Promise.resolve();
    arr.forEach(function (file) {
      chain = chain.then(function () { return shrink(file); }).then(function (blob) {
        var meta = DB.upsert('photos', {
          title: file.name.replace(/\.[^.]+$/, '').slice(0, 40),
          date: U.today(), tags: [], memo: ''
        });
        return DB.photoPut(meta.id, blob);
      });
    });
    chain.then(function () {
      // 사진 파일도 서버 보관함에 올려 둡니다 (다른 기기에서도 보이게)
      try { return Sync.syncPhotos(); } catch (e) { return null; }
    })
      .then(function () { U.toast('사진을 저장했어요'); App.render(); })
      .catch(function (e) { U.toast('저장 실패: ' + e.message); });
  }

  // 긴 변 1400px 이하 JPEG 로 변환 (용량 절약)
  function shrink(file) {
    return new Promise(function (resolve, reject) {
      var img = new Image();
      var url = URL.createObjectURL(file);
      img.onload = function () {
        var max = 1400;
        var w = img.width, h = img.height;
        var scale = Math.min(1, max / Math.max(w, h));
        var cw = Math.round(w * scale), ch = Math.round(h * scale);
        var c = document.createElement('canvas');
        c.width = cw; c.height = ch;
        c.getContext('2d').drawImage(img, 0, 0, cw, ch);
        URL.revokeObjectURL(url);
        c.toBlob(function (blob) {
          resolve(blob || file);
        }, 'image/jpeg', 0.85);
      };
      img.onerror = function () { URL.revokeObjectURL(url); reject(new Error('이미지를 읽을 수 없어요')); };
      img.src = url;
    });
  }

  /* ---------- 자세히 보기 / 수정 ---------- */
  function detail(id) {
    var p = DB.find('photos', id); if (!p) return;
    var html = '<div class="lightbox"><img id="bigImg" alt=""></div>' +
      '<div class="field"><label>제목</label><input id="pTitle" value="' + U.esc(p.title || '') + '"></div>' +
      '<div class="grid two">' +
        '<div class="field"><label>만든 날짜</label><input id="pDate" type="date" value="' + U.esc(p.date || '') + '"></div>' +
        '<div class="field"><label>태그 (쉼표로 구분)</label><input id="pTags" value="' + U.esc((p.tags || []).join(', ')) + '" placeholder="생화, 2단, 웨딩"></div>' +
      '</div>' +
      '<div class="field"><label>메모</label><textarea id="pMemo">' + U.esc(p.memo || '') + '</textarea></div>' +
      '<div class="row end"><button class="btn danger" id="pDel">삭제</button>' +
      '<button class="btn ghost" id="pClose">닫기</button><button class="btn" id="pSave">저장</button></div>';

    U.modal(p.title || '사진', html, function (body) {
      DB.photoGet(id).then(function (blob) {
        if (!blob) return;
        var url = URL.createObjectURL(blob);
        var img = U.$('#bigImg', body);
        if (img) { img.src = url; img.onload = function () { setTimeout(function () { URL.revokeObjectURL(url); }, 3000); }; }
      });
      U.$('#pClose', body).onclick = U.closeModal;
      U.$('#pSave', body).onclick = function () {
        DB.upsert('photos', {
          id: id,
          title: U.$('#pTitle', body).value.trim(),
          date: U.$('#pDate', body).value,
          tags: U.$('#pTags', body).value.split(',').map(function (s) { return s.trim(); }).filter(Boolean),
          memo: U.$('#pMemo', body).value.trim()
        });
        U.closeModal(); U.toast('저장했어요'); App.render();
      };
      U.$('#pDel', body).onclick = function () {
        if (!U.confirmBox('이 사진을 삭제할까요?')) return;
        DB.photoDel(id).finally(function () {
          try { Sync.dropPhoto(id); } catch (e) { }
          DB.remove('photos', id); U.closeModal(); U.toast('삭제했어요'); App.render();
        });
      };
    });
  }

  function bind(view) {
    var input = U.$('#photoInput', view);
    input.onchange = function () { handleFiles(input.files); input.value = ''; };
    view.addEventListener('click', function (e) {
      var t = e.target;
      if (t.dataset.tag) { tagFilter = t.dataset.tag; App.render(); return; }
      var fig = t.closest('figure[data-photo]');
      if (fig) detail(fig.dataset.photo);
    });
  }

  return { render: render };
})();

/* ===== js/notify.js ===== */
/* 고객 알림 - 주문 당일 / 픽업 전날 / 픽업 후 3가지 문자
   문자는 사장님 요금제의 기본 제공 문자를 쓰기 때문에 추가 비용이 들지 않습니다.
   (버튼을 누르면 문자앱이 내용이 채워진 채로 열립니다) */
window.Notify = (function () {

  var STAGES = [
    { key: 'orderDay',    label: '주문 당일',  emoji: '🧾', desc: '주문을 받은 날 보내는 확인 문자' },
    { key: 'dayBefore',   label: '픽업 전날',  emoji: '⏰', desc: '픽업 하루 전에 보내는 안내 문자' },
    { key: 'afterPickup', label: '픽업 후',    emoji: '💐', desc: '픽업이 끝난 뒤 보내는 감사 문자' }
  ];

  /* ---------- 문구 만들기 ---------- */
  function buildMessage(stageKey, order) {
    var t = DB.templates()[stageKey] || '';
    var set = DB.settings();
    var price = U.toNum(order.price), dep = U.toNum(order.deposit);
    var map = {
      '가게이름': set.shopName || '내 가게',
      '고객명': order.customerName || '',
      '픽업일': U.korDate(order.pickupDate),
      '픽업시간': order.pickupTime || '',
      '주문내용': (order.request || '').replace(/\n/g, ' '),
      '금액': U.won(price),
      '예약금': U.won(dep),
      '잔금': U.won(Math.max(0, price - dep)),
      '참고사항': order.note || ''
    };
    return t.replace(/\{\{\s*([^}]+?)\s*\}\}/g, function (m, k) {
      return map.hasOwnProperty(k) ? map[k] : m;
    });
  }

  /* ---------- 보낼 대상 찾기 ----------
     아직 안 보낸 건은 날짜가 지나도 사라지지 않고 "놓침"으로 남습니다. */
  function queue() {
    var today = U.today();
    var tomorrow = U.addDays(today, 1);
    var orders = DB.list('orders').filter(function (o) { return o.status !== 'canceled'; });

    function sent(o, k) { return !!(o.notify && o.notify[k] && o.notify[k].sent); }
    function withLate(o, isLate) { return { order: o, late: isLate }; }

    var q = { orderDay: [], dayBefore: [], afterPickup: [] };

    orders.forEach(function (o) {
      var od = o.orderDate || (o.createdAt || '').slice(0, 10);

      // 주문 당일 - 주문받은 날. 못 보냈으면 7일까지 놓침으로 남김
      if (od && !sent(o, 'orderDay')) {
        var dOrder = U.diffDays(od, today);
        if (dOrder >= 0 && dOrder <= 7) q.orderDay.push(withLate(o, dOrder >= 1));
      }

      // 픽업 전날 - 내일 픽업이면 오늘 발송. 픽업 당일까지 못 보냈으면 놓침
      if (!sent(o, 'dayBefore') && o.pickupDate >= today) {
        if (o.pickupDate === tomorrow) q.dayBefore.push(withLate(o, false));
        else if (o.pickupDate === today) q.dayBefore.push(withLate(o, true));
      }

      // 픽업 후 - 픽업이 끝난 뒤. 7일까지 남김
      if (!sent(o, 'afterPickup')) {
        var dPick = U.diffDays(o.pickupDate, today);
        if (dPick >= 1 && dPick <= 7) q.afterPickup.push(withLate(o, dPick >= 2));
        else if (dPick === 0 && o.status === 'done') q.afterPickup.push(withLate(o, false));
      }
    });

    // 픽업이 가까운 순서로
    Object.keys(q).forEach(function (k) {
      q[k].sort(function (a, b) { return (a.order.pickupDate || '').localeCompare(b.order.pickupDate || ''); });
    });
    return q;
  }

  function totalCount() {
    var q = queue();
    return STAGES.reduce(function (a, s) { return a + q[s.key].length; }, 0);
  }

  function markSent(orderId, stage, value) {
    var o = DB.find('orders', orderId); if (!o) return;
    var n = Object.assign({}, o.notify || {});
    n[stage] = value ? { sent: true, at: new Date().toISOString() } : { sent: false, at: '' };
    DB.upsert('orders', { id: orderId, notify: n });
  }

  // 최근에 보낸 기록
  function history(limit) {
    var out = [];
    DB.list('orders').forEach(function (o) {
      STAGES.forEach(function (s) {
        var rec = o.notify && o.notify[s.key];
        if (rec && rec.sent && rec.at) out.push({ order: o, stage: s, at: rec.at });
      });
    });
    out.sort(function (a, b) { return b.at.localeCompare(a.at); });
    return out.slice(0, limit || 10);
  }

  /* ---------- 화면 ---------- */
  function render(view) {
    var q = queue();
    var total = STAGES.reduce(function (a, s) { return a + q[s.key].length; }, 0);
    var set = DB.settings();
    var lateCount = STAGES.reduce(function (a, s) {
      return a + q[s.key].filter(function (x) { return x.late; }).length;
    }, 0);

    view.innerHTML = '' +
      '<div class="card">' +
        '<h2>💬 오늘 보낼 알림 ' + (total ? '<span class="badge">' + total + '건</span>' : '') + '</h2>' +
        '<p class="hint">사장님 요금제의 기본 문자를 쓰기 때문에 <b>추가 비용이 들지 않습니다.</b> ' +
        '[문자 보내기]를 누르면 휴대폰 문자앱이 내용이 채워진 채로 열려요. 보내기만 누르시면 됩니다.</p>' +
        '<div class="grid three">' +
          STAGES.map(function (s) {
            return '<div class="stat ' + (q[s.key].length ? 'rose' : '') + '">' +
              '<div class="label">' + s.emoji + ' ' + s.label + '</div>' +
              '<div class="value">' + q[s.key].length + '건</div></div>';
          }).join('') +
        '</div>' +
        (lateCount ? '<div class="warn" style="margin-top:12px">⚠️ 보낼 때를 <b>놓친 알림이 ' + lateCount + '건</b> 있어요. ' +
          '아래 <span class="badge red">놓침</span> 표시를 확인해 주세요.</div>' : '') +
        (total ? '<div class="row" style="margin-top:12px"><button class="btn" id="startSend">📱 순서대로 보내기 시작</button>' +
          '<span class="cap-sub">한 건 보낼 때마다 다음 사람으로 넘어갑니다</span></div>' : '') +
      '</div>' +

      STAGES.map(function (s) { return stageCard(s, q[s.key]); }).join('') +

      historyCard() +

      '<div class="card">' +
        '<h2>💻 컴퓨터에서 무료로 문자 보내기</h2>' +
        '<p class="hint">휴대폰을 들지 않고 컴퓨터에서 바로 보내고 싶다면, 아래 서비스로 휴대폰을 연결해 두세요. ' +
        '문자는 사장님 휴대폰에서 나가므로 <b>추가 요금이 없습니다.</b></p>' +
        '<div class="row">' +
          '<button class="btn ghost small" data-open="https://messages.google.com/web">안드로이드 · 메시지 웹</button>' +
          '<button class="btn ghost small" data-open="https://www.samsung.com/sec/apps/samsung-messages/">갤럭시 · 삼성 메시지</button>' +
        '</div>' +
        '<p class="hint" style="margin-top:8px">아이폰은 같은 애플 계정의 맥에서 메시지 앱으로 보낼 수 있어요.</p>' +
      '</div>' +

      '<div class="card">' +
        '<h2>✍️ 알림 문구 편집</h2>' +
        '<p class="hint">중괄호 두 개로 감싼 부분은 주문 내용으로 자동으로 바뀝니다: ' +
        ['가게이름', '고객명', '픽업일', '픽업시간', '주문내용', '금액', '예약금', '잔금'].map(function (v) {
          return '<code>{{' + v + '}}</code>';
        }).join(' ') + '</p>' +
        STAGES.map(function (s) {
          return '<div class="field"><label>' + s.emoji + ' ' + s.label + ' <span style="font-weight:400">— ' + s.desc + '</span></label>' +
            '<textarea data-tpl="' + s.key + '" style="min-height:110px">' + U.esc(DB.templates()[s.key]) + '</textarea></div>';
        }).join('') +
        '<div class="row end"><button class="btn ghost" id="tplReset">기본 문구로 되돌리기</button>' +
        '<button class="btn" id="tplSave">문구 저장</button></div>' +
      '</div>' +

      '<div class="card">' +
        '<h2>⚙️ 예약 받는 방식</h2>' +
        '<div class="field"><select id="resSource" style="max-width:340px">' +
          '<option value="manual"' + (set.reservationSource === 'manual' ? ' selected' : '') + '>직접 입력 (주문서에 사장님이 입력)</option>' +
          '<option value="paste"' + (set.reservationSource === 'paste' ? ' selected' : '') + '>채팅 내용 붙여넣기</option>' +
        '</select></div>' +
        '<p class="hint">주문서 화면의 [💬 채팅 내용으로 주문 만들기]는 어느 쪽을 골라도 언제든 쓸 수 있어요. ' +
        '이 설정은 주문서의 <b>주문 경로 기본값</b>만 정합니다.</p>' +
        '<div class="warn">📱 정해진 시각에 <b>사장님이 안 눌러도 자동으로</b> 문자가 나가게 하려면 문자 발송 서비스 가입 · ' +
        '발신번호 사전등록 · 작은 서버가 필요하고 건당 10~20원이 듭니다. 주문이 많아져 손으로 보내기 번거로워지면 그때 붙이면 됩니다.</div>' +
      '</div>';

    bind(view);
  }

  function stageCard(stage, list) {
    var body = list.length ? list.map(function (x, i) {
      var o = x.order;
      var msg = buildMessage(stage.key, o);
      return '<div class="q-item send-item" data-order="' + o.id + '" data-stage="' + stage.key + '">' +
        '<div class="row">' +
          '<span class="badge gray">' + (i + 1) + ' / ' + list.length + '</span>' +
          '<b>' + U.esc(o.customerName) + '</b>' +
          '<span class="cap-sub">' + U.esc(U.phone(o.phone) || '연락처 없음') + '</span>' +
          (x.late ? '<span class="badge red">놓침</span>' : '') +
          '<div class="spacer"></div>' +
          '<span class="badge">픽업 ' + U.korDate(o.pickupDate) + ' ' + U.esc(o.pickupTime || '') + '</span></div>' +
        '<div class="q-msg">' + U.esc(msg) + '</div>' +
        '<div class="row">' +
          (U.phoneDigits(o.phone) ? '<button class="btn small" data-sms>📱 문자 보내기</button>'
                                  : '<span class="badge red">연락처가 없어 문자를 보낼 수 없어요</span>') +
          '<button class="btn ghost small" data-copy>📋 카톡용 복사</button>' +
          '<button class="btn mint small" data-mark>✓ 보냄 표시</button>' +
        '</div></div>';
    }).join('') : '<div class="empty">지금 보낼 ' + stage.label + ' 알림이 없어요.</div>';

    return '<div class="card" id="stage-' + stage.key + '"><h2>' + stage.emoji + ' ' + stage.label +
      (list.length ? ' <span class="badge">' + list.length + '</span>' : '') + '</h2>' +
      '<p class="hint">' + stage.desc + '</p>' + body + '</div>';
  }

  function historyCard() {
    var h = history(10);
    if (!h.length) return '';
    return '<details class="card adv"><summary>📮 보낸 기록 ' +
      '<span class="cap-sub">(최근 ' + h.length + '건)</span></summary>' +
      '<div class="table-wrap" style="margin-top:12px"><table>' +
      '<thead><tr><th>보낸 때</th><th>고객</th><th>종류</th><th></th></tr></thead><tbody>' +
      h.map(function (x) {
        return '<tr><td>' + U.korDate(x.at.slice(0, 10)) + ' ' + U.esc(x.at.slice(11, 16)) + '</td>' +
          '<td>' + U.esc(x.order.customerName) + '</td>' +
          '<td>' + x.stage.emoji + ' ' + x.stage.label + '</td>' +
          '<td class="num"><button class="btn ghost small" data-undo="' + x.order.id + '" data-undo-stage="' + x.stage.key + '">되돌리기</button></td></tr>';
      }).join('') + '</tbody></table></div></details>';
  }

  /* ---------- 문자앱 열기 ---------- */
  function smsLink(phone, text) {
    var num = U.phoneDigits(phone);
    var isIOS = /iP(hone|ad|od)|Macintosh/.test(navigator.userAgent) && 'ontouchend' in document;
    var sep = isIOS ? '&' : '?';
    return 'sms:' + num + sep + 'body=' + encodeURIComponent(text);
  }

  function bind(view) {
    view.addEventListener('click', function (e) {
      var t = e.target;

      if (t.dataset.open) { window.open(t.dataset.open, '_blank', 'noopener'); return; }

      if (t.dataset.undo) {
        markSent(t.dataset.undo, t.dataset.undoStage, false);
        U.toast('안 보낸 상태로 되돌렸어요'); App.render(); return;
      }

      var item = t.closest('.send-item');
      if (item) {
        var id = item.dataset.order, stage = item.dataset.stage;
        var o = DB.find('orders', id);
        if (!o) return;
        var msg = buildMessage(stage, o);
        if (t.hasAttribute('data-sms')) {
          window.location.href = smsLink(o.phone, msg);
          setTimeout(function () { markSent(id, stage, true); next(); }, 1200);
        }
        if (t.hasAttribute('data-copy')) U.copyText(msg);
        if (t.hasAttribute('data-mark')) { markSent(id, stage, true); next(); }
      }
    });

    // 보낸 뒤 남은 건수를 알려주고 다음 대상으로 이동
    function next() {
      var left = totalCount();
      U.toast(left ? '보냄 표시 완료 — ' + left + '건 남았어요' : '오늘 보낼 알림을 모두 끝냈어요 🎉');
      App.render();
      if (left) scrollToFirst();
    }
    function scrollToFirst() {
      setTimeout(function () {
        var first = U.$('.send-item');
        if (!first) return;
        first.scrollIntoView({ behavior: 'smooth', block: 'center' });
        first.style.outline = '2px solid var(--rose)';
        setTimeout(function () { first.style.outline = ''; }, 1600);
      }, 60);
    }

    var start = U.$('#startSend', view);
    if (start) start.onclick = scrollToFirst;

    U.$('#tplSave', view).onclick = function () {
      var t = {};
      U.$$('[data-tpl]', view).forEach(function (ta) { t[ta.dataset.tpl] = ta.value; });
      DB.saveTemplates(t); U.toast('문구를 저장했어요'); App.render();
    };
    U.$('#tplReset', view).onclick = function () {
      if (!U.confirmBox('기본 문구로 되돌릴까요?')) return;
      DB.write('templates', {}); U.toast('되돌렸어요'); App.render();
    };
    U.$('#resSource', view).onchange = function () {
      DB.saveSettings({ reservationSource: this.value });
      U.toast('예약 받는 방식을 바꿨어요');
    };
  }

  return { render: render, queue: queue, totalCount: totalCount,
           buildMessage: buildMessage, STAGES: STAGES };
})();

/* ===== js/sync.js ===== */
/* 이 컴퓨터의 자료와 서버(Supabase)를 맞춰 주는 부분
   - 입력은 언제나 이 컴퓨터에 먼저 저장됩니다 (인터넷이 끊겨도 일이 멈추지 않게)
   - 잠시 뒤 자동으로 서버에 올라가고, 다른 기기에서 로그인하면 그대로 보입니다 */
window.Sync = (function () {

  var state = { busy: false, lastAt: null, error: '', pending: 0 };
  var timer = null;
  var listeners = [];

  function onChange(fn) { listeners.push(fn); }
  function emit() {
    state.pending = DB.dirtyCount();
    listeners.forEach(function (fn) { try { fn(state); } catch (e) {} });
  }
  function status() { state.pending = DB.dirtyCount(); return state; }

  function tms(v) { var t = Date.parse(v || ''); return isNaN(t) ? 0 : t; }

  /* ---------- 서버에서 받아오기 ---------- */
  function pull() {
    return Promise.all([SB.pullAll(), SB.pullSettings()]).then(function (res) {
      var rows = res[0] || [], st = res[1];
      var byCol = {};
      rows.forEach(function (r) { (byCol[r.collection] = byCol[r.collection] || []).push(r); });

      DB.SYNCED.forEach(function (col) {
        var dirty = DB.dirtyMap(col);
        var map = {};
        DB.list(col).forEach(function (x) { if (x && x.id) map[x.id] = x; });

        (byCol[col] || []).forEach(function (r) {
          if (dirty[r.rec_id]) return;              // 아직 못 보낸 내 변경이 우선
          if (r.deleted) { delete map[r.rec_id]; return; }
          var cur = map[r.rec_id];
          if (!cur || tms(r.updated_at) > tms(cur.updatedAt)) {
            map[r.rec_id] = Object.assign({}, r.data, { id: r.rec_id });
          }
        });

        DB.write(col, Object.keys(map).map(function (k) { return map[k]; }));
      });

      if (st && !DB.read('dirty:settings', false)) {
        if (st.settings && Object.keys(st.settings).length) DB.write('settings', st.settings);
        if (st.templates && Object.keys(st.templates).length) DB.write('templates', st.templates);
      }
      return rows.length;
    });
  }

  /* ---------- 서버로 올리기 ---------- */
  function push() {
    var rows = [], touched = {};
    DB.SYNCED.forEach(function (col) {
      var dirty = DB.dirtyMap(col);
      var ids = Object.keys(dirty);
      if (!ids.length) return;
      touched[col] = ids;
      var map = {};
      DB.list(col).forEach(function (x) { if (x && x.id) map[x.id] = x; });
      var now = new Date().toISOString();
      ids.forEach(function (id) {
        var item = map[id];
        var gone = dirty[id] === 'd' || !item;
        rows.push({
          user_id: SB.userId(), collection: col, rec_id: id,
          data: gone ? {} : item, deleted: gone, updated_at: now
        });
      });
    });

    var settingsDirty = DB.read('dirty:settings', false);
    if (!rows.length && !settingsDirty) return Promise.resolve(0);

    // 한 번에 너무 많이 보내지 않도록 나눠서 올립니다
    var chunks = [];
    for (var i = 0; i < rows.length; i += 200) chunks.push(rows.slice(i, i + 200));

    var job = chunks.reduce(function (chain, c) {
      return chain.then(function () { return SB.pushRecords(c); });
    }, Promise.resolve());

    if (settingsDirty) {
      job = job.then(function () { return SB.pushSettings(DB.settings(), DB.templates()); });
    }

    return job.then(function () {
      Object.keys(touched).forEach(function (col) { DB.clearDirty(col, touched[col]); });
      if (settingsDirty) DB.write('dirty:settings', false);
      return rows.length;
    });
  }

  /* ---------- 사진 파일 (서버 사진 보관함) ----------
     글자 자료와 달리 사진은 용량이 커서 따로 올립니다.
     "이 컴퓨터에서 이미 올린 사진" 목록은 기기마다 다르므로 서버와 맞추지 않습니다. */
  function upMap() { return DB.read('photoUp', {}) || {}; }
  function markUp(id) { var m = upMap(); m[id] = 1; DB.write('photoUp', m); }

  function syncPhotos() {
    if (!SB.loggedIn() || !SB.uploadPhoto) return Promise.resolve(0);
    var metas = DB.list('photos');
    if (!metas.length) return Promise.resolve(0);
    var up = upMap(), got = 0;

    return metas.slice(0, 300).reduce(function (chain, p) {
      return chain.then(function () {
        return DB.photoGet(p.id).then(function (blob) {
          if (blob) {
            if (up[p.id]) return null;                 // 이미 올린 사진은 건너뜁니다
            return SB.uploadPhoto(p.id, blob).then(function () { markUp(p.id); });
          }
          // 이 컴퓨터에 사진 파일이 없으면 = 다른 기기에서 올린 사진 → 내려받습니다
          return SB.downloadPhoto(p.id).then(function (remote) {
            if (!remote) return null;
            markUp(p.id); got++;
            return DB.photoPut(p.id, remote);
          });
        });
      }).catch(function () { return null; });           // 한 장 실패해도 나머지는 계속
    }, Promise.resolve()).then(function () { return got; });
  }

  // 사진을 지울 때 서버 보관함에서도 지웁니다
  function dropPhoto(id) {
    var m = upMap(); delete m[id]; DB.write('photoUp', m);
    if (!SB.loggedIn() || !SB.deletePhoto) return Promise.resolve();
    return SB.deletePhoto(id).catch(function () { });
  }

  /* ---------- 올리고 받아오기 ---------- */
  function run(opts) {
    opts = opts || {};
    if (state.busy) return Promise.resolve(state);
    if (!SB.loggedIn()) return Promise.resolve(state);
    state.busy = true; state.error = ''; emit();

    var newPhotos = 0;
    return push()
      .then(function () { return opts.pushOnly ? null : pull(); })
      .then(function () { return opts.pushOnly ? 0 : syncPhotos(); })
      .then(function (n) {
        newPhotos = n || 0;
        if (newPhotos > 0) U.toast('사진 ' + newPhotos + '장을 내려받았어요');
        state.busy = false;
        state.lastAt = new Date().toISOString();
        state.error = '';
        emit();
        if (opts.rerender !== false && typeof App !== 'undefined') App.render();
        return state;
      })
      .catch(function (e) {
        state.busy = false;
        state.error = e.message || '동기화에 실패했어요.';
        emit();
        return state;
      });
  }

  /* ---------- 바뀐 게 있으면 잠시 뒤 자동으로 올리기 ---------- */
  function start() {
    stop();
    timer = setInterval(function () {
      if (!SB.loggedIn() || state.busy) return;
      if (DB.dirtyCount() > 0) run({ pushOnly: true, rerender: false });
    }, 5000);
    window.addEventListener('beforeunload', function () {
      // 창을 닫기 전에 남은 변경을 한 번 더 보냅니다
      if (SB.loggedIn() && DB.dirtyCount() > 0) { try { push(); } catch (e) {} }
    });
  }
  function stop() { if (timer) { clearInterval(timer); timer = null; } }

  function lastText() {
    if (state.busy) return '저장하는 중...';
    if (state.error) return '서버 저장 실패 — ' + String(state.error).split('\n')[0];
    var n = DB.dirtyCount();
    if (n > 0) return '보낼 변경 ' + n + '건 (곧 자동 저장됩니다)';
    if (!state.lastAt) return '아직 서버와 맞춘 적 없음';
    var d = new Date(state.lastAt);
    return '서버에 저장됨 · ' + U.pad(d.getHours()) + ':' + U.pad(d.getMinutes());
  }

  return {
    pull: pull, push: push, run: run, start: start, stop: stop,
    syncPhotos: syncPhotos, dropPhoto: dropPhoto,
    status: status, onChange: onChange, lastText: lastText
  };
})();

/* ===== js/auth.js ===== */
/* 회원가입 · 로그인 · 이용 기간(무료 체험 / 구독) 화면 */
window.Auth = (function () {

  var PRICE = 9900;             // 월 구독료
  var PRICE_YEAR = 99000;       // 연 구독료 (2개월 무료)
  var TRIAL_MONTHS = 3;         // 무료 체험 기간

  /* 무통장입금 받을 계좌 — 관리자가 구독 화면에서 직접 입력합니다 (서버에 저장) */
  var BANK = { bank: '', account: '', holder: '' };
  function bankReady() { return !!(BANK.bank && BANK.account && BANK.holder); }

  /* 카드결제(토스페이먼츠) — 클라이언트 키만 브라우저에 둡니다 (공개용 키).
     실제 결제 승인은 서버(Supabase 함수)에서 시크릿 키로 처리합니다. */
  var CARD = { on: false, clientKey: '' };
  function cardReady() {
    return !!(CARD.on && CARD.clientKey && /^https?:$/.test(location.protocol));
  }
  function loadBank() {
    return SB.getServiceConfig().then(function (c) {
      if (c) {
        BANK = { bank: c.bank_name || '', account: c.bank_account || '', holder: c.bank_holder || '' };
        CARD = { on: !!c.card_enabled, clientKey: c.toss_client_key || '' };
      }
      return BANK;
    }).catch(function () { return BANK; });
  }

  /* 토스 결제창 SDK 를 필요할 때만 불러옵니다 (인터넷 없이 쓸 때 방해되지 않도록) */
  var sdkPromise = null;
  function loadTossSdk() {
    if (window.TossPayments) return Promise.resolve(window.TossPayments);
    if (sdkPromise) return sdkPromise;
    sdkPromise = new Promise(function (resolve, reject) {
      var s = document.createElement('script');
      s.src = 'https://js.tosspayments.com/v2/standard';
      s.onload = function () {
        if (window.TossPayments) resolve(window.TossPayments);
        else reject(new Error('결제창을 불러오지 못했어요'));
      };
      s.onerror = function () { sdkPromise = null; reject(new Error('결제창을 불러오지 못했어요. 인터넷 연결을 확인해 주세요.')); };
      document.head.appendChild(s);
    });
    return sdkPromise;
  }

  /* 카드결제 시작: 서버가 주문번호와 금액을 정한 뒤 결제창을 띄웁니다 */
  function payByCard(plan, btn) {
    if (!cardReady()) { U.toast('카드결제는 인터넷 주소로 접속했을 때만 됩니다'); return; }
    if (btn) btn.disabled = true;
    var order = null;
    SB.startCardPayment(plan).then(function (row) {
      order = Array.isArray(row) ? row[0] : row;
      if (!order || !order.order_id) throw new Error('주문을 만들지 못했어요');
      return loadTossSdk();
    }).then(function (TossPayments) {
      var amount = Number(order.amount);
      var name = (plan === 'yearly' ? '1인CEO 운영노트 연 구독' : '1인CEO 운영노트 월 구독');
      var payment = TossPayments(CARD.clientKey).payment({ customerKey: SB.userId() });
      var base = location.origin + location.pathname;
      return payment.requestPayment({
        method: 'CARD',
        amount: { currency: 'KRW', value: amount },
        orderId: order.order_id,
        orderName: name,
        successUrl: base + '?toss=success',
        failUrl: base + '?toss=fail',
        customerEmail: (SB.user() || {}).email || undefined,
        customerName: (access && access.owner_name) || undefined,
        card: { useEscrow: false, flowMode: 'DEFAULT', useCardPoint: false, useAppCardOnly: false }
      });
    }).catch(function (err) {
      if (btn) btn.disabled = false;
      var m = (err && (err.message || err.code)) || '결제를 시작하지 못했어요';
      if (order && order.order_id) SB.failCardPayment(order.order_id, String(err && err.code || ''));
      U.toast(m);
    });
  }

  /* 결제창에서 돌아왔을 때 (주소에 ?toss=... 가 붙어 있음) */
  function handleTossReturn() {
    var q = new URLSearchParams(location.search);
    var kind = q.get('toss');
    if (!kind) return Promise.resolve(false);

    function clean() {
      try { history.replaceState(null, '', location.pathname + (location.hash || '#subscribe')); } catch (e) {}
    }

    if (kind === 'fail') {
      var oid = q.get('orderId');
      var why = q.get('message') || '결제가 취소되었어요';
      if (oid) SB.failCardPayment(oid, q.get('code') || '');
      clean();
      U.toast(why);
      return Promise.resolve(false);
    }

    var paymentKey = q.get('paymentKey'), orderId = q.get('orderId'), amount = Number(q.get('amount'));
    if (!paymentKey || !orderId || !amount) { clean(); return Promise.resolve(false); }

    U.toast('결제를 확인하는 중입니다...');
    return SB.confirmCardPayment({ paymentKey: paymentKey, orderId: orderId, amount: amount })
      .then(function () {
        clean();
        return refreshAccess();
      })
      .then(function () {
        U.toast('결제가 완료되었어요. 이용 기간이 늘어났습니다 🎉');
        return true;
      })
      .catch(function (err) {
        clean();
        U.toast('결제 확인 실패 — ' + (err.message || '잠시 뒤 구독 화면에서 다시 확인해 주세요'));
        return false;
      });
  }
  var access = null;            // { shop_name, trial_ends_at, subscribed_until, active, days_left }
  var mode = 'login';           // 'login' | 'signup' | 'reset'
  var recovering = false;       // 비밀번호 재설정 링크로 들어온 상태
  function isRecovering() { return recovering; }
  function setRecovering(v) { recovering = !!v; }

  function info() { return access; }
  function setAccess(a) { access = a; return a; }

  function refreshAccess() {
    if (!SB.loggedIn()) { access = null; return Promise.resolve(null); }
    return SB.myAccess().then(setAccess).catch(function () { return access; });
  }

  // 결제하지 않아도 되는 상태인지
  function active() { return !!(access && access.active); }
  function onTrial() {
    return !!(access && access.trial_ends_at && Date.now() < Date.parse(access.trial_ends_at)
              && !(access.subscribed_until && Date.now() < Date.parse(access.subscribed_until)));
  }
  function daysLeft() { return access ? Number(access.days_left || 0) : 0; }

  /* ================= 로그인 전 화면 ================= */
  function renderGate(view) {
    view.innerHTML =
      '<div class="card auth-card">' +
        '<div class="auth-hero">' +
          '<div class="auth-logo">📒</div>' +
          '<h2>1인CEO 운영노트</h2>' +
          '<p class="hint">주문 · 달력 · 정산 · 재고 · 원가 · 갤러리 · 고객알림을 한 곳에서.<br>' +
          '<b>가입 후 ' + TRIAL_MONTHS + '개월 무료</b>, 이후 월 ' + U.won(PRICE) + '.</p>' +
        '</div>' +
        '<div class="row auth-tabs">' +

  function featureCard() {
    var items = [
      ['📝', '주문 · 달력', '주문서를 적으면 픽업 날짜에 자동으로 표시'],
      ['📊', '월별 정산', '매출 · 원가 · 이익을 한 표에서, 엑셀로 저장'],
      ['📦', '재고', '포장재 · 부자재가 부족하면 미리 알림'],
      ['🖼️', '갤러리', '완성한 작업 사진을 태그로 정리'],
      ['💰', '원가표', '메뉴 이름만 적으면 원가와 판매가 계산'],
      ['💬', '고객 알림', '주문 당일 · 픽업 전날 · 픽업 후 문자 자동 작성']

  function msg(html, kind) {
    var el = U.$('#authMsg');
    if (el) el.innerHTML = '<div class="' + (kind || 'warn') + '" style="margin-top:12px;white-space:pre-wrap">' + html + '</div>';
  }

  function bindGate(view) {
    view.addEventListener('click', function (e) {
      var m = e.target.dataset && e.target.dataset.mode;
      if (m) { mode = m; App.render(); }
    });

    var lf = U.$('#loginForm', view);
    if (lf) lf.onsubmit = function (e) {
      e.preventDefault();
      var f = e.target;
      if (!f.email.value.trim() || !f.password.value) { msg('이메일과 비밀번호를 모두 적어주세요.'); return; }
      busy(f, true); msg('로그인 중...', 'info');
      SB.signIn(f.email.value, f.password.value)
        .then(function () { return afterLogin(); })
        .catch(function (err) { busy(f, false); msg(U.esc(err.message)); });
    };

    var sf = U.$('#signupForm', view);
    if (sf) sf.onsubmit = function (e) {
      e.preventDefault();
      var f = e.target;
      var shop = f.shopName.value.trim();
      if (!shop) { msg('가게 이름을 적어주세요.'); return; }
      if (!f.email.value.trim()) { msg('이메일을 적어주세요.'); return; }
      if ((f.password.value || '').length < 6) { msg('비밀번호는 6자 이상으로 정해주세요.'); return; }
      if (f.password.value !== f.password2.value) { msg('두 비밀번호가 서로 달라요.'); return; }
      if (!f.agree.checked) { msg('안내 내용에 동의해 주셔야 가입할 수 있어요.'); return; }

      busy(f, true); msg('가입하는 중...', 'info');
      SB.signUp({
        email: f.email.value, password: f.password.value, shopName: shop,
        ownerName: f.ownerName.value, ownerPhone: U.phone(f.ownerPhone.value.trim())
      }).then(function (r) {
        if (r.signedIn) return afterLogin(true);
        busy(f, false);
        msg('가입 신청이 됐어요! <b>' + U.esc(f.email.value.trim()) + '</b> 으로 보낸 인증 메일의 링크를 눌러주세요.<br>' +
            '인증을 마치면 [로그인]으로 들어오시면 됩니다.', 'info');
      }).catch(function (err) { busy(f, false); msg(U.esc(err.message)); });
    };

    var rf = U.$('#resetForm', view);
    if (rf) rf.onsubmit = function (e) {
      e.preventDefault();
      var f = e.target;
      busy(f, true);
      SB.resetPassword(f.email.value).then(function () {
        busy(f, false);
        msg('재설정 메일을 보냈어요. 메일함을 확인해 주세요.', 'info');
      }).catch(function (err) { busy(f, false); msg(U.esc(err.message)); });
    };
  }

  function busy(form, on) {
    U.$$('button, input', form).forEach(function (el) { el.disabled = on; });
  }

  /* 로그인 직후: 이 컴퓨터 자료를 계정별로 분리하고 서버와 맞춥니다 */
  function afterLogin(isNew) {
    DB.setScope(SB.userId());
    msg('자료를 불러오는 중...', 'info');
    return refreshAccess().then(function () {
      return Sync.run({ rerender: false });
    }).then(function () {
      Sync.start();
      // 가입할 때 적은 가게 이름을 앱 설정에도 반영
      if (access && access.shop_name) {
        var s = DB.settings();
        if (!s.shopName || s.shopName === '내 가게' || isNew) {
          DB.saveSettings({ shopName: access.shop_name, ownerPhone: access.owner_phone || s.ownerPhone });
        }
      }
      location.hash = '#home';
      App.render(); App.refreshShopName();
      U.toast(isNew ? '환영합니다! ' + TRIAL_MONTHS + '개월 무료로 시작합니다 🎉' : '로그인했어요');
    });
  }

  function signOut() {
    if (!U.confirmBox('로그아웃할까요?\n이 컴퓨터에 남은 자료는 다시 로그인하면 그대로 보입니다.')) return;
    Sync.run({ pushOnly: true, rerender: false }).finally(function () {
      Sync.stop();
      SB.signOut().finally(function () {
        access = null;
        DB.setScope(null);
        mode = 'login';
        location.hash = '#home';
        App.render();
        U.toast('로그아웃했어요');
      });
    });
  }

        '<div class="info"><b>지금까지 쌓인 자료는 안전합니다.</b> 주문·정산·재고를 <b>계속 보실 수 있고</b>, ' +
        '엑셀(CSV)과 백업 파일로 <b>내려받기도 됩니다.</b> 새로 저장하고 고치는 것만 잠겨 있어요.</div>' +
        '<div class="price-box">' +
          '<div class="price-amt">' + U.won(PRICE) + '<span>/ 월</span></div>' +

        '</div>' +
        '<div class="row"><button class="btn wide" data-go="subscribe">구독 시작하기</button></div>' +

  /* ================= 구독 / 결제 화면 ================= */
  function renderSubscribe(view) {
    var a = access || {};
    var until = a.subscribed_until ? String(a.subscribed_until).slice(0, 10) : '';
    var trialEnd = a.trial_ends_at ? String(a.trial_ends_at).slice(0, 10) : '';

    view.innerHTML =
      '<div class="card">' +
        '<h2>💳 구독</h2>' +
        '<div class="grid three">' +
          tile('가게', U.esc(a.shop_name || '-'), '') +
          tile('상태', active() ? (onTrial() ? '무료 체험 중' : '구독 중') : '이용 종료', active() ? 'mint' : 'red') +
          tile('남은 기간', daysLeft() + '일', daysLeft() <= 14 ? 'amber' : '') +
        '</div>' +
        '<p class="hint" style="margin-top:10px">' +
          (trialEnd ? '무료 체험 종료일: <b>' + U.korDateFull(trialEnd) + '</b><br>' : '') +

        '<h2>요금제</h2>' +
        '<div class="grid two plans">' +
          planCard('monthly', '월 결제', PRICE, '매달 결제', '') +
          planCard('yearly', '연 결제', PRICE_YEAR, '1년치 한 번에', '2개월 무료') +
        '</div>' +
        '<p class="hint" style="margin-top:10px">부가세 포함 · 가입 후 ' + TRIAL_MONTHS + '개월 무료 · 언제든 해지</p>' +
      '</div>' +

      '<div class="card" id="cardBox" hidden>' +
        '<h2>💳 카드결제</h2>' +
        '<div id="cardState"></div>' +
      '</div>' +

      '<div class="card" id="payBox">' +
        '<h2>🏦 무통장입금</h2>' +
        '<p class="hint" id="bankLead">계좌이체로도 받고 있어요.</p>' +
        '<div id="payState"><p class="hint">확인하는 중...</p></div>' +
      '</div>' +

      '<div id="adminBox"></div>' +

      '<div class="card">' +
        '<h2>내 결제 내역</h2>' +
        '<div id="payList"><p class="hint">불러오는 중...</p></div>' +
      '</div>';

    loadBank().then(function () { bindSubscribe(view); });
    SB.myPayments().then(function (rows) {
      var box = U.$('#payList', view);

      box.innerHTML = '<div class="table-wrap"><table><thead><tr><th>날짜</th><th class="num">금액</th>' +

  function tile(label, value, cls) {
    return '<div class="stat ' + cls + '"><div class="label">' + label + '</div><div class="value">' + value + '</div></div>';
  }

  var chosenPlan = 'yearly';

  function planCard(plan, title, amount, sub, badge) {
    var perMonth = plan === 'yearly' ? Math.round(amount / 12) : amount;
    return '<label class="plan' + (chosenPlan === plan ? ' on' : '') + '" data-plan="' + plan + '">' +
      '<input type="radio" name="plan" value="' + plan + '"' + (chosenPlan === plan ? ' checked' : '') + '>' +
      '<div class="plan-body">' +
        '<div class="row" style="gap:6px"><b>' + title + '</b>' +
          (badge ? '<span class="badge mint">' + badge + '</span>' : '') + '</div>' +
        '<div class="plan-amt">' + U.won(amount) + '</div>' +
        '<div class="cap-sub">' + sub +
          (plan === 'yearly' ? ' · 한 달에 ' + U.won(perMonth) + ' 꼴' : '') + '</div>' +
      '</div></label>';
  }

  /* ---------- 무통장입금 안내 / 신청 ---------- */
  function bindSubscribe(view) {
    view.addEventListener('click', function (e) {
      var lab = e.target.closest('[data-plan]');
      if (lab) {
        chosenPlan = lab.dataset.plan;
        U.$$('.plan', view).forEach(function (el) { el.classList.toggle('on', el.dataset.plan === chosenPlan); });
        drawPayState(view);
        drawCardState(view);
      }
    });
    drawPayState(view);
    drawCardState(view);
    drawAdmin(view);
  }

  /* ---------- 카드결제 버튼 ---------- */
  function drawCardState(view) {
    var box = U.$('#cardBox', view), st = U.$('#cardState', view);
    if (!box || !st) return;
    var lead = U.$('#bankLead', view);

    if (!CARD.on || !CARD.clientKey) { box.hidden = true; if (lead) lead.innerHTML = '카드 자동결제는 준비 중입니다. 지금은 <b>계좌이체</b>로 받고 있어요.'; return; }
    box.hidden = false;
    if (lead) lead.innerHTML = '카드가 어려우시면 <b>계좌이체</b>로도 받습니다.';

    if (!/^https?:$/.test(location.protocol)) {
      st.innerHTML = '<div class="warn">카드결제는 <b>인터넷 주소(solopreneur111.co.kr)</b>로 접속하셨을 때만 됩니다.<br>' +
        '파일로 열어 쓰실 때는 아래 계좌이체를 이용해 주세요.</div>';
      return;
    }

    var amount = chosenPlan === 'yearly' ? PRICE_YEAR : PRICE;
    var label = chosenPlan === 'yearly' ? '연 결제' : '월 결제';
    st.innerHTML =
      '<div class="bank-box">' +
        '<div class="bank-row total"><span>' + label + ' 금액</span><b>' + U.won(amount) + '</b></div>' +
      '</div>' +
      '<button class="btn wide" id="payCard" style="margin-top:12px">카드로 결제하기</button>' +
      '<p class="hint" style="margin-top:8px">토스페이먼츠 결제창이 열립니다. 결제가 끝나면 바로 이용 기간이 늘어나요. ' +
      '카드 정보는 저희 쪽에 저장되지 않습니다.</p>';

    var btn = U.$('#payCard', view);
    if (btn) btn.onclick = function () { payByCard(chosenPlan, btn); };
  }

  function drawPayState(view) {
    var box = U.$('#payState', view);
    if (!box) return;
    SB.myPayments().then(function (rows) {
      var pending = (rows || []).filter(function (p) { return p.status === 'pending'; })[0];
      if (pending) { box.innerHTML = pendingHtml(pending); bindCancelHint(view); return; }
      box.innerHTML = requestHtml();
      var btn = U.$('#reqPay', view);
      if (btn) btn.onclick = function () {
        var who = (U.$('#depositor', view) || {}).value || '';
        if (!who.trim()) { U.toast('입금하실 분 이름을 적어주세요'); return; }
        btn.disabled = true;
        SB.requestBankTransfer(chosenPlan, who.trim()).then(function () {
          U.toast('입금 신청을 접수했어요');
          drawPayState(view);

          DB.importAll(data);
          U.toast('불러왔어요'); App.render(); App.refreshShopName();
        } catch (e) { U.toast('불러오기 실패: ' + e.message); }
      };
      reader.readAsText(f);
      file.value = '';
    };

    U.$('#seedBtn', view).onclick = function () {
      if (!U.confirmBox('예시 데이터를 추가할까요? (기존 자료는 지워지지 않아요)')) return;
      Seed.install(); U.toast('예시 데이터를 넣었어요'); App.render();
    };

    U.$('#resetBtn', view).onclick = function () {
      if (!U.confirmBox('정말 모든 자료를 지울까요? 되돌릴 수 없습니다.')) return;
      if (!U.confirmBox('마지막 확인입니다. 백업 파일은 받으셨나요?')) return;
      DB.clearAll(); DB.write('seeded', true);
      U.toast('초기화했어요'); App.render(); App.refreshShopName();
    };
  }

  return { render: render };
})();
