/* 홈 - 오늘 할 일 한눈에 보기 */
window.Home = (function () {

  function render(view) {
    var today = U.today();
    var tomorrow = U.addDays(today, 1);
    var month = U.thisMonth();
    var todayList = Orders.byDate(today).filter(function (o) { return o.status !== 'canceled'; });
    var tomorrowList = Orders.byDate(tomorrow).filter(function (o) { return o.status !== 'canceled'; });
    var live = Orders.byMonth(month).filter(function (o) { return o.status !== 'canceled'; });
    var sales = live.reduce(function (a, o) { return a + U.toNum(o.price); }, 0);
    // 원가는 월별정산과 똑같은 기준으로 (주문서 값 우선, 없으면 원가표에서)
    var cost = live.reduce(function (a, o) { return a + Cost.orderCost(o).value; }, 0);
    var q = Notify.queue();
    var notifyCount = Notify.STAGES.reduce(function (a, s) { return a + q[s.key].length; }, 0);
    var lowStock = DB.list('inventory').filter(Inventory.isLow);

    view.innerHTML = '' +
      '<div class="card">' +
        '<h2>👋 오늘도 좋은 하루 되세요!</h2>' +
        '<div class="grid four">' +
          tile('오늘 픽업', todayList.length + '건', todayList.length ? 'rose' : '') +
          tile('내일 픽업', tomorrowList.length + '건', '') +
          tile(U.monthTitle(month) + ' 매출', U.won(sales), 'mint') +
          tile('보낼 알림', notifyCount + '건', notifyCount ? 'amber' : '') +
        '</div>' +
      '</div>' +

      '<div class="card">' +
        '<h2>🎂 오늘 픽업 (' + U.korDateFull(today) + ')</h2>' +
        (todayList.length ? list(todayList) : '<div class="empty">오늘 픽업 예정이 없어요.</div>') +
      '</div>' +

      '<div class="card">' +
        '<h2>⏰ 내일 준비할 것</h2>' +
        (tomorrowList.length ? list(tomorrowList) : '<div class="empty">내일 픽업 예정이 없어요.</div>') +
      '</div>' +

      '<div class="card">' +
        '<h2>📊 이번 달 요약</h2>' +
        '<div class="grid four">' +
          tile('주문', live.length + '건', '') +
          tile('매출', U.won(sales), 'rose') +
          tile('원가', U.won(cost), 'amber') +
          tile('이익', U.won(sales - cost), 'mint') +
        '</div>' +
        '<div class="row" style="margin-top:12px"><button class="btn ghost small" data-go="monthly">월별정산 자세히 보기 →</button></div>' +
      '</div>' +

      (lowStock.length ? '<div class="card"><h2>📦 재고가 부족해요</h2>' +
        '<div class="warn">' + lowStock.map(function (i) {
          return U.esc(i.name) + ' <b>' + U.num(i.qty) + U.esc(i.unit || '개') + '</b> 남음';
        }).join('<br>') + '</div>' +
        '<div class="row" style="margin-top:12px"><button class="btn ghost small" data-go="inventory">재고 관리로 가기 →</button></div></div>' : '') +

      backupReminder() +

      '<div class="card">' +
        '<h2>⚡ 바로 가기</h2>' +
        '<div class="row">' +
          '<button class="btn" data-go="orders">📝 주문 등록</button>' +
          '<button class="btn ghost" data-go="cost">🧮 원가 계산</button>' +
          '<button class="btn ghost" data-go="notify">💬 알림 보내기</button>' +
          '<button class="btn ghost" data-go="gallery">🖼️ 갤러리</button>' +
        '</div>' +
      '</div>';

    view.addEventListener('click', function (e) {
      if (e.target.dataset.go) location.hash = '#' + e.target.dataset.go;
    });
  }

  function tile(label, value, cls) {
    return '<div class="stat ' + cls + '"><div class="label">' + label + '</div><div class="value">' + value + '</div></div>';
  }

  // 서버 저장이 막혀 있을 때만 알려줍니다 (평소에는 아무것도 띄우지 않습니다)
  function backupReminder() {
    var st;
    try { st = Sync.status(); } catch (err) { return ''; }
    if (!SB.loggedIn()) return '';
    if (!st.error && st.pending < 20) return '';
    var msg = st.error
      ? '서버에 저장하지 못하고 있어요 — ' + U.esc(String(st.error).split('\n')[0])
      : '서버에 아직 못 보낸 변경이 <b>' + st.pending + '건</b> 있어요.';
    return '<div class="card"><h2>⚠️ 저장 상태</h2>' +
      '<div class="warn">' + msg + '<br>' +
      '인터넷 연결을 확인해 주세요. 그동안 입력하신 내용은 이 컴퓨터에 안전하게 남아 있고, ' +
      '연결되면 자동으로 올라갑니다.</div>' +
      '<div class="row" style="margin-top:12px">' +
      '<button class="btn ghost" data-go="settings">백업 파일 받아두기 →</button></div></div>';
  }


  function list(orders) {
    return '<div class="table-wrap"><table><thead><tr><th>시간</th><th>고객</th><th>주문내용</th><th class="num">잔금</th><th>상태</th></tr></thead><tbody>' +
      orders.map(function (o) {
        var rest = Math.max(0, U.toNum(o.price) - U.toNum(o.deposit));
        return '<tr><td><b>' + U.esc(o.pickupTime || '-') + '</b></td>' +
          '<td>' + U.esc(o.customerName) + '<br><span class="cap-sub">' + U.esc(U.phone(o.phone)) + '</span></td>' +
          '<td>' + U.esc(o.request || '') + (o.note ? '<br><span class="cap-sub">📌 ' + U.esc(o.note) + '</span>' : '') + '</td>' +
          '<td class="num">' + U.won(rest) + '</td>' +
          '<td><span class="badge ' + Orders.statusCls(o.status) + '">' + Orders.statusText(o.status) + '</span></td></tr>';
      }).join('') + '</tbody></table></div>';
  }

  return { render: render };
})();

/* ===== js/invite.js ===== */
/* 정식 공개 전 비공개 유지
   - 초대 코드가 담긴 링크로 들어온 분, 그리고 이미 회원이신 분만 화면을 봅니다
   - 그 밖에는 "준비 중" 안내만 보입니다
   - 코드는 이 파일에 적혀 있지 않습니다. 서버(Supabase)에 물어봐서 확인합니다 */
window.Invite = (function () {

  var KEY = 'cakeshop:invitePass';
  var PARAM = 'invite';
  var passed = false;

  function has() { return passed; }

  function remember() {
    passed = true;
    try { localStorage.setItem(KEY, '1'); } catch (e) {}
  }

  function stored() {
    try { return localStorage.getItem(KEY) === '1'; } catch (e) { return false; }
  }

  /* 앱이 시작될 때 먼저 불립니다.
     통과하면 true, 막아야 하면 false 를 돌려줍니다. */
  function check() {
    // 이미 로그인한 회원은 그냥 통과 (초대 코드와 무관)
    if (SB.loggedIn()) { passed = true; return Promise.resolve(true); }
    if (stored()) { passed = true; return Promise.resolve(true); }

    var code = '';
    try { code = new URLSearchParams(location.search).get(PARAM) || ''; } catch (e) { code = ''; }
    if (!code) return Promise.resolve(false);

    return SB.checkInvite(code).then(function (ok) {
      if (!ok) return false;
      remember();
      // 주소창에서 코드를 지워 둡니다 (남이 어깨너머로 보는 것 방지)
      try { history.replaceState(null, '', location.pathname + (location.hash || '')); } catch (e) {}
      return true;
    }).catch(function () { return false; });
  }

  /* "준비 중" 화면 — 코드를 직접 넣어볼 수도 있게 해 둡니다 */
  function renderClosed(view) {
    view.innerHTML =
      '<div class="card auth-card">' +
        '<div class="auth-hero">' +
          '<div class="auth-logo">🔨</div>' +
          '<h2>준비 중입니다</h2>' +
          '<p class="hint">1인 사업자를 위한 운영 노트를 만들고 있습니다.<br>' +
          '정식 공개 전까지는 초대받은 분만 볼 수 있어요.</p>' +
        '</div>' +
        '<form id="invForm" novalidate style="margin-top:8px">' +
          '<div class="field"><label>초대 코드</label>' +
            '<input name="code" placeholder="초대 링크를 받으셨다면 그 링크로 들어와 주세요" autocomplete="off"></div>' +
          '<button class="btn wide" type="submit">들어가기</button>' +
        '</form>' +
        '<div id="invMsg"></div>' +
      '</div>';

    U.$('#invForm', view).onsubmit = function (e) {
      e.preventDefault();
      var f = e.target;
      var code = (f.code.value || '').trim();
      var box = U.$('#invMsg', view);
      if (!code) { box.innerHTML = '<div class="warn" style="margin-top:12px">초대 코드를 적어주세요.</div>'; return; }
      U.$$('button, input', f).forEach(function (el) { el.disabled = true; });
      box.innerHTML = '<div class="info" style="margin-top:12px">확인하는 중...</div>';
      SB.checkInvite(code).then(function (ok) {
        if (ok) { remember(); location.reload(); return; }
        U.$$('button, input', f).forEach(function (el) { el.disabled = false; });
        box.innerHTML = '<div class="warn" style="margin-top:12px">맞지 않는 코드예요. 받으신 링크를 다시 확인해 주세요.</div>';
      }).catch(function () {
        U.$$('button, input', f).forEach(function (el) { el.disabled = false; });
        box.innerHTML = '<div class="warn" style="margin-top:12px">확인하지 못했어요. 인터넷 연결을 확인해 주세요.</div>';
      });
    };
  }

  return { check: check, has: has, renderClosed: renderClosed };
})();

/* ===== js/app.js ===== */
/* 화면 전환(라우터) + 시작 */
window.App = (function () {

  var ROUTES = {
    home: Home,
    orders: Orders,
    monthly: Monthly,
    inventory: Inventory,
    gallery: Gallery,
    cost: Cost,
    notify: Notify,
    settings: Settings,
    subscribe: { render: function (v) { Auth.renderSubscribe(v); } }
  };

  // 이용 기간이 끝나도 자료를 보고 내려받는 것은 막지 않습니다
  var READ_ONLY_OK = ['home', 'monthly', 'orders', 'gallery', 'cost', 'settings', 'subscribe'];

  function current() {
    var r = (location.hash || '#home').slice(1);
    return ROUTES[r] ? r : 'home';
  }

  function render() {
    var route = current();
    // 화면을 새 요소로 갈아끼웁니다.
    // (이전 화면에 붙여둔 클릭 이벤트가 쌓여서 두 번씩 실행되는 것을 막기 위함)
    var old = U.$('#view');
    var view = document.createElement('main');
    view.id = 'view';
    view.className = 'view';
    old.parentNode.replaceChild(view, old);
    // 비밀번호 재설정 링크로 들어왔으면 새 비밀번호부터 정합니다
    if (Auth.isRecovering()) {
      document.body.classList.add('logged-out');
      try { Auth.renderNewPassword(view); } catch (e) { console.error(e); }
      window.scrollTo({ top: 0 });
      return;
    }
    // 정식 공개 전: 초대받지 않은 분에게는 "준비 중" 안내만 보여줍니다
    if (!SB.loggedIn() && !Invite.has()) {
      document.body.classList.add('logged-out');
      try { Invite.renderClosed(view); } catch (e) { console.error(e); }
      window.scrollTo({ top: 0 });
      return;
    }
    // 로그인하지 않았으면 회원가입 / 로그인 화면만 보여줍니다
    if (!SB.loggedIn()) {
      document.body.classList.add('logged-out');
      try { Auth.renderGate(view); } catch (e) { console.error(e); }
      window.scrollTo({ top: 0 });
      return;
    }
    document.body.classList.remove('logged-out');

    U.$$('#tabs button').forEach(function (b) {
      b.classList.toggle('active', b.dataset.route === route);
    });

    // 이용 기간이 끝났으면, 쓰기가 필요한 화면은 구독 안내로 바꿔줍니다
    var acc = Auth.info();
    if (acc && !acc.active && READ_ONLY_OK.indexOf(route) < 0) {
      view.innerHTML = Auth.banner();
      var sub = document.createElement('div');
      view.appendChild(sub);
      Auth.renderExpired(sub);
      bindBanner(view);
      window.scrollTo({ top: 0 });
      return;
    }

    try {
      view.insertAdjacentHTML('afterbegin', Auth.banner());
      bindBanner(view);
      var host = document.createElement('div');
      view.appendChild(host);
      ROUTES[route].render(host);
    } catch (e) {
      view.innerHTML = '<div class="card"><h2>문제가 생겼어요</h2><p class="hint">' +
        U.esc(e.message) + '</p><button class="btn ghost" onclick="location.hash=\'#home\'">홈으로</button></div>';
      console.error(e);
    }
    refreshShopName();
    window.scrollTo({ top: 0 });
  }

  function bindBanner(view) {
    view.addEventListener('click', function (e) {
      var go = e.target.dataset && e.target.dataset.go;
      if (go && (go === 'subscribe' || ROUTES[go])) location.hash = '#' + go;
    });
  }

  function refreshShopName() {
    var s = DB.settings();
    var name = s.shopName || '내 가게';
    U.$('#shopName').textContent = name;
    // 보낼 알림이 있으면 브라우저 탭 제목에 건수를 붙여 놓치지 않게 함
    var n = 0;
    try { n = Notify.totalCount(); } catch (e) { n = 0; }
    document.title = (n ? '(' + n + ') ' : '') + name + ' · 1인CEO 운영노트';
    refreshAcctChip();
  }

  // 상단 오른쪽: 저장 상태 + 계정 메뉴
  function refreshAcctChip() {
    var chip = U.$('#acctChip');
    if (!chip) return;
    if (!SB.loggedIn()) { chip.innerHTML = ''; return; }
    var st = Sync.status();
    var cls = st.busy ? 'busy' : (st.error ? 'err' : '');
    chip.innerHTML =
      '<button class="acct-btn" id="syncBtn" title="' + U.esc(Sync.lastText()) + '">' +
        '<span class="sync-dot ' + cls + '"></span> ' +
        (st.pending ? st.pending + '건 저장 대기' : '저장됨') + '</button>' +
      '<button class="acct-btn" id="acctBtn">👤 내 계정</button>';
    U.$('#syncBtn').onclick = function () { Sync.run(); U.toast('서버와 맞추는 중...'); };
    U.$('#acctBtn').onclick = function () { location.hash = '#settings'; };
  }

  function start() {
    SB.loadSession();
    // 정식 공개 전이라, 초대 코드를 먼저 확인하고 나서 화면을 그립니다
    Invite.check().then(boot, boot);
  }

  function boot() {
    // 메일 링크(인증·비밀번호 재설정)를 눌러서 들어온 경우 주소에 붙어 온 로그인 정보를 받습니다
    var urlSession = null;
    try { urlSession = SB.captureUrlSession(); } catch (e) { urlSession = null; }
    if (SB.loggedIn()) DB.setScope(SB.userId());
    Seed.installIfEmpty();
    refreshShopName();
    U.$('#todayLabel').textContent = U.korDateFull(U.today());

    U.$$('#tabs button').forEach(function (b) {
      b.onclick = function () { location.hash = '#' + b.dataset.route; };
    });
    window.addEventListener('hashchange', render);

    U.$('#modalClose').onclick = U.closeModal;
    U.$('#modal').addEventListener('click', function (e) {
      if (e.target.id === 'modal') U.closeModal();
    });
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape' && !U.$('#modal').hidden) U.closeModal();
    });

    if (!DB.storageOk) {
      U.toast('저장이 안 되는 환경이에요. 설정 화면의 안내를 확인해 주세요.');
    }
    render();

    // 메일 링크로 들어온 경우: 비밀번호 재설정이면 새 비밀번호 화면, 그 밖에는 바로 로그인
    if (urlSession && urlSession.then) {
      urlSession.then(function (kind) {
        if (kind === 'recovery') {
          Auth.setRecovering(true);
          render();
          return;
        }
        DB.setScope(SB.userId());
        return Auth.afterLogin().catch(function () { render(); });
      }).catch(function () { render(); });
      return;
    }

    // 로그인 상태면 서버에서 최신 자료를 가져오고 자동 저장을 켭니다
    if (SB.loggedIn()) {
      Auth.refreshAccess().then(function () {
        render();
        // 카드 결제창에서 돌아온 경우 결제를 확정합니다
        return Auth.handleTossReturn();
      }).then(function (paid) {
        if (paid) { location.hash = '#subscribe'; render(); }
        return Sync.run({ rerender: false });
      }).then(function () {
        Sync.start();
        render();
      }).catch(function (e) {
        U.toast('서버 연결 실패 — 이 컴퓨터의 자료로 계속 쓰실 수 있어요');
        console.warn(e);
      });
    }
  }

  // 화면이 이미 준비된 뒤에 불러와도 정상 동작하도록
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start);
  else start();

  return { render: render, refreshShopName: refreshShopName };
})();
