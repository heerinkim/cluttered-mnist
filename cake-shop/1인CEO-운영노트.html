<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>1인CEO 운영노트</title>
<meta name="robots" content="noindex, nofollow">
<style>
:root{
  --cream:#fff9f3;
  --card:#ffffff;
  --ink:#3d2b23;
  --ink-soft:#7a6259;
  --line:#f0e2d6;
  --rose:#d9738a;
  --rose-dark:#c25a73;
  --rose-soft:#fdeef1;
  --mint:#4aa792;
  --amber:#e0973f;
  --red:#d9534f;
  --shadow:0 2px 10px rgba(120,80,60,.08);
  --radius:14px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--cream);
  color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
  font-size:15px;line-height:1.55;
  -webkit-text-size-adjust:100%;
}
h1,h2,h3,h4{margin:0 0 .5rem;font-weight:700;letter-spacing:-.02em}
p{margin:0 0 .5rem}
a{color:var(--rose-dark)}

/* ---------- top bar ---------- */
.topbar{
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:14px 18px;background:#fff;border-bottom:1px solid var(--line);
  position:sticky;top:0;z-index:20;
}
.brand{display:flex;align-items:center;gap:12px}
.logo{font-size:30px;line-height:1}
.topbar h1{font-size:19px;margin:0}
.sub{font-size:12px;color:var(--ink-soft);margin:0}
.today-chip{
  background:var(--rose-soft);color:var(--rose-dark);
  padding:6px 12px;border-radius:999px;font-size:13px;font-weight:600;white-space:nowrap;
}

/* ---------- tabs ---------- */
.tabs{
  display:flex;gap:6px;padding:10px 14px;overflow-x:auto;
  background:#fff;border-bottom:1px solid var(--line);
  position:sticky;top:63px;z-index:19;-webkit-overflow-scrolling:touch;
}
.tabs::-webkit-scrollbar{height:0}
.tabs button{
  flex:0 0 auto;border:1px solid var(--line);background:#fff;color:var(--ink-soft);
  padding:8px 14px;border-radius:999px;font-size:14px;font-weight:600;cursor:pointer;
  font-family:inherit;
}
.tabs button:hover{background:var(--rose-soft)}
.tabs button.active{background:var(--rose);border-color:var(--rose);color:#fff}

/* ---------- layout ---------- */
.view{max-width:1080px;margin:0 auto;padding:18px 14px 80px}
.card{
  background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  padding:16px;margin-bottom:16px;box-shadow:var(--shadow);
}
.card h2{font-size:17px;display:flex;align-items:center;gap:8px}
.card h3{font-size:15px}
.hint{font-size:13px;color:var(--ink-soft);margin:4px 0 12px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row.end{justify-content:flex-end}
.spacer{flex:1}
.grid{display:grid;gap:12px}
.grid.two{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.grid.three{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.grid.four{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}

/* ---------- forms ---------- */
label{display:block;font-size:13px;font-weight:600;color:var(--ink-soft);margin-bottom:4px}
input,select,textarea{
  width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;
  font-size:15px;font-family:inherit;color:var(--ink);background:#fff;
}
input:focus,select:focus,textarea:focus{outline:2px solid var(--rose-soft);border-color:var(--rose)}
textarea{min-height:70px;resize:vertical}
.field{margin-bottom:12px}
.inline-field{display:flex;gap:8px;align-items:flex-end}
.inline-field>div{flex:1}

button{font-family:inherit}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  background:var(--rose);color:#fff;border:none;padding:11px 18px;border-radius:10px;
  font-size:15px;font-weight:700;cursor:pointer;
}
.btn:hover{background:var(--rose-dark)}
.btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}
.btn.ghost:hover{background:var(--rose-soft)}
.btn.small{padding:7px 12px;font-size:13px;border-radius:8px}
.btn.danger{background:var(--red)}
.btn.mint{background:var(--mint)}
.icon-btn{
  background:transparent;border:none;font-size:17px;cursor:pointer;color:var(--ink-soft);
  padding:4px 6px;border-radius:6px;
}
.icon-btn:hover{background:var(--rose-soft)}

/* ---------- tables ---------- */
.table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{width:100%;border-collapse:collapse;font-size:14px;min-width:520px}
th,td{padding:10px 8px;text-align:left;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:12px;color:var(--ink-soft);font-weight:700;background:#fffdfb;white-space:nowrap}
td.num,th.num{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
tr.low td{background:#fff6f5}
tfoot td{font-weight:700;background:#fffdfb}
table input,table select{padding:6px 8px;font-size:14px}

/* ---------- stats ---------- */
.stat{
  background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:14px;
  box-shadow:var(--shadow);
}
.stat .label{font-size:12px;color:var(--ink-soft);font-weight:700}
.stat .value{font-size:22px;font-weight:800;letter-spacing:-.03em;margin-top:2px;font-variant-numeric:tabular-nums}
.stat.rose .value{color:var(--rose-dark)}
.stat.mint .value{color:var(--mint)}
.stat.amber .value{color:var(--amber)}

/* ---------- badges ---------- */
.badge{
  display:inline-block;padding:3px 9px;border-radius:999px;font-size:11px;font-weight:700;
  background:var(--rose-soft);color:var(--rose-dark);white-space:nowrap;
}
.badge.gray{background:#f2efec;color:var(--ink-soft)}
.badge.mint{background:#e4f4f0;color:#2f7d6c}
.badge.amber{background:#fdf1e0;color:#a86c1c}
.badge.red{background:#fdeceb;color:#b93b37}

/* ---------- calendar ---------- */
.cal-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.cal-title{font-size:17px;font-weight:800}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .dow{text-align:center;font-size:12px;font-weight:700;color:var(--ink-soft);padding:4px 0}
.cal .dow.sun{color:var(--red)}
.cal .day{
  min-height:88px;border:1px solid var(--line);border-radius:10px;padding:5px;background:#fff;
  cursor:pointer;overflow:hidden;
}
.cal .day.empty{background:transparent;border:none;cursor:default}
.cal .day:hover{border-color:var(--rose)}
.cal .day.today{border:2px solid var(--rose);background:var(--rose-soft)}
.cal .dnum{font-size:12px;font-weight:700;color:var(--ink-soft)}
.cal .day.sun .dnum{color:var(--red)}
.cal .ev{
  font-size:11px;background:var(--rose-soft);color:var(--rose-dark);border-radius:6px;
  padding:2px 5px;margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600;
}
.cal .ev.done{background:#eef0ef;color:var(--ink-soft)}
.cal .more{font-size:10px;color:var(--ink-soft);margin-top:2px}
@media (max-width:640px){
  .cal .day{min-height:64px;padding:3px}
  .cal .ev{font-size:10px;padding:1px 3px}
}

/* ---------- gallery ---------- */
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.gal figure{margin:0;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#fff;cursor:pointer}
.gal img{width:100%;aspect-ratio:1/1;object-fit:cover;display:block}
.gal figcaption{padding:7px 8px;font-size:12px}
.gal .cap-title{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gal .cap-sub{color:var(--ink-soft);font-size:11px}
.lightbox img{width:100%;border-radius:10px;margin-bottom:10px}

/* ---------- notify queue ---------- */
.q-item{
  border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px;background:#fff;
}
.q-item.sent{opacity:.55}
.q-msg{
  background:#fffdfb;border:1px dashed var(--line);border-radius:10px;padding:10px;
  font-size:13px;white-space:pre-wrap;margin:8px 0;
}

/* ---------- modal ---------- */
.modal-back{
  position:fixed;inset:0;background:rgba(60,40,32,.45);z-index:50;
  display:flex;align-items:flex-start;justify-content:center;padding:20px;overflow-y:auto;
}
/* hidden 속성이 display:flex 에 밀리지 않도록 */
.modal-back[hidden]{display:none}
.modal{
  background:#fff;border-radius:16px;width:min(560px,100%);margin:auto;
  box-shadow:0 12px 40px rgba(60,40,32,.25);
}
.modal-head{
  display:flex;align-items:center;justify-content:space-between;
  padding:14px 16px;border-bottom:1px solid var(--line);
}
.modal-head h3{margin:0;font-size:16px}
.modal-body{padding:16px}

/* ---------- toast ---------- */
.toast{
  position:fixed;left:50%;bottom:26px;transform:translate(-50%,24px);
  background:var(--ink);color:#fff;padding:11px 18px;border-radius:999px;font-size:14px;font-weight:600;
  opacity:0;pointer-events:none;transition:.25s;z-index:100;max-width:90vw;text-align:center;
}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* ---------- 로그인 / 회원가입 ---------- */
body.logged-out .tabs{display:none}
.auth-card{max-width:520px;margin:0 auto 16px}
.auth-hero{text-align:center;padding:6px 0 14px}
.auth-logo{font-size:44px;line-height:1}
.auth-hero h2{font-size:21px;margin:6px 0 6px}
.auth-tabs{margin-bottom:16px}
.auth-tabs .btn{flex:1}
.btn.wide{width:100%}
.agree{margin-top:10px;font-weight:500;cursor:pointer;align-items:flex-start;gap:8px}
.feature{display:flex;gap:10px;align-items:flex-start;padding:10px;border:1px solid var(--line);border-radius:12px}
.f-ico{font-size:22px;line-height:1.2}

/* 남은 기간 안내 띠 */
.trial-bar{
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  background:var(--rose-soft);color:var(--rose-dark);
  border:1px solid #f6d9e0;border-radius:12px;padding:10px 14px;margin-bottom:14px;
  font-size:14px;font-weight:600;
}
.trial-bar.expired{background:#fdeceb;border-color:#f6cdc9;color:#b93b37}

/* 요금 표시 */
.price-box{
  text-align:center;background:#fffdfb;border:1px solid var(--line);
  border-radius:14px;padding:18px;margin:14px 0;
}
.price-amt{font-size:30px;font-weight:800;color:var(--rose-dark);letter-spacing:-.03em}
.price-amt span{font-size:15px;font-weight:600;color:var(--ink-soft);margin-left:4px}

/* 요금제 선택 */
.plans{margin-top:4px}
.plan{
  display:block;border:2px solid var(--line);border-radius:14px;padding:14px;
  cursor:pointer;background:#fff;position:relative;
}
.plan.on{border-color:var(--rose);background:var(--rose-soft)}
.plan input{position:absolute;opacity:0;width:0;height:0}
.plan-amt{font-size:24px;font-weight:800;letter-spacing:-.03em;color:var(--rose-dark);margin:6px 0 2px}

/* 무통장입금 안내 */
.bank-box{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#fffdfb}
.bank-row{display:flex;justify-content:space-between;align-items:center;gap:10px;
  padding:11px 14px;border-bottom:1px solid var(--line);font-size:14px}
.bank-row:last-child{border-bottom:none}
.bank-row span{color:var(--ink-soft);font-weight:600}
.bank-row b{text-align:right;word-break:break-all}
.bank-row.total{background:var(--rose-soft)}
.bank-row.total b{color:var(--rose-dark);font-size:17px}

/* 상단 계정 칩 */
#acctChip{display:inline-flex;align-items:center;gap:6px;margin-left:8px}
.acct-btn{
  background:#fff;border:1px solid var(--line);border-radius:999px;
  padding:6px 12px;font-size:13px;font-weight:600;cursor:pointer;color:var(--ink-soft);
  font-family:inherit;
}
.acct-btn:hover{background:var(--rose-soft);color:var(--rose-dark)}
.sync-dot{width:8px;height:8px;border-radius:50%;background:var(--mint);display:inline-block}
.sync-dot.busy{background:var(--amber)}
.sync-dot.err{background:var(--red)}
@media (max-width:640px){
  .topbar{flex-wrap:wrap}
  #acctChip{margin-left:0}
}

/* 붙여넣기 미리보기 - 좁은 팝업에서도 두 칸으로 */
.pv-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
.pv-row .field{margin-bottom:8px}
.pv-row label{font-size:12px}

/* ---------- 접었다 펴는 영역 ---------- */
details.adv summary{
  cursor:pointer;font-size:16px;font-weight:700;letter-spacing:-.02em;
  list-style:none;display:flex;align-items:center;gap:8px;
}
details.adv summary::-webkit-details-marker{display:none}
details.adv summary::before{content:'▸';color:var(--rose);font-size:14px}
details.adv[open] summary::before{content:'▾'}
details.adv summary:hover{color:var(--rose-dark)}

.empty{text-align:center;color:var(--ink-soft);padding:28px 10px;font-size:14px}
.divider{height:1px;background:var(--line);margin:14px 0}
code{background:#f6efe9;padding:1px 5px;border-radius:5px;font-size:13px}
.warn{background:#fff8e8;border:1px solid #f3e2bd;border-radius:10px;padding:10px 12px;font-size:13px;color:#7a5a1c}
.info{background:#eef6f4;border:1px solid #cfe6e0;border-radius:10px;padding:10px 12px;font-size:13px;color:#2f6b5e}

</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📒</text></svg>">

<body>

<header class="topbar">
  <div class="brand">
    <span class="logo">📒</span>
    <div>
      <h1 id="shopName">내 가게</h1>
      <p class="sub">주문 · 정산 · 재고 · 원가 관리</p>
    </div>
  </div>
  <div class="topbar-right">
    <span id="todayLabel" class="today-chip"></span>
    <span id="acctChip"></span>
  </div>
</header>

<nav class="tabs" id="tabs">
  <button data-route="home">🏠 홈</button>
  <button data-route="orders">📝 주문·달력</button>
  <button data-route="monthly">📊 월별정산</button>
  <button data-route="inventory">📦 재고</button>
  <button data-route="gallery">🖼️ 갤러리</button>
  <button data-route="cost">💰 원가표</button>
  <button data-route="notify">💬 알림</button>
  <button data-route="settings">⚙️ 설정</button>
</nav>

<main id="view" class="view"></main>

<div id="toast" class="toast"></div>

<div id="modal" class="modal-back" hidden>
  <div class="modal" role="dialog" aria-modal="true">
    <div class="modal-head">
      <h3 id="modalTitle">제목</h3>
      <button class="icon-btn" id="modalClose" aria-label="닫기">✕</button>
    </div>
    <div class="modal-body" id="modalBody"></div>
  </div>
</div>
<script>
/* ===== js/utils.js ===== */
/* 공통 도구 모음 (날짜, 금액, 화면 그리기 도우미) */
window.U = (function () {

  /* ---------- 날짜 ---------- */
  function pad(n) { return String(n).padStart(2, '0'); }

  // Date -> "2026-07-27"
  function ymd(d) {
    return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
  }
  // "2026-07-27" -> Date (시간은 00:00, 로컬 기준)
  function parseYmd(s) {
    if (!s) return null;
    var p = String(s).split('-');
    if (p.length !== 3) return null;
    return new Date(+p[0], +p[1] - 1, +p[2]);
  }
  function today() { return ymd(new Date()); }
  // 날짜 문자열에 일수 더하기 ("2026-07-27", 1) -> "2026-07-28"
  function addDays(s, n) {
    var d = parseYmd(s); if (!d) return '';
    d.setDate(d.getDate() + n);
    return ymd(d);
  }
  var DOW = ['일', '월', '화', '수', '목', '금', '토'];
  // "2026-07-27" -> "7월 27일 (월)"
  function korDate(s) {
    var d = parseYmd(s); if (!d) return '';
    return (d.getMonth() + 1) + '월 ' + d.getDate() + '일 (' + DOW[d.getDay()] + ')';
  }
  // "2026-07-27" -> "2026년 7월 27일 (월)"
  function korDateFull(s) {
    var d = parseYmd(s); if (!d) return '';
    return d.getFullYear() + '년 ' + korDate(s);
  }
  // "2026-07" 형태의 이번 달
  function thisMonth() { var d = new Date(); return d.getFullYear() + '-' + pad(d.getMonth() + 1); }
  // "2026-07" 을 n개월 이동
  function shiftMonth(m, n) {
    var p = m.split('-'), d = new Date(+p[0], +p[1] - 1 + n, 1);
    return d.getFullYear() + '-' + pad(d.getMonth() + 1);
  }
  function monthTitle(m) { var p = m.split('-'); return +p[0] + '년 ' + (+p[1]) + '월'; }
  // 해당 달의 마지막 날짜 (28~31)
  function lastDayOfMonth(m) { var p = m.split('-'); return new Date(+p[0], +p[1], 0).getDate(); }
  // 두 날짜 사이 일수 (b - a)
  function diffDays(a, b) {
    var da = parseYmd(a), db = parseYmd(b);
    if (!da || !db) return 0;
    return Math.round((db - da) / 86400000);
  }

  /* ---------- 금액/숫자 ---------- */
  function won(n) {
    n = Math.round(Number(n) || 0);
    return n.toLocaleString('ko-KR') + '원';
  }
  function num(n) { return (Math.round(Number(n) || 0)).toLocaleString('ko-KR'); }
  // "35,000원" / "35000" -> 35000
  function toNum(v) {
    if (v === null || v === undefined) return 0;
    var s = String(v).replace(/[^0-9.\-]/g, '');
    var n = parseFloat(s);
    return isNaN(n) ? 0 : n;
  }
  // 전화번호 정리: 01012345678 -> 010-1234-5678
  function phone(p) {
    var d = String(p || '').replace(/[^0-9]/g, '');
    if (d.length === 11) return d.slice(0, 3) + '-' + d.slice(3, 7) + '-' + d.slice(7);
    if (d.length === 10) return d.slice(0, 3) + '-' + d.slice(3, 6) + '-' + d.slice(6);
    return p || '';
  }
  function phoneDigits(p) { return String(p || '').replace(/[^0-9]/g, ''); }

  function uid() {
    return Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  }

  /* ---------- 화면 도우미 ---------- */
  function esc(s) {
    return String(s === null || s === undefined ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }
  function $(sel, root) { return (root || document).querySelector(sel); }
  function $$(sel, root) { return Array.prototype.slice.call((root || document).querySelectorAll(sel)); }

  var toastTimer = null;
  function toast(msg) {
    var t = $('#toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.classList.remove('show'); }, 2200);
  }

  function modal(title, html, onOpen) {
    $('#modalTitle').textContent = title;
    $('#modalBody').innerHTML = html;
    $('#modal').hidden = false;
    if (onOpen) onOpen($('#modalBody'));
  }
  function closeModal() { $('#modal').hidden = true; $('#modalBody').innerHTML = ''; }

  function confirmBox(msg) { return window.confirm(msg); }

  // 표를 CSV 파일로 내려받기 (엑셀에서 열림)
  function downloadCsv(filename, rows) {
    var csv = rows.map(function (r) {
      return r.map(function (c) {
        var s = String(c === null || c === undefined ? '' : c);
        return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
      }).join(',');
    }).join('\r\n');
    // 엑셀 한글 깨짐 방지용 BOM
    downloadBlob(new Blob(['﻿' + csv], { type: 'text/csv;charset=utf-8;' }), filename);
  }
  function downloadBlob(blob, filename) {
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
  }

  function copyText(text) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      return navigator.clipboard.writeText(text).then(function () { toast('복사했어요'); })
        .catch(function () { fallbackCopy(text); });
    }
    fallbackCopy(text);
    return Promise.resolve();
  }
  function fallbackCopy(text) {
    var ta = document.createElement('textarea');
    ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();

/* ===== js/cloudapi.js ===== */
/* Supabase 연결 (회원가입 · 로그인 · 자료 저장)
   외부 라이브러리 없이 필요한 기능만 직접 호출합니다.
   - 로그인 정보(토큰)는 이 브라우저에만 저장됩니다.
   - 각 가게는 자기 자료만 보입니다 (서버에서 막아둠). */
window.SB = (function () {

  var URL = 'https://brdjglmsqepleyymckcf.supabase.co';
  var ANON = 'sb_publishable_IV5qpJB7rxQaQxfpcNDUDA_O7Dg_xs9';
  var SESSION_KEY = 'cakeshop:session';

  var session = null;     // { access_token, refresh_token, expires_at, user }

  /* ---------- 세션 보관 ---------- */
  function loadSession() {
    try { session = JSON.parse(localStorage.getItem(SESSION_KEY) || 'null'); }
    catch (e) { session = null; }
    return session;
  }
  function saveSession(s) {
    session = s;
    try {
      if (s) localStorage.setItem(SESSION_KEY, JSON.stringify(s));
      else localStorage.removeItem(SESSION_KEY);
    } catch (e) { /* 저장 못 해도 이번 접속 동안은 동작 */ }
    return s;
  }
  function user() { return session && session.user; }
  function userId() { return session && session.user && session.user.id; }
  function loggedIn() { return !!(session && session.access_token); }

  /* ---------- 공통 호출 ---------- */
  function fail(msg, status) { var e = new Error(msg); e.status = status; return e; }

  function request(path, opts) {
    opts = opts || {};
    var headers = Object.assign({
      'apikey': ANON,
      'Content-Type': 'application/json'
    }, opts.headers || {});
    if (session && session.access_token && !opts.noAuth) {
      headers.Authorization = 'Bearer ' + session.access_token;
    }
    return fetch(URL + path, Object.assign({}, opts, { headers: headers }))
      .catch(function () {
        throw fail('인터넷에 연결되어 있는지 확인해 주세요.\n' +
                   '연결이 안 되는 동안에도 이 컴퓨터에 저장된 자료는 그대로 보입니다.');
      })
      .then(function (res) {
        if (res.status === 204) return null;
        return res.text().then(function (text) {
          var body = null;
          try { body = text ? JSON.parse(text) : null; } catch (e) { body = { raw: text }; }
          if (!res.ok) throw fail(humanError(body, res.status), res.status);
          return body;
        });

  }

  // 서버가 돌려준 영어 오류를 사장님이 알아볼 수 있는 말로 바꿉니다
  function humanError(body, status) {
    var msg = (body && (body.msg || body.message || body.error_description || body.error)) || '';
    var code = (body && body.code) || '';
    var m = String(msg);

    if (/already registered|already been registered|User already exists/i.test(m)) {
      return '이미 가입된 이메일이에요. [로그인]으로 들어가시거나 비밀번호 찾기를 해주세요.';
    }
    if (/Invalid login credentials/i.test(m)) {
      return '이메일 또는 비밀번호가 맞지 않아요. 다시 확인해 주세요.';
    }
    if (/Email not confirmed/i.test(m)) {
      return '이메일 인증이 아직 안 되었어요. 받은 메일함에서 인증 링크를 눌러주세요.';
    }
    if (/Password should be at least/i.test(m)) {
      return '비밀번호는 6자 이상으로 정해주세요.';
    }
    if (/is invalid/i.test(m) && /email/i.test(m)) {
      return '이 이메일 주소는 쓸 수 없어요. 실제로 메일을 받을 수 있는 주소를 적어주세요.\n' +
             '(example.com 처럼 시험용 주소는 막혀 있습니다)';
    }
    if (/valid email/i.test(m) || /Unable to validate email/i.test(m)) {
      return '이메일 주소 형식이 올바르지 않아요.';
    }
    if (/rate limit|too many requests/i.test(m) || status === 429) {
      return '잠시 뒤에 다시 시도해 주세요. (요청이 너무 잦습니다)';
    }
    if (code === '42501' || status === 403) {
      return '이용 기간이 끝나서 새로 저장할 수 없어요. 구독을 시작하시면 다시 저장됩니다.\n' +
             '(지금까지의 자료는 그대로 보고 내려받을 수 있습니다)';
    }
    if (status === 401) return '로그인이 만료됐어요. 다시 로그인해 주세요.';
    return m || ('서버 오류가 발생했어요 (코드 ' + status + ')');
  }

  /* ---------- 토큰 자동 갱신 ---------- */
  function fresh() {
    if (!session) return Promise.reject(fail('로그인이 필요해요.', 401));
    var now = Math.floor(Date.now() / 1000);
    if (session.expires_at && session.expires_at - 60 > now) return Promise.resolve(session);
    return refresh();
  }
  function refresh() {
    if (!session || !session.refresh_token) return Promise.reject(fail('로그인이 필요해요.', 401));
    return request('/auth/v1/token?grant_type=refresh_token', {
      method: 'POST', noAuth: true,
      body: JSON.stringify({ refresh_token: session.refresh_token })
    }).then(storeAuth).catch(function (e) {
      if (e.status === 400 || e.status === 401) { saveSession(null); }
      throw e;
    });
  }
  function storeAuth(r) {
    if (!r || !r.access_token) throw fail('로그인 정보를 받지 못했어요.');
    return saveSession({
      access_token: r.access_token,
      refresh_token: r.refresh_token,

  function auth(path, opts) {
    return fresh().then(function () { return request(path, opts); })

  /* ---------- 회원가입 / 로그인 ---------- */
  function signUp(info) {

          owner_phone: String(info.ownerPhone || '').trim()

      // 이메일 인증을 켜둔 경우 토큰 없이 사용자 정보만 돌아옵니다
      if (r && r.access_token) { storeAuth(r); return { signedIn: true, user: r.user }; }
      return { signedIn: false, user: r };
    });
  }

  function signIn(email, password) {
    return request('/auth/v1/token?grant_type=password', {
      method: 'POST', noAuth: true,
      body: JSON.stringify({ email: String(email || '').trim(), password: password })
    }).then(function (r) { storeAuth(r); return r.user; });
  }

  function signOut() {
    var had = loggedIn();
    var done = had ? auth('/auth/v1/logout', { method: 'POST' }).catch(function () {}) : Promise.resolve();
    return done.then(function () { saveSession(null); });
  }

  function resetPassword(email) {

      body: JSON.stringify({ email: String(email || '').trim() })

  // 메일 링크를 눌렀을 때 돌아올 주소 (파일로 열어 쓰는 경우는 보내지 않습니다)
  function appUrl() {
    if (!/^https?:$/.test(location.protocol)) return 'https://solopreneur111.co.kr/';
    return location.origin + location.pathname;
  }

  /* 비밀번호 재설정 메일의 링크를 누르면 주소 끝에 로그인 정보가 붙어서 돌아옵니다.
     그것을 주워서 로그인 상태로 만들어 줍니다. */
  function captureUrlSession() {
    var h = String(location.hash || '');
    if (h.indexOf('access_token=') < 0) return null;
    var p = new URLSearchParams(h.replace(/^#/, ''));
    var at = p.get('access_token');
    if (!at) return null;
    var kind = p.get('type') || '';
    saveSession({
      access_token: at,
      refresh_token: p.get('refresh_token') || '',
      expires_at: Math.floor(Date.now() / 1000) + Number(p.get('expires_in') || 3600),
      user: null
    });
    try { history.replaceState(null, '', location.pathname + location.search); } catch (e) {}
    // 사용자 정보를 채워 둡니다
    return auth('/auth/v1/user').then(function (u) {
      if (u && u.id) saveSession(Object.assign({}, session, { user: u }));

    }).catch(function () { return kind; });
  }

  function changePassword(newPassword) {

  /* ---------- 갤러리 사진 (Supabase Storage) ---------- */

      return res.text().then(function (t) {

  /* ---------- 구독 (무통장입금) ---------- */

/* ===== js/db.js ===== */
/* 데이터 저장소
   - 글자 데이터(주문/재고/재료/레시피/설정)는 localStorage 에 저장합니다.
   - 사진은 용량이 커서 IndexedDB(브라우저 안의 큰 창고)에 따로 저장합니다.
   - 모든 데이터는 "사장님 브라우저 안"에만 저장되며 외부로 나가지 않습니다.
     => 그래서 설정 화면의 [백업 파일 내려받기]를 주기적으로 꼭 눌러주세요. */
window.DB = (function () {

  // 회원마다 자료를 따로 보관합니다. 같은 컴퓨터를 여러 사장님이 써도 섞이지 않아요.
  var BASE = 'cakeshop:';
  var PREFIX = BASE;
  var memoryFallback = {};   // localStorage 를 못 쓰는 환경(사파리 파일열기 등) 대비

  function setScope(uid) {
    var next = uid ? BASE + uid + ':' : BASE;
    if (next === PREFIX) return false;
    PREFIX = next;
    memoryFallback = {};
    return true;
  }
  function scope() { return PREFIX; }
  var storageOk = (function () {
    try {
      window.localStorage.setItem(PREFIX + '__t', '1');
      window.localStorage.removeItem(PREFIX + '__t');
      return true;
    } catch (e) { return false; }
  })();

  function read(key, fallback) {
    var raw;
    try { raw = storageOk ? localStorage.getItem(PREFIX + key) : memoryFallback[key]; }
    catch (e) { raw = memoryFallback[key]; }
    if (raw === null || raw === undefined) return fallback;
    try { return JSON.parse(raw); } catch (e) { return fallback; }
  }
  function write(key, value) {
    var raw = JSON.stringify(value);
    memoryFallback[key] = raw;
    if (storageOk) {
      try { localStorage.setItem(PREFIX + key, raw); }
      catch (e) { U.toast('저장 공간이 가득 찼어요. 설정에서 백업 후 정리해 주세요.'); }
    }
    return value;
  }

  /* ---------- 바뀐 내용 표시 (서버로 보낼 것 모아두기) ---------- */
  var SYNCED = ['orders', 'menus', 'inventory', 'ingredients', 'recipes', 'options', 'photos'];

  function dirtyMap(key) { return read('dirty:' + key, {}); }
  function markDirty(key, id, how) {
    if (SYNCED.indexOf(key) < 0 || !id) return;
    var m = dirtyMap(key);
    m[id] = how;                       // 'u' = 새로 쓰거나 고침, 'd' = 지움
    write('dirty:' + key, m);
  }
  function clearDirty(key, ids) {
    var m = dirtyMap(key);
    ids.forEach(function (id) { delete m[id]; });
    write('dirty:' + key, m);
  }
  function dirtyCount() {
    var n = SYNCED.reduce(function (a, k) { return a + Object.keys(dirtyMap(k)).length; }, 0);
    return n + (read('dirty:settings', false) ? 1 : 0);
  }
  // 목록 전체가 바뀔 때(가져오기·일괄수정) 무엇이 달라졌는지 찾아냅니다
  function diffDirty(key, before, after) {
    if (SYNCED.indexOf(key) < 0) return;
    var b = {}, a = {};
    (before || []).forEach(function (x) { if (x && x.id) b[x.id] = JSON.stringify(x); });
    (after || []).forEach(function (x) { if (x && x.id) a[x.id] = JSON.stringify(x); });
    Object.keys(a).forEach(function (id) { if (b[id] !== a[id]) markDirty(key, id, 'u'); });
    Object.keys(b).forEach(function (id) { if (!(id in a)) markDirty(key, id, 'd'); });
  }

  /* ---------- 컬렉션(목록) 공통 ---------- */
  function list(key) { return read(key, []); }
  function saveList(key, arr) {
    if (SYNCED.indexOf(key) >= 0) diffDirty(key, list(key), arr);
    return write(key, arr);
  }
  function upsert(key, item) {
    var arr = list(key);
    if (!item.id) { item.id = U.uid(); item.createdAt = new Date().toISOString(); }
    item.updatedAt = new Date().toISOString();
    var i = arr.findIndex(function (x) { return x.id === item.id; });
    if (i >= 0) arr[i] = Object.assign({}, arr[i], item); else arr.push(item);
    saveList(key, arr);
    return item;
  }
  function remove(key, id) {
    saveList(key, list(key).filter(function (x) { return x.id !== id; }));
  }
  function find(key, id) {
    return list(key).find(function (x) { return x.id === id; }) || null;
  }

  /* ---------- 설정 ---------- */
  var DEFAULT_SETTINGS = {
    shopName: '내 가게',
    ownerPhone: '',
    defaultMarginPct: 65,       // 판매가 제안 시 쓰는 마진율(%)
    laborPerCake: 8000,         // 케이크 1개당 기본 인건비(원)
    reservationSource: 'manual' // 'manual'(직접 입력) 또는 'paste'(채팅 붙여넣기)
  };
  function settings() { return Object.assign({}, DEFAULT_SETTINGS, read('settings', {})); }
  function saveSettings(s) {
    write('dirty:settings', true);
    return write('settings', Object.assign(settings(), s));
  }

  /* ---------- 알림 문구 ---------- */
  var DEFAULT_TEMPLATES = {
    orderDay: '[{{가게이름}}] {{고객명}}님, 주문 감사합니다 🎂\n· 픽업: {{픽업일}} {{픽업시간}}\n· 내용: {{주문내용}}\n· 금액: {{금액}}\n변경이 필요하시면 편하게 연락 주세요!',
    dayBefore: '[{{가게이름}}] {{고객명}}님, 내일 {{픽업시간}}에 케이크 픽업 예정입니다 🍰\n· 내용: {{주문내용}}\n· 잔금: {{잔금}}\n케이크는 서늘한 곳에 보관해 주세요. 내일 뵙겠습니다!',
    afterPickup: '[{{가게이름}}] {{고객명}}님, 오늘 케이크는 어떠셨나요? 😊\n소중한 순간 함께하게 해주셔서 감사합니다.\n후기를 남겨주시면 큰 힘이 됩니다!'
  };
  function templates() { return Object.assign({}, DEFAULT_TEMPLATES, read('templates', {})); }
  function saveTemplates(t) {
    write('dirty:settings', true);
    return write('templates', Object.assign(templates(), t));
  }

  /* ---------- 사진 창고 (IndexedDB) ---------- */
  var idbPromise = null;
  function idb() {
    if (idbPromise) return idbPromise;
    idbPromise = new Promise(function (resolve, reject) {
      if (!window.indexedDB) { reject(new Error('이 브라우저는 사진 저장을 지원하지 않아요')); return; }
      var req = indexedDB.open('cakeshop-photos', 1);
      req.onupgradeneeded = function () {
        var db = req.result;
        if (!db.objectStoreNames.contains('photos')) db.createObjectStore('photos');
      };
      req.onsuccess = function () { resolve(req.result); };
      req.onerror = function () { reject(req.error); };
    });
    return idbPromise;
  }
  function photoPut(id, blob) {
    return idb().then(function (db) {
      return new Promise(function (resolve, reject) {
        var tx = db.transaction('photos', 'readwrite');
        tx.objectStore('photos').put(blob, id);
        tx.oncomplete = function () { resolve(id); };
        tx.onerror = function () { reject(tx.error); };
      });
    });
  }
  function photoGet(id) {
    return idb().then(function (db) {
      return new Promise(function (resolve, reject) {
        var tx = db.transaction('photos', 'readonly');
        var r = tx.objectStore('photos').get(id);
        r.onsuccess = function () { resolve(r.result || null); };
        r.onerror = function () { reject(r.error); };
      });
    });
  }
  function photoDel(id) {
    return idb().then(function (db) {
      return new Promise(function (resolve) {
        var tx = db.transaction('photos', 'readwrite');
        tx.objectStore('photos').delete(id);
        tx.oncomplete = function () { resolve(); };
      });
    });
  }

  /* ---------- 백업 / 복원 ---------- */
  function exportAll() {
    return {
      _type: 'cakeshop-backup',
      _version: 1,
      exportedAt: new Date().toISOString(),
      settings: settings(),
      templates: templates(),
      orders: list('orders'),
      menus: list('menus'),
      inventory: list('inventory'),
      ingredients: list('ingredients'),
      recipes: list('recipes'),
      options: list('options'),
      photos: list('photos')   // 사진 설명만 (이미지 파일은 용량이 커서 제외)
    };
  }
  function importAll(data) {
    if (!data || data._type !== 'cakeshop-backup') throw new Error('백업 파일이 아니에요');
    if (data.settings) write('settings', data.settings);
    if (data.templates) write('templates', data.templates);
    ['orders', 'menus', 'inventory', 'ingredients', 'recipes', 'options', 'photos'].forEach(function (k) {
      if (Array.isArray(data[k])) saveList(k, data[k]);
    });
  }
  function clearAll() {
    ['settings', 'templates', 'orders', 'menus', 'inventory', 'ingredients', 'recipes', 'options', 'photos']
      .forEach(function (k) { write(k, k === 'settings' || k === 'templates' ? {} : []); });
  }

  return {
    storageOk: storageOk, setScope: setScope, scope: scope, SYNCED: SYNCED,
    dirtyMap: dirtyMap, markDirty: markDirty, clearDirty: clearDirty, dirtyCount: dirtyCount,
    list: list, saveList: saveList, upsert: upsert, remove: remove, find: find,
    settings: settings, saveSettings: saveSettings,
    templates: templates, saveTemplates: saveTemplates, DEFAULT_TEMPLATES: DEFAULT_TEMPLATES,
    photoPut: photoPut, photoGet: photoGet, photoDel: photoDel,
    exportAll: exportAll, importAll: importAll, clearAll: clearAll,
    read: read, write: write
  };
})();

/* ===== js/costcalc.js ===== */
/* 원가표 + 원가 계산
   1순위: 사장님이 직접 적어둔 [메뉴별 원가표]
   2순위: 원가표 이름 + 옵션 키워드(2단 ×1.8 등)
   3순위: (선택) 재료 단가 + 레시피로 계산 */
window.Cost = (function () {

  /* ================= 계산 엔진 ================= */

  // 띄어쓰기 제거 + 소문자 (이름 비교용)
  function norm(s) { return String(s || '').replace(/\s+/g, '').toLowerCase(); }

  // 재료 1단위(1g, 1ml, 1개)당 가격
  function unitCost(ing) {
    var qty = U.toNum(ing.packQty);
    if (!qty) return 0;
    return U.toNum(ing.packPrice) / qty;
  }

  // 원가로부터 추천 판매가 (설정의 마진율 기준, 1,000원 단위 올림)
  function suggestPrice(cost) {
    var margin = Math.min(95, Math.max(0, U.toNum(DB.settings().defaultMarginPct))) / 100;
    if (margin >= 1) return Math.round(cost);
    return Math.ceil((cost / (1 - margin)) / 1000) * 1000;
  }

  // 레시피 1개의 원가 계산 (재료 + 포장 + 인건비)
  function recipeCost(recipe) {
    var ings = DB.list('ingredients');
    var inv = DB.list('inventory');
    var set = DB.settings();
    var lines = [], material = 0, packaging = 0;

    (recipe.items || []).forEach(function (it) {
      var ing = ings.find(function (x) { return x.id === it.ingId; });
      if (!ing) return;
      var cost = unitCost(ing) * U.toNum(it.qty);
      material += cost;
      lines.push({ kind: '재료', name: ing.name, qty: U.toNum(it.qty) + ing.unit, cost: cost });
    });

    (recipe.packItems || []).forEach(function (it) {
      var item = inv.find(function (x) { return x.id === it.invId; });
      if (!item) return;
      var cost = U.toNum(item.unitPrice) * U.toNum(it.qty);
      packaging += cost;
      lines.push({ kind: '포장', name: item.name, qty: U.toNum(it.qty) + (item.unit || '개'), cost: cost });
    });

    var labor = recipe.labor === '' || recipe.labor === undefined || recipe.labor === null
      ? U.toNum(set.laborPerCake) : U.toNum(recipe.labor);

    return { lines: lines, material: material, packaging: packaging, labor: labor,
             base: material + packaging + labor };
  }

  // 입력한 글에 들어있는 옵션 키워드 찾기
  function matchOptions(n) {
    var multiplier = 1, adds = [], applied = [];
    DB.list('options').forEach(function (op) {
      var k = norm(op.keyword);
      if (!k || n.indexOf(k) < 0) return;
      applied.push(op);
      if (op.type === 'multiply') multiplier *= U.toNum(op.value) || 1;
      else adds.push({ name: op.keyword, cost: U.toNum(op.value) });
    });
    return { multiplier: multiplier, adds: adds, applied: applied,
             addSum: adds.reduce(function (a, b) { return a + b.cost; }, 0) };
  }

  // 이름이 들어있는 항목 중 가장 긴(=구체적인) 것 고르기
  function bestMatch(listArr, n) {
    var found = null;
    listArr.forEach(function (x) {
      var xn = norm(x.name);
      if (xn && n.indexOf(xn) >= 0) {
        if (!found || xn.length > norm(found.name).length) found = x;
      }
    });
    return found;
  }

  /* 글로 적은 주문내용 -> 원가/판매가
     예: "생화케이크 2단", "딸기케이크 1호 레터링" */
  function calcFromText(text) {
    var n = norm(text);
    if (!n) return { ok: false, reason: '내용을 입력해 주세요.' };

    var menus = DB.list('menus');

    // 1순위 - 원가표에 이름이 똑같이 있으면 그 값을 그대로 사용
    var exact = menus.find(function (m) { return norm(m.name) === n; });
    if (exact) {
      return {
        ok: true, source: 'menu-exact', sourceLabel: '원가표에서 찾음',
        name: exact.name, input: text,
        total: Math.round(U.toNum(exact.cost)),
        price: Math.round(U.toNum(exact.price)) || 0,
        suggested: Math.round(U.toNum(exact.price)) || suggestPrice(U.toNum(exact.cost)),
        multiplier: 1, adds: [], applied: [], lines: []
      };
    }

    // 2순위 - 원가표 이름이 일부 들어있으면 + 옵션 키워드 적용
    var menu = bestMatch(menus, n);
    if (menu) {
      var op = matchOptions(n);
      var base = U.toNum(menu.cost);
      var total = base * op.multiplier + op.addSum;
      var basePrice = U.toNum(menu.price);
      var suggested = basePrice
        ? Math.ceil((basePrice * op.multiplier + op.addSum) / 1000) * 1000
        : suggestPrice(total);
      return {
        ok: true, source: 'menu-option',
        sourceLabel: op.applied.length ? '원가표 + 옵션 적용' : '원가표에서 찾음',
        name: menu.name, input: text,
        base: base, total: Math.round(total), price: 0, suggested: suggested,
        multiplier: op.multiplier, adds: op.adds, applied: op.applied, lines: []
      };
    }

    // 3순위 - 재료·레시피로 계산 (선택 기능)
    var recipe = bestMatch(DB.list('recipes'), n);
    if (recipe) {
      var rc = recipeCost(recipe);
      var op2 = matchOptions(n);
      var total2 = rc.base * op2.multiplier + op2.addSum;
      return {
        ok: true, source: 'recipe', sourceLabel: '재료로 계산함',
        name: recipe.name, input: text,
        lines: rc.lines, material: rc.material, packaging: rc.packaging, labor: rc.labor,
        base: rc.base, total: Math.round(total2), price: 0, suggested: suggestPrice(total2),
        multiplier: op2.multiplier, adds: op2.adds, applied: op2.applied
      };
    }

    return {
      ok: false, unknown: true, input: text,
      reason: '원가표에서 "' + text + '" 을(를) 찾지 못했어요.',
      hint: '아래 [메뉴별 원가표]에 이 이름과 원가를 한 번만 적어두면 다음부터는 자동으로 계산됩니다.'
    };
  }

  /* 주문 한 건의 원가를 구합니다.
     - 주문서에 원가를 직접 적어두었으면 그 값을 씁니다 (사장님이 적은 값이 우선)
     - 비어 있으면 원가표에서 찾아 계산합니다 */
  function orderCost(order) {
    var stored = U.toNum(order && order.cost);
    if (stored > 0) return { value: stored, from: 'order' };

    var r = calcFromText((order && order.request) || '');
    if (r.ok) {
      return { value: Math.round(r.total / 10) * 10, from: 'menu', name: r.name, source: r.source };
    }
    return { value: 0, from: 'none' };
  }

  /* ================= 화면 ================= */

  function render(view) {
    view.innerHTML =
      calcCard() +
      menuCard() +
      optionCard() +
      advancedCard();
    bind(view);
    var last = DB.read('lastCalc', '');
    if (last) { U.$('#calcInput').value = last; runCalc(); }
  }

  /* ---------- 계산기 ---------- */
  function calcCard() {
    return '' +
    '<div class="card">' +
      '<h2>🧮 원가 계산기</h2>' +
      '<p class="hint">주문 내용을 그대로 적어보세요. 예) <code>생화케이크 2단</code>, <code>딸기케이크 1호</code></p>' +
      '<div class="inline-field">' +
        '<div><input id="calcInput" placeholder="생화케이크 2단" autocomplete="off"></div>' +
        '<button class="btn" id="calcRun">계산</button>' +
      '</div>' +
      '<div id="calcResult"></div>' +
    '</div>';
  }

  function runCalc() {
    var text = U.$('#calcInput').value.trim();
    DB.write('lastCalc', text);
    var r = calcFromText(text);
    var box = U.$('#calcResult');

    if (!r.ok) {
      box.innerHTML = '<div class="warn" style="margin-top:12px">' + U.esc(r.reason) +
        (r.hint ? '<br>' + U.esc(r.hint) : '') + '</div>' +
        (r.unknown ? '<div class="row" style="margin-top:10px">' +
          '<button class="btn small" id="calcAddMenu">➕ "' + U.esc(text) + '" 원가표에 추가</button></div>' : '');
      if (r.unknown) U.$('#calcAddMenu').onclick = function () { menuModal(null, text); };
      return;
    }

    var profit = U.toNum(r.suggested) - U.toNum(r.total);
    var rate = r.suggested ? Math.round(profit / r.suggested * 100) : 0;

    var detail = '';
    if (r.source === 'recipe') {
      var rows = r.lines.map(function (l) {
        return '<tr><td><span class="badge ' + (l.kind === '포장' ? 'gray' : '') + '">' + l.kind + '</span></td>' +
          '<td>' + U.esc(l.name) + '</td><td class="num">' + U.esc(l.qty) + '</td>' +
          '<td class="num">' + U.won(l.cost) + '</td></tr>';
      }).join('');
      rows += '<tr><td><span class="badge amber">인건비</span></td><td>작업 수고비</td><td class="num">-</td>' +
              '<td class="num">' + U.won(r.labor) + '</td></tr>';
      detail = '<div class="table-wrap"><table>' +
        '<thead><tr><th>구분</th><th>항목</th><th class="num">사용량</th><th class="num">금액</th></tr></thead>' +
        '<tbody>' + rows + '</tbody>' + calcFooter(r) + '</table></div>';
    } else if (r.source === 'menu-option' && (r.multiplier !== 1 || r.adds.length)) {
      detail = '<div class="table-wrap"><table><tbody>' +
        '<tr><td>원가표의 "' + U.esc(r.name) + '"</td><td class="num">' + U.won(r.base) + '</td></tr>' +
        (r.multiplier !== 1 ? '<tr><td>옵션 배수 ×' + r.multiplier.toFixed(2) + '</td><td class="num">' + U.won(r.base * r.multiplier) + '</td></tr>' : '') +
        r.adds.map(function (a) { return '<tr><td>추가: ' + U.esc(a.name) + '</td><td class="num">' + U.won(a.cost) + '</td></tr>'; }).join('') +
        '</tbody><tfoot><tr><td>최종 원가</td><td class="num">' + U.won(r.total) + '</td></tr></tfoot></table></div>';
    }

    box.innerHTML = '' +
      '<div class="divider"></div>' +
      '<div class="grid four" style="margin-bottom:12px">' +
        stat('찾은 메뉴', U.esc(r.name) + '<br><span class="badge ' + srcCls(r.source) + '">' + r.sourceLabel + '</span>', '') +
        stat('원가', U.won(r.total), 'amber') +
        stat(r.price ? '판매가' : '추천 판매가', U.won(r.suggested), 'rose') +
        stat('이익', U.won(profit) + ' (' + rate + '%)', 'mint') +
      '</div>' +
      detail +
      '<div class="row" style="margin-top:12px">' +
        '<button class="btn ghost small" id="calcToOrder">이 내용으로 주문서 작성</button>' +
        (r.source === 'recipe' ? '<button class="btn ghost small" id="calcSaveMenu">원가표에 저장해 두기</button>' : '') +
      '</div>';

    U.$('#calcToOrder').onclick = function () {
      location.hash = '#orders';
      setTimeout(function () {
        var f = U.$('#orderForm'); if (!f) return;
        f.request.value = r.input;
        f.price.value = r.suggested;
        f.cost.value = r.total;
        f.customerName.focus();
        U.toast('주문서에 옮겼어요');
      }, 60);
    };
    var saveBtn = U.$('#calcSaveMenu');
    if (saveBtn) saveBtn.onclick = function () { menuModal(null, r.input, r.total, r.suggested); };
  }

  function calcFooter(r) {
    return '<tfoot>' +
      '<tr><td colspan="3">기본 원가 합계</td><td class="num">' + U.won(r.base) + '</td></tr>' +
      (r.multiplier !== 1 ? '<tr><td colspan="3">옵션 배수 ×' + r.multiplier.toFixed(2) + '</td><td class="num">' + U.won(r.base * r.multiplier) + '</td></tr>' : '') +
      r.adds.map(function (a) { return '<tr><td colspan="3">추가: ' + U.esc(a.name) + '</td><td class="num">' + U.won(a.cost) + '</td></tr>'; }).join('') +
      '<tr><td colspan="3">최종 원가</td><td class="num">' + U.won(r.total) + '</td></tr>' +
    '</tfoot>';
  }

  function srcCls(src) {
    return src === 'recipe' ? 'gray' : src === 'menu-option' ? 'amber' : 'mint';
  }
  function stat(label, value, cls) {
    return '<div class="stat ' + cls + '"><div class="label">' + label + '</div>' +
           '<div class="value" style="font-size:17px">' + value + '</div></div>';
  }

  /* ---------- 메뉴별 원가표 (직접 입력) ---------- */
  function menuCard() {
    var menus = DB.list('menus').slice().sort(function (a, b) {
      return String(a.name).localeCompare(String(b.name));
    });
    var rows = menus.map(menuRow).join('');
    var totalCost = menus.reduce(function (a, m) { return a + U.toNum(m.cost); }, 0);

    return '' +
    '<div class="card">' +
      '<div class="row"><h2 style="margin:0">💰 메뉴별 원가표</h2><div class="spacer"></div>' +
        '<button class="btn ghost small" id="menuCsv">CSV 저장</button>' +
        '<button class="btn small" id="addMenu">+ 메뉴 추가</button></div>' +
      '<p class="hint">사장님이 직접 원가를 적어두는 표입니다. 여기에 적어두면 계산기와 주문서의 ' +
      '[자동계산]이 이 값을 사용합니다. <b>표 안의 숫자는 바로 고쳐 쓸 수 있어요.</b></p>' +
      (menus.length
        ? '<div class="table-wrap"><table>' +
            '<thead><tr><th>메뉴 이름</th><th class="num">원가</th><th class="num">판매가</th>' +
            '<th class="num">이익</th><th class="num">이익률</th><th>메모</th><th></th></tr></thead>' +
            '<tbody id="menuBody">' + rows + '</tbody>' +
            '<tfoot><tr><td>메뉴 ' + menus.length + '개</td><td class="num">평균 ' +
              U.won(menus.length ? totalCost / menus.length : 0) + '</td><td colspan="5"></td></tr></tfoot>' +
          '</table></div>'
        : '<div class="empty">아직 등록된 메뉴가 없어요.<br>[+ 메뉴 추가]를 눌러 자주 만드는 케이크부터 적어보세요.</div>') +
    '</div>';
  }

  function menuRow(m) {
    var cost = U.toNum(m.cost), price = U.toNum(m.price);
    var profit = price - cost;
    var rate = price ? Math.round(profit / price * 100) : 0;
    return '<tr data-menu="' + m.id + '">' +
      '<td><input class="m-name" value="' + U.esc(m.name) + '" style="min-width:130px"></td>' +
      '<td class="num"><input class="m-cost" type="number" min="0" step="any" style="width:100px" value="' + U.esc(m.cost) + '"></td>' +
      '<td class="num"><input class="m-price" type="number" min="0" step="any" style="width:100px" value="' + U.esc(m.price) + '"></td>' +
      '<td class="num m-profit" style="color:' + (profit >= 0 ? 'var(--mint)' : 'var(--red)') + '"><b>' + U.num(profit) + '</b></td>' +
      '<td class="num m-rate">' + (price ? rate + '%' : '-') + '</td>' +
      '<td><input class="m-memo" value="' + U.esc(m.memo || '') + '" style="min-width:110px"></td>' +
      '<td class="num"><button class="icon-btn" data-del-menu="' + m.id + '">🗑️</button></td></tr>';
  }

  // 표에서 바로 고쳤을 때: 저장하고 이익 칸만 다시 그림 (화면 전체를 새로 그리지 않아 입력이 끊기지 않음)
  function saveMenuRow(tr) {
    var cost = U.toNum(U.$('.m-cost', tr).value);
    var price = U.toNum(U.$('.m-price', tr).value);
    DB.upsert('menus', {
      id: tr.dataset.menu,
      name: U.$('.m-name', tr).value.trim(),
      cost: cost, price: price,
      memo: U.$('.m-memo', tr).value.trim()
    });
    var profit = price - cost;
    var rate = price ? Math.round(profit / price * 100) : 0;
    var pc = U.$('.m-profit', tr);
    pc.innerHTML = '<b>' + U.num(profit) + '</b>';
    pc.style.color = profit >= 0 ? 'var(--mint)' : 'var(--red)';
    U.$('.m-rate', tr).textContent = price ? rate + '%' : '-';
    U.toast('저장했어요');
  }

  function menuModal(id, presetName, presetCost, presetPrice) {
    var m = id ? DB.find('menus', id)
               : { name: presetName || '', cost: presetCost || '', price: presetPrice || '', memo: '' };
    var html = '' +
      '<div class="field"><label>메뉴 이름 <span style="color:var(--rose)">*</span></label>' +
        '<input id="mName" value="' + U.esc(m.name) + '" placeholder="예: 생화케이크 2단"></div>' +
      '<div class="grid two">' +
        '<div class="field"><label>원가 (재료·포장·수고비 합쳐서)</label>' +
          '<input id="mCost" type="number" min="0" step="any" value="' + U.esc(m.cost) + '" placeholder="45000"></div>' +
        '<div class="field"><label>판매가</label>' +
          '<input id="mPrice" type="number" min="0" step="any" value="' + U.esc(m.price) + '" placeholder="145000"></div>' +
      '</div>' +
      '<div id="mPreview" class="info" style="margin-bottom:12px"></div>' +
      '<div class="field"><label>메모</label><input id="mMemo" value="' + U.esc(m.memo || '') + '" placeholder="예: 생화 시세에 따라 변동"></div>' +
      '<div class="row end"><button class="btn ghost" id="mCancel">취소</button><button class="btn" id="mSave">저장</button></div>';

    U.modal(id ? '메뉴 수정' : '메뉴 추가', html, function (body) {
      function preview() {
        var c = U.toNum(U.$('#mCost', body).value), p = U.toNum(U.$('#mPrice', body).value);
        if (!c) { U.$('#mPreview', body).textContent = '원가를 넣으면 이익이 계산됩니다.'; return; }
        if (!p) {
          U.$('#mPreview', body).textContent =
            '판매가를 비워두면 마진율 ' + DB.settings().defaultMarginPct + '% 기준 ' + U.won(suggestPrice(c)) + ' 을 추천합니다.';
          return;
        }
        U.$('#mPreview', body).textContent =
          '이익 ' + U.won(p - c) + ' (이익률 ' + Math.round((p - c) / p * 100) + '%)';
      }
      preview();
      U.$('#mCost', body).oninput = preview;
      U.$('#mPrice', body).oninput = preview;
      U.$('#mCancel', body).onclick = U.closeModal;
      U.$('#mSave', body).onclick = function () {
        var name = U.$('#mName', body).value.trim();
        if (!name) { U.toast('메뉴 이름을 적어주세요'); return; }
        DB.upsert('menus', {
          id: m.id, name: name,
          cost: U.toNum(U.$('#mCost', body).value),
          price: U.toNum(U.$('#mPrice', body).value),
          memo: U.$('#mMemo', body).value.trim()
        });
        U.closeModal(); U.toast('저장했어요'); App.render();
      };
    });
  }

  /* ---------- 옵션 키워드 ---------- */
  function optionCard() {
    var ops = DB.list('options');
    var rows = ops.map(function (o) {
      return '<tr><td><b>' + U.esc(o.keyword) + '</b></td>' +
        '<td>' + (o.type === 'multiply' ? '<span class="badge">배수</span>' : '<span class="badge mint">추가금액</span>') + '</td>' +
        '<td class="num">' + (o.type === 'multiply' ? '×' + o.value : U.won(o.value)) + '</td>' +
        '<td>' + U.esc(o.memo || '') + '</td>' +
        '<td class="num"><button class="icon-btn" data-del-opt="' + o.id + '">🗑️</button></td></tr>';
    }).join('');
    return '' +
    '<div class="card">' +
      '<div class="row"><h2 style="margin:0">🏷️ 옵션 키워드</h2><div class="spacer"></div>' +
      '<button class="btn small" id="addOption">+ 옵션 추가</button></div>' +
      '<p class="hint">원가표에 없는 조합이 들어와도 자동으로 계산되게 해줍니다. ' +
      '예) 원가표에 <code>생화케이크</code>만 있어도 <code>생화케이크 2단</code>을 입력하면 원가를 1.8배로 계산합니다. ' +
      '<b>원가표에 이름이 정확히 있으면 옵션은 적용되지 않습니다.</b></p>' +
      (ops.length ? '<div class="table-wrap"><table><thead><tr><th>키워드</th><th>방식</th><th class="num">값</th><th>메모</th><th></th></tr></thead><tbody>' + rows + '</tbody></table></div>'
        : '<div class="empty">등록된 옵션이 없어요.</div>') +
    '</div>';
  }

  function optionModal() {
    var html = '' +
      '<div class="field"><label>키워드</label><input id="oKey" placeholder="예: 2단"></div>' +
      '<div class="field"><label>방식</label><select id="oType">' +
        '<option value="multiply">배수 (원가 × 값)</option><option value="add">추가금액 (원가 + 값)</option></select></div>' +
      '<div class="field"><label>값</label><input id="oVal" type="number" step="any" placeholder="1.8 또는 8000"></div>' +
      '<div class="field"><label>메모</label><input id="oMemo" placeholder="2단 케이크는 재료·수고가 약 1.8배"></div>' +
      '<div class="row end"><button class="btn ghost" id="oCancel">취소</button><button class="btn" id="oSave">저장</button></div>';
    U.modal('옵션 추가', html, function (body) {
      U.$('#oCancel', body).onclick = U.closeModal;
      U.$('#oSave', body).onclick = function () {
        var k = U.$('#oKey', body).value.trim();
        if (!k) { U.toast('키워드를 적어주세요'); return; }
        DB.upsert('options', {
          keyword: k, type: U.$('#oType', body).value,
          value: U.toNum(U.$('#oVal', body).value), memo: U.$('#oMemo', body).value.trim()
        });
        U.closeModal(); U.toast('저장했어요'); App.render();
      };
    });
  }

  /* ---------- (선택) 재료로 계산하기 ---------- */
  function advancedCard() {
    return '' +
    '<details class="card adv">' +
      '<summary>🧈 재료로 계산하기 <span class="cap-sub">(선택 · 평소엔 안 쓰셔도 됩니다)</span></summary>' +
      '<p class="hint" style="margin-top:12px">재료 단가와 레시피를 등록해 두면, 원가표에 없는 메뉴는 재료비로 계산해 줍니다. ' +
      '원가를 처음 잡아볼 때나 재료값이 올랐을 때 확인용으로 쓰세요.</p>' +
      recipeSection() +
      ingredientSection() +
    '</details>';
  }

  function recipeSection() {
    var recipes = DB.list('recipes');
    var rows = recipes.map(function (r) {
      var c = recipeCost(r);
      return '<tr><td><b>' + U.esc(r.name) + '</b>' + (r.memo ? '<br><span class="cap-sub">' + U.esc(r.memo) + '</span>' : '') + '</td>' +
        '<td class="num">' + (r.items || []).length + '개</td>' +
        '<td class="num">' + U.won(c.material) + '</td>' +
        '<td class="num">' + U.won(c.packaging) + '</td>' +
        '<td class="num">' + U.won(c.labor) + '</td>' +
        '<td class="num"><b>' + U.won(c.base) + '</b></td>' +
        '<td class="num"><button class="icon-btn" data-edit-recipe="' + r.id + '">✏️</button>' +
        '<button class="icon-btn" data-del-recipe="' + r.id + '">🗑️</button></td></tr>';
    }).join('');

    return '<div class="divider"></div>' +
      '<div class="row"><h3 style="margin:0">🍰 레시피</h3><div class="spacer"></div>' +
      '<button class="btn ghost small" id="addRecipe">+ 레시피 추가</button></div>' +
      (recipes.length ? '<div class="table-wrap"><table><thead><tr><th>이름</th><th class="num">재료수</th>' +
        '<th class="num">재료비</th><th class="num">포장비</th><th class="num">인건비</th><th class="num">합계</th><th></th></tr></thead>' +
        '<tbody>' + rows + '</tbody></table></div>'
        : '<div class="empty">등록된 레시피가 없어요.</div>');
  }

  function ingredientSection() {
    var ings = DB.list('ingredients');
    var rows = ings.map(function (g) {
      return '<tr data-ing="' + g.id + '">' +
        '<td><input class="f-name" value="' + U.esc(g.name) + '" style="min-width:110px"></td>' +
        '<td class="num"><input class="f-price" type="number" min="0" step="any" style="width:95px" value="' + U.esc(g.packPrice) + '"></td>' +
        '<td class="num"><input class="f-qty" type="number" min="0" step="any" style="width:85px" value="' + U.esc(g.packQty) + '"></td>' +
        '<td><input class="f-unit" style="width:60px" value="' + U.esc(g.unit) + '"></td>' +
        '<td class="num"><b>' + U.won(unitCost(g)) + '</b> /' + U.esc(g.unit) + '</td>' +
        '<td>' + (g.url ? '<a href="' + U.esc(g.url) + '" target="_blank" rel="noopener">구매처</a>' : '<span class="cap-sub">-</span>') + '</td>' +
        '<td class="num"><button class="icon-btn" data-del-ing="' + g.id + '">🗑️</button></td></tr>';
    }).join('');

    return '<div class="divider"></div>' +
      '<div class="row"><h3 style="margin:0">🧈 재료 단가</h3><div class="spacer"></div>' +
      '<button class="btn ghost small" id="ingCsv">CSV 저장</button>' +
      '<button class="btn ghost small" id="addIngredient">+ 재료 추가</button></div>' +
      '<p class="hint">구매한 가격과 용량을 적으면 1g(또는 1개)당 단가를 자동으로 계산합니다.</p>' +
      (ings.length ? '<div class="table-wrap"><table><thead><tr><th>재료명</th><th class="num">구매가</th>' +
        '<th class="num">용량</th><th>단위</th><th class="num">단가</th><th>링크</th><th></th></tr></thead>' +
        '<tbody>' + rows + '</tbody></table></div>'
        : '<div class="empty">등록된 재료가 없어요.</div>');
  }

  function recipeModal(id) {
    var r = id ? DB.find('recipes', id) : { name: '', items: [], packItems: [], labor: '', memo: '' };
    var ings = DB.list('ingredients');
    var inv = DB.list('inventory');

    function ingRow(it) {
      it = it || { ingId: '', qty: '' };
      return '<div class="row ing-row" style="gap:6px;margin-bottom:6px">' +
        '<select class="ing-sel" style="flex:2">' + '<option value="">재료 선택</option>' +
          ings.map(function (g) { return '<option value="' + g.id + '"' + (g.id === it.ingId ? ' selected' : '') + '>' + U.esc(g.name) + ' (' + U.won(unitCost(g)) + '/' + U.esc(g.unit) + ')</option>'; }).join('') +
        '</select>' +
        '<input class="ing-qty" style="flex:1" type="number" min="0" step="any" placeholder="사용량" value="' + U.esc(it.qty) + '">' +
        '<button class="icon-btn rm-row">🗑️</button></div>';
    }
    function packRow(it) {
      it = it || { invId: '', qty: 1 };
      return '<div class="row pack-row" style="gap:6px;margin-bottom:6px">' +
        '<select class="pack-sel" style="flex:2"><option value="">포장자재 선택</option>' +
          inv.map(function (g) { return '<option value="' + g.id + '"' + (g.id === it.invId ? ' selected' : '') + '>' + U.esc(g.name) + ' (' + U.won(g.unitPrice) + ')</option>'; }).join('') +
        '</select>' +
        '<input class="pack-qty" style="flex:1" type="number" min="0" step="any" placeholder="개수" value="' + U.esc(it.qty) + '">' +
        '<button class="icon-btn rm-row">🗑️</button></div>';
    }

    var html = '' +
      '<div class="field"><label>케이크 이름 <span style="color:var(--rose)">*</span></label>' +
      '<input id="rName" value="' + U.esc(r.name) + '" placeholder="예: 생화케이크"></div>' +
      '<div class="field"><label>들어가는 재료</label><div id="ingRows">' +
        ((r.items || []).length ? r.items.map(ingRow).join('') : ingRow()) +
      '</div><button class="btn ghost small" id="addIng">+ 재료 줄 추가</button></div>' +
      '<div class="field"><label>포장 자재 (상자 · 리본 · 보냉백)</label><div id="packRows">' +
        ((r.packItems || []).length ? r.packItems.map(packRow).join('') : packRow()) +
      '</div><button class="btn ghost small" id="addPack">+ 포장 줄 추가</button></div>' +
      '<div class="field"><label>인건비 (비워두면 설정값 ' + U.won(DB.settings().laborPerCake) + ' 사용)</label>' +
      '<input id="rLabor" type="number" min="0" step="any" value="' + U.esc(r.labor) + '" placeholder="8000"></div>' +
      '<div class="field"><label>메모</label><input id="rMemo" value="' + U.esc(r.memo || '') + '"></div>' +
      '<div class="row end"><button class="btn ghost" id="rCancel">취소</button><button class="btn" id="rSave">저장</button></div>';

    U.modal(id ? '레시피 수정' : '레시피 추가', html, function (body) {
      body.addEventListener('click', function (e) {
        if (e.target.classList.contains('rm-row')) e.target.closest('.row').remove();
      });
      U.$('#addIng', body).onclick = function () { U.$('#ingRows', body).insertAdjacentHTML('beforeend', ingRow()); };
      U.$('#addPack', body).onclick = function () { U.$('#packRows', body).insertAdjacentHTML('beforeend', packRow()); };
      U.$('#rCancel', body).onclick = U.closeModal;
      U.$('#rSave', body).onclick = function () {
        var name = U.$('#rName', body).value.trim();
        if (!name) { U.toast('케이크 이름을 적어주세요'); return; }
        var items = U.$$('.ing-row', body).map(function (row) {
          return { ingId: U.$('.ing-sel', row).value, qty: U.toNum(U.$('.ing-qty', row).value) };
        }).filter(function (x) { return x.ingId && x.qty > 0; });
        var packItems = U.$$('.pack-row', body).map(function (row) {
          return { invId: U.$('.pack-sel', row).value, qty: U.toNum(U.$('.pack-qty', row).value) };
        }).filter(function (x) { return x.invId && x.qty > 0; });
        DB.upsert('recipes', {
          id: r.id, name: name, items: items, packItems: packItems,
          labor: U.$('#rLabor', body).value, memo: U.$('#rMemo', body).value.trim()
        });
        U.closeModal(); U.toast('저장했어요'); App.render();
      };
    });
  }

  function ingredientModal(id) {
    var g = id ? DB.find('ingredients', id) : { name: '', packPrice: '', packQty: '', unit: 'g', url: '' };
    var html = '' +
      '<div class="field"><label>재료명 <span style="color:var(--rose)">*</span></label><input id="gName" value="' + U.esc(g.name) + '" placeholder="예: 무염버터"></div>' +
      '<div class="grid two">' +
        '<div class="field"><label>구매 가격(원)</label><input id="gPrice" type="number" min="0" step="any" value="' + U.esc(g.packPrice) + '" placeholder="12900"></div>' +
        '<div class="field"><label>구매 용량</label><input id="gQty" type="number" min="0" step="any" value="' + U.esc(g.packQty) + '" placeholder="1000"></div>' +
      '</div>' +
      '<div class="field"><label>단위 (g, ml, 개, 송이 …)</label><input id="gUnit" value="' + U.esc(g.unit) + '"></div>' +
      '<div class="field"><label>구매처 링크 (선택)</label><input id="gUrl" value="' + U.esc(g.url || '') + '" placeholder="https://"></div>' +
      '<div class="row end"><button class="btn ghost" id="gCancel">취소</button><button class="btn" id="gSave">저장</button></div>';
    U.modal(id ? '재료 수정' : '재료 추가', html, function (body) {
      U.$('#gCancel', body).onclick = U.closeModal;
      U.$('#gSave', body).onclick = function () {
        var name = U.$('#gName', body).value.trim();
        if (!name) { U.toast('재료명을 적어주세요'); return; }
        DB.upsert('ingredients', {
          id: g.id, name: name,
          packPrice: U.toNum(U.$('#gPrice', body).value),
          packQty: U.toNum(U.$('#gQty', body).value),
          unit: U.$('#gUnit', body).value.trim() || 'g',
          url: U.$('#gUrl', body).value.trim(),
          priceCheckedAt: U.today()
        });
        U.closeModal(); U.toast('저장했어요'); App.render();
      };
    });
  }

  /* ---------- 이벤트 연결 ---------- */
  function bind(view) {
    U.$('#calcRun', view).onclick = runCalc;
    U.$('#calcInput', view).addEventListener('keydown', function (e) {
      if (e.key === 'Enter') runCalc();
    });
    U.$('#addMenu', view).onclick = function () { menuModal(null); };
    U.$('#addOption', view).onclick = optionModal;
    U.$('#addRecipe', view).onclick = function () { recipeModal(null); };
    U.$('#addIngredient', view).onclick = function () { ingredientModal(null); };

    U.$('#menuCsv', view).onclick = function () {
      var rows = [['메뉴 이름', '원가', '판매가', '이익', '이익률(%)', '메모']];
      DB.list('menus').forEach(function (m) {
        var c = U.toNum(m.cost), p = U.toNum(m.price);
        rows.push([m.name, c, p, p - c, p ? Math.round((p - c) / p * 100) : '', m.memo || '']);
      });
      U.downloadCsv('메뉴별_원가표.csv', rows);
      U.toast('CSV 파일을 저장했어요');
    };
    U.$('#ingCsv', view).onclick = function () {
      var rows = [['재료명', '구매가', '용량', '단위', '단가', '구매처']];
      DB.list('ingredients').forEach(function (g) {
        rows.push([g.name, g.packPrice, g.packQty, g.unit, Math.round(unitCost(g)), g.url || '']);
      });
      U.downloadCsv('재료단가.csv', rows);
    };

    view.addEventListener('click', function (e) {
      var t = e.target;
      if (t.dataset.delMenu && U.confirmBox('이 메뉴를 원가표에서 지울까요?')) {
        DB.remove('menus', t.dataset.delMenu); App.render();
      }
      if (t.dataset.editRecipe) recipeModal(t.dataset.editRecipe);
      if (t.dataset.delRecipe && U.confirmBox('이 레시피를 삭제할까요?')) {
        DB.remove('recipes', t.dataset.delRecipe); App.render();
      }
      if (t.dataset.delIng && U.confirmBox('이 재료를 삭제할까요?')) {
        DB.remove('ingredients', t.dataset.delIng); App.render();
      }
      if (t.dataset.delOpt && U.confirmBox('이 옵션을 삭제할까요?')) {
        DB.remove('options', t.dataset.delOpt); App.render();
      }
    });

    // 표에서 바로 수정
    view.addEventListener('change', function (e) {
      var menuTr = e.target.closest('tr[data-menu]');
      if (menuTr) { saveMenuRow(menuTr); return; }

      var ingTr = e.target.closest('tr[data-ing]');
      if (ingTr) {
        DB.upsert('ingredients', {
          id: ingTr.dataset.ing,
          name: U.$('.f-name', ingTr).value.trim(),
          packPrice: U.toNum(U.$('.f-price', ingTr).value),
          packQty: U.toNum(U.$('.f-qty', ingTr).value),
          unit: U.$('.f-unit', ingTr).value.trim() || 'g'
        });
        U.toast('저장했어요'); App.render();
      }
    });
  }

  return {
    render: render, calcFromText: calcFromText, orderCost: orderCost, recipeCost: recipeCost,
    unitCost: unitCost, suggestPrice: suggestPrice
  };
})();

/* ===== js/orders.js ===== */
/* 주문 등록 + 픽업 달력 */
window.Orders = (function () {

  var calMonth = U.thisMonth();   // 달력에 보이는 달
  var editingId = null;           // 수정 중인 주문

  /* ---------- 주문 목록 도우미 ---------- */
  function all() {
    return DB.list('orders').slice().sort(function (a, b) {
      return (a.pickupDate + (a.pickupTime || '')).localeCompare(b.pickupDate + (b.pickupTime || ''));
    });
  }
  function byDate(date) { return all().filter(function (o) { return o.pickupDate === date; }); }
  function byMonth(m) { return all().filter(function (o) { return (o.pickupDate || '').slice(0, 7) === m; }); }

  /* ================= 화면 ================= */
  function render(view) {
    view.innerHTML = formCard() + calendarCard() + upcomingCard();
    bind(view);
  }

  function formCard() {
    var set = DB.settings();
    return '' +
    '<div class="card">' +
      '<div class="row"><h2 style="margin:0">📝 주문서 작성</h2><div class="spacer"></div>' +
        '<button class="btn ghost small" id="pasteImport">💬 채팅 내용으로 주문 만들기</button>' +
      '</div>' +
      '<p class="hint">별표(<span style="color:var(--rose)">*</span>) 항목만 필수입니다. 저장하면 아래 달력의 픽업 날짜에 자동으로 표시돼요.</p>' +
      '<form id="orderForm" novalidate>' +
        '<input type="hidden" name="oid">' +
        '<div class="grid two">' +
          '<div class="field"><label>고객이름 <span style="color:var(--rose)">*</span></label>' +
            '<input name="customerName" required placeholder="김민지" autocomplete="off"></div>' +
          '<div class="field"><label>연락처</label>' +
            '<input name="phone" placeholder="010-1234-5678" inputmode="numeric" autocomplete="off"></div>' +
          '<div class="field"><label>픽업날짜 <span style="color:var(--rose)">*</span></label>' +
            '<input name="pickupDate" type="date" required value="' + U.today() + '"></div>' +
          '<div class="field"><label>픽업시간</label>' +
            '<input name="pickupTime" type="time" value="14:00"></div>' +
        '</div>' +
        '<div class="field"><label>주문요청사항</label>' +
          '<textarea name="request" placeholder="예: 생화케이크 2단 / 문구 &quot;생일 축하해&quot; / 핑크톤"></textarea></div>' +
        '<div class="grid three">' +
          '<div class="field"><label>가격 (판매가)</label>' +
            '<input name="price" type="number" min="0" step="any" placeholder="65000"></div>' +
          '<div class="field"><label>원가 <button type="button" class="btn ghost small" id="autoCost" style="padding:2px 8px;font-size:11px">자동계산</button></label>' +
            '<input name="cost" type="number" min="0" step="any" placeholder="24000"></div>' +
          '<div class="field"><label>예약금 (받은 돈)</label>' +
            '<input name="deposit" type="number" min="0" step="any" placeholder="20000"></div>' +
        '</div>' +
        '<div class="field"><label>참고사항</label>' +
          '<textarea name="note" placeholder="예: 알러지 - 견과류 제외 / 주차 문의"></textarea></div>' +
        '<div class="grid two">' +
          '<div class="field"><label>주문 경로</label><select name="source">' +
            '<option value="manual"' + (set.reservationSource === 'manual' ? ' selected' : '') + '>직접 입력</option>' +
            '<option value="paste"' + (set.reservationSource === 'paste' ? ' selected' : '') + '>채팅 붙여넣기</option>' +
            '<option value="phone">전화</option><option value="instagram">인스타그램</option>' +
          '</select></div>' +
          '<div class="field"><label>상태</label><select name="status">' +
            '<option value="reserved">예약</option><option value="done">픽업 완료</option><option value="canceled">취소</option>' +
          '</select></div>' +
        '</div>' +
        '<div class="row end">' +
          '<button type="button" class="btn ghost" id="formReset">새로 작성</button>' +
          '<button type="submit" class="btn" id="formSubmit">주문 저장</button>' +
        '</div>' +
      '</form>' +
    '</div>';
  }

  /* ---------- 달력 ---------- */
  function calendarCard() {
    return '<div class="card">' +
      '<div class="cal-head">' +
        '<button class="btn ghost small" id="calPrev">‹ 이전달</button>' +
        '<div class="cal-title" id="calTitle">' + U.monthTitle(calMonth) + '</div>' +
        '<button class="btn ghost small" id="calNext">다음달 ›</button>' +
      '</div>' +
      '<div id="calBody">' + calendarGrid() + '</div>' +
      '<p class="hint" style="margin-top:10px">날짜를 누르면 그날의 주문을 자세히 볼 수 있어요.</p>' +
    '</div>';
  }

  function calendarGrid() {
    var p = calMonth.split('-'), y = +p[0], m = +p[1];
    var first = new Date(y, m - 1, 1);
    var startDow = first.getDay();
    var days = U.lastDayOfMonth(calMonth);
    var today = U.today();
    var html = U.DOW.map(function (d, i) {
      return '<div class="dow' + (i === 0 ? ' sun' : '') + '">' + d + '</div>';
    }).join('');

    for (var i = 0; i < startDow; i++) html += '<div class="day empty"></div>';

    for (var d = 1; d <= days; d++) {
      var date = calMonth + '-' + U.pad(d);
      var list = byDate(date).filter(function (o) { return o.status !== 'canceled'; });
      var dow = new Date(y, m - 1, d).getDay();
      var cls = 'day' + (dow === 0 ? ' sun' : '') + (date === today ? ' today' : '');
      var evs = list.slice(0, 3).map(function (o) {
        return '<div class="ev' + (o.status === 'done' ? ' done' : '') + '">' +
          (o.pickupTime ? U.esc(o.pickupTime) + ' ' : '') + U.esc(o.customerName) + '</div>';
      }).join('');
      var more = list.length > 3 ? '<div class="more">+' + (list.length - 3) + '건 더</div>' : '';
      html += '<div class="' + cls + '" data-date="' + date + '"><div class="dnum">' + d + '</div>' + evs + more + '</div>';
    }
    return '<div class="cal">' + html + '</div>';
  }

  function dayModal(date) {
    var list = byDate(date);
    var body = list.length ? list.map(function (o) {
      return '<div class="q-item">' +
        '<div class="row"><b>' + U.esc(o.customerName) + '</b>' +
        '<span class="badge ' + statusCls(o.status) + '">' + statusText(o.status) + '</span>' +
        '<div class="spacer"></div>' +
        '<span class="cap-sub">' + U.esc(o.pickupTime || '') + '</span></div>' +
        (o.phone ? '<div class="cap-sub">📞 ' + U.esc(U.phone(o.phone)) + '</div>' : '') +
        (o.request ? '<div style="margin-top:6px;white-space:pre-wrap">' + U.esc(o.request) + '</div>' : '') +
        (o.note ? '<div class="cap-sub" style="margin-top:4px">📌 ' + U.esc(o.note) + '</div>' : '') +
        '<div class="row" style="margin-top:8px">' +
          '<span class="badge gray">판매 ' + U.won(o.price) + '</span>' +
          '<span class="badge gray">원가 ' + U.won(o.cost) + '</span>' +
          '<span class="badge mint">이익 ' + U.won(U.toNum(o.price) - U.toNum(o.cost)) + '</span>' +
        '</div>' +
        '<div class="row" style="margin-top:8px">' +
          '<button class="btn ghost small" data-edit-order="' + o.id + '">수정</button>' +
          (o.status !== 'done' ? '<button class="btn mint small" data-done-order="' + o.id + '">픽업 완료</button>' : '') +
          '<button class="btn danger small" data-del-order="' + o.id + '">삭제</button>' +
        '</div></div>';
    }).join('') : '<div class="empty">이 날짜에는 주문이 없어요.</div>';

    U.modal(U.korDateFull(date) + ' 주문 ' + list.length + '건', body, function (m) {
      m.addEventListener('click', function (e) {
        var t = e.target;
        if (t.dataset.editOrder) { U.closeModal(); loadToForm(t.dataset.editOrder); }
        if (t.dataset.doneOrder) { DB.upsert('orders', { id: t.dataset.doneOrder, status: 'done' }); U.closeModal(); U.toast('픽업 완료로 바꿨어요'); App.render(); }
        if (t.dataset.delOrder && U.confirmBox('이 주문을 삭제할까요?')) { DB.remove('orders', t.dataset.delOrder); U.closeModal(); U.toast('삭제했어요'); App.render(); }
      });
    });
  }

  function statusText(s) { return s === 'done' ? '픽업완료' : s === 'canceled' ? '취소' : '예약'; }
  function statusCls(s) { return s === 'done' ? 'mint' : s === 'canceled' ? 'red' : ''; }

  /* ---------- 다가오는 픽업 ---------- */
  function upcomingCard() {
    var today = U.today();
    var list = all().filter(function (o) {
      return o.status === 'reserved' && o.pickupDate >= today;
    }).slice(0, 8);
    if (!list.length) return '<div class="card"><h2>📅 다가오는 픽업</h2><div class="empty">예정된 픽업이 없어요.</div></div>';
    var rows = list.map(function (o) {
      var dday = U.diffDays(today, o.pickupDate);
      return '<tr><td>' + U.korDate(o.pickupDate) + ' ' + U.esc(o.pickupTime || '') +
        ' <span class="badge">' + (dday === 0 ? '오늘' : dday === 1 ? '내일' : 'D-' + dday) + '</span></td>' +
        '<td>' + U.esc(o.customerName) + '</td>' +
        '<td>' + U.esc((o.request || '').slice(0, 30)) + '</td>' +
        '<td class="num">' + U.won(o.price) + '</td>' +
        '<td class="num"><button class="icon-btn" data-edit-order="' + o.id + '">✏️</button></td></tr>';
    }).join('');
    return '<div class="card"><h2>📅 다가오는 픽업</h2><div class="table-wrap"><table>' +
      '<thead><tr><th>픽업</th><th>고객</th><th>주문내용</th><th class="num">가격</th><th></th></tr></thead>' +
      '<tbody>' + rows + '</tbody></table></div></div>';
  }

  /* ---------- 폼 처리 ---------- */
  function loadToForm(id) {
    var o = DB.find('orders', id); if (!o) return;
    editingId = id;
    var f = U.$('#orderForm');
    f.oid.value = o.id;
    f.customerName.value = o.customerName || '';
    f.phone.value = o.phone || '';
    f.pickupDate.value = o.pickupDate || '';
    f.pickupTime.value = o.pickupTime || '';
    f.request.value = o.request || '';
    f.price.value = o.price || '';
    f.cost.value = o.cost || '';
    f.deposit.value = o.deposit || '';
    f.note.value = o.note || '';
    f.source.value = o.source || 'manual';
    f.status.value = o.status || 'reserved';
    U.$('#formSubmit').textContent = '수정 저장';
    window.scrollTo({ top: 0, behavior: 'smooth' });
    U.toast('주문을 불러왔어요');
  }

  function resetForm() {
    editingId = null;
    var f = U.$('#orderForm');
    f.reset();
    f.oid.value = '';
    f.pickupDate.value = U.today();
    f.pickupTime.value = '14:00';
    U.$('#formSubmit').textContent = '주문 저장';
  }

  function saveForm(e) {
    e.preventDefault();
    var f = e.target;
    var name = f.customerName.value.trim();
    if (!name) { U.toast('고객이름을 적어주세요'); return; }
    if (!f.pickupDate.value) { U.toast('픽업날짜를 골라주세요'); return; }

    var isNew = !f.oid.value;
    var saved = DB.upsert('orders', {
      id: f.oid.value || undefined,
      customerName: name,
      phone: U.phone(f.phone.value.trim()),
      pickupDate: f.pickupDate.value,
      pickupTime: f.pickupTime.value,
      request: f.request.value.trim(),
      price: U.toNum(f.price.value),
      cost: U.toNum(f.cost.value),
      deposit: U.toNum(f.deposit.value),
      note: f.note.value.trim(),
      source: f.source.value,
      status: f.status.value,
      orderDate: f.oid.value ? undefined : U.today()
    });
    calMonth = saved.pickupDate.slice(0, 7);
    resetForm();

  /* ---------- 채팅 내용으로 주문 만들기 ---------- */

  // 서식 예시 (사장님이 고객에게 보내거나, 메모할 때 쓰는 양식)
