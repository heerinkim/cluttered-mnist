<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>케이크 공방 운영 노트</title>
<link rel="stylesheet" href="css/style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎂</text></svg>">
</head>
<body>

<header class="topbar">
  <div class="brand">
    <span class="logo">🎂</span>
    <div>
      <h1 id="shopName">케이크 공방</h1>
      <p class="sub">주문 · 정산 · 재고 · 원가 관리</p>
    </div>
  </div>
  <div class="topbar-right">
    <span id="todayLabel" class="today-chip"></span>
  </div>
</header>

<nav class="tabs" id="tabs">
  <button data-route="home">🏠 홈</button>
  <button data-route="orders">📝 주문·달력</button>
  <button data-route="monthly">📊 월별정산</button>
  <button data-route="inventory">📦 재고</button>
  <button data-route="gallery">🖼️ 갤러리</button>
  <button data-route="cost">💰 원가표</button>
  <button data-route="notify">💬 알림</button>
  <button data-route="settings">⚙️ 설정</button>
</nav>

<main id="view" class="view"></main>

<div id="toast" class="toast"></div>

<div id="modal" class="modal-back" hidden>
  <div class="modal" role="dialog" aria-modal="true">
    <div class="modal-head">
      <h3 id="modalTitle">제목</h3>
      <button class="icon-btn" id="modalClose" aria-label="닫기">✕</button>
    </div>
    <div class="modal-body" id="modalBody"></div>
  </div>
</div>

<script src="js/utils.js"></script>
<script src="js/db.js"></script>
<script src="js/seed.js"></script>
<script src="js/costcalc.js"></script>
<script src="js/orders.js"></script>
<script src="js/monthly.js"></script>
<script src="js/inventory.js"></script>
<script src="js/gallery.js"></script>
<script src="js/notify.js"></script>
<script src="js/cloud.js"></script>
<script src="js/settings.js"></script>
<script src="js/home.js"></script>
<script src="js/app.js"></script>
</body>
</html>
