/* ===== js/costcalc.js ===== */
/* 원가표 + 원가 계산
   1순위: 사장님이 직접 적어둔 [메뉴별 원가표]
   2순위: 원가표 이름 + 옵션 키워드(2단 ×1.8 등)
   3순위: (선택) 재료 단가 + 레시피로 계산 */
window.Cost = (function () {

  /* ================= 계산 엔진 ================= */

  // 띄어쓰기 제거 + 소문자 (이름 비교용)
  function norm(s) { return String(s || '').replace(/\s+/g, '').toLowerCase(); }

  // 재료 1단위(1g, 1ml, 1개)당 가격
  function unitCost(ing) {
    var qty = U.toNum(ing.packQty);
    if (!qty) return 0;
    return U.toNum(ing.packPrice) / qty;
  }

  // 원가로부터 추천 판매가 (설정의 마진율 기준, 1,000원 단위 올림)
  function suggestPrice(cost) {
    var margin = Math.min(95, Math.max(0, U.toNum(DB.settings().defaultMarginPct))) / 100;
    if (margin >= 1) return Math.round(cost);
    return Math.ceil((cost / (1 - margin)) / 1000) * 1000;
  }

  // 레시피 1개의 원가 계산 (재료 + 포장 + 인건비)
  function recipeCost(recipe) {
    var ings = DB.list('ingredients');
    var inv = DB.list('inventory');
    var set = DB.settings();
    var lines = [], material = 0, packaging = 0;

    (recipe.items || []).forEach(function (it) {
      var ing = ings.find(function (x) { return x.id === it.ingId; });
      if (!ing) return;
      var cost = unitCost(ing) * U.toNum(it.qty);
      material += cost;
      lines.push({ kind: '재료', name: ing.name, qty: U.toNum(it.qty) + ing.unit, cost: cost });
    });

    (recipe.packItems || []).forEach(function (it) {
      var item = inv.find(function (x) { return x.id === it.invId; });
      if (!item) return;
      var cost = U.toNum(item.unitPrice) * U.toNum(it.qty);
      packaging += cost;
      lines.push({ kind: '포장', name: item.name, qty: U.toNum(it.qty) + (item.unit || '개'), cost: cost });
    });

    var labor = recipe.labor === '' || recipe.labor === undefined || recipe.labor === null
      ? U.toNum(set.laborPerCake) : U.toNum(recipe.labor);

    return { lines: lines, material: material, packaging: packaging, labor: labor,
             base: material + packaging + labor };
  }

  // 입력한 글에 들어있는 옵션 키워드 찾기
  function matchOptions(n) {
    var multiplier = 1, adds = [], applied = [];
    DB.list('options').forEach(function (op) {
      var k = norm(op.keyword);
      if (!k || n.indexOf(k) < 0) return;
      applied.push(op);
      if (op.type === 'multiply') multiplier *= U.toNum(op.value) || 1;
      else adds.push({ name: op.keyword, cost: U.toNum(op.value) });
    });
    return { multiplier: multiplier, adds: adds, applied: applied,
             addSum: adds.reduce(function (a, b) { return a + b.cost; }, 0) };
  }

  // 이름이 들어있는 항목 중 가장 긴(=구체적인) 것 고르기
  function bestMatch(listArr, n) {
    var found = null;
    listArr.forEach(function (x) {
      var xn = norm(x.name);
      if (xn && n.indexOf(xn) >= 0) {
        if (!found || xn.length > norm(found.name).length) found = x;
      }
    });
    return found;
  }

  /* 글로 적은 주문내용 -> 원가/판매가
     예: "생화케이크 2단", "딸기케이크 1호 레터링" */
  function calcFromText(text) {
    var n = norm(text);
    if (!n) return { ok: false, reason: '내용을 입력해 주세요.' };

    var menus = DB.list('menus');

    // 1순위 - 원가표에 이름이 똑같이 있으면 그 값을 그대로 사용
    var exact = menus.find(function (m) { return norm(m.name) === n; });
    if (exact) {
      return {
        ok: true, source: 'menu-exact', sourceLabel: '원가표에서 찾음',
        name: exact.name, input: text,
        total: Math.round(U.toNum(exact.cost)),
        price: Math.round(U.toNum(exact.price)) || 0,
        suggested: Math.round(U.toNum(exact.price)) || suggestPrice(U.toNum(exact.cost)),
        multiplier: 1, adds: [], applied: [], lines: []
      };
    }

    // 2순위 - 원가표 이름이 일부 들어있으면 + 옵션 키워드 적용
    var menu = bestMatch(menus, n);
    if (menu) {
      var op = matchOptions(n);
      var base = U.toNum(menu.cost);
      var total = base * op.multiplier + op.addSum;
      var basePrice = U.toNum(menu.price);
      var suggested = basePrice
        ? Math.ceil((basePrice * op.multiplier + op.addSum) / 1000) * 1000
        : suggestPrice(total);
      return {
        ok: true, source: 'menu-option',
        sourceLabel: op.applied.length ? '원가표 + 옵션 적용' : '원가표에서 찾음',
        name: menu.name, input: text,
        base: base, total: Math.round(total), price: 0, suggested: suggested,
        multiplier: op.multiplier, adds: op.adds, applied: op.applied, lines: []
      };
    }

    // 3순위 - 재료·레시피로 계산 (선택 기능)
    var recipe = bestMatch(DB.list('recipes'), n);
    if (recipe) {
      var rc = recipeCost(recipe);
      var op2 = matchOptions(n);
      var total2 = rc.base * op2.multiplier + op2.addSum;
      return {
        ok: true, source: 'recipe', sourceLabel: '재료로 계산함',
        name: recipe.name, input: text,
        lines: rc.lines, material: rc.material, packaging: rc.packaging, labor: rc.labor,
        base: rc.base, total: Math.round(total2), price: 0, suggested: suggestPrice(total2),
        multiplier: op2.multiplier, adds: op2.adds, applied: op2.applied
      };
    }

    return {
      ok: false, unknown: true, input: text,
      reason: '원가표에서 "' + text + '" 을(를) 찾지 못했어요.',
      hint: '아래 [메뉴별 원가표]에 이 이름과 원가를 한 번만 적어두면 다음부터는 자동으로 계산됩니다.'
    };
  }

  /* ================= 화면 ================= */

  function render(view) {
    view.innerHTML =
      calcCard() +
      menuCard() +
      optionCard() +
      advancedCard();
    bind(view);
    var last = DB.read('lastCalc', '');
    if (last) { U.$('#calcInput').value = last; runCalc(); }
  }

  /* ---------- 계산기 ---------- */
  function calcCard() {
    return '' +
    '<div class="card">' +
      '<h2>🧮 원가 계산기</h2>' +
      '<p class="hint">주문 내용을 그대로 적어보세요. 예) <code>생화케이크 2단</code>, <code>딸기케이크 1호</code></p>' +
      '<div class="inline-field">' +
        '<div><input id="calcInput" placeholder="생화케이크 2단" autocomplete="off"></div>' +
        '<button class="btn" id="calcRun">계산</button>' +
      '</div>' +
      '<div id="calcResult"></div>' +
    '</div>';
  }

  function runCalc() {
    var text = U.$('#calcInput').value.trim();
    DB.write('lastCalc', text);
    var r = calcFromText(text);
    var box = U.$('#calcResult');

    if (!r.ok) {
      box.innerHTML = '<div class="warn" style="margin-top:12px">' + U.esc(r.reason) +
        (r.hint ? '<br>' + U.esc(r.hint) : '') + '</div>' +
        (r.unknown ? '<div class="row" style="margin-top:10px">' +
          '<button class="btn small" id="calcAddMenu">➕ "' + U.esc(text) + '" 원가표에 추가</button></div>' : '');
      if (r.unknown) U.$('#calcAddMenu').onclick = function () { menuModal(null, text); };
      return;
    }

    var profit = U.toNum(r.suggested) - U.toNum(r.total);
    var rate = r.suggested ? Math.round(profit / r.suggested * 100) : 0;

    var detail = '';
    if (r.source === 'recipe') {
      var rows = r.lines.map(function (l) {
        return '<tr><td><span class="badge ' + (l.kind === '포장' ? 'gray' : '') + '">' + l.kind + '</span></td>' +
          '<td>' + U.esc(l.name) + '</td><td class="num">' + U.esc(l.qty) + '</td>' +
          '<td class="num">' + U.won(l.cost) + '</td></tr>';
      }).join('');
      rows += '<tr><td><span class="badge amber">인건비</span></td><td>작업 수고비</td><td class="num">-</td>' +
              '<td class="num">' + U.won(r.labor) + '</td></tr>';
      detail = '<div class="table-wrap"><table>' +
        '<thead><tr><th>구분</th><th>항목</th><th class="num">사용량</th><th class="num">금액</th></tr></thead>' +
        '<tbody>' + rows + '</tbody>' + calcFooter(r) + '</table></div>';
    } else if (r.source === 'menu-option' && (r.multiplier !== 1 || r.adds.length)) {
      detail = '<div class="table-wrap"><table><tbody>' +
        '<tr><td>원가표의 "' + U.esc(r.name) + '"</td><td class="num">' + U.won(r.base) + '</td></tr>' +
        (r.multiplier !== 1 ? '<tr><td>옵션 배수 ×' + r.multiplier.toFixed(2) + '</td><td class="num">' + U.won(r.base * r.multiplier) + '</td></tr>' : '') +
        r.adds.map(function (a) { return '<tr><td>추가: ' + U.esc(a.name) + '</td><td class="num">' + U.won(a.cost) + '</td></tr>'; }).join('') +
        '</tbody><tfoot><tr><td>최종 원가</td><td class="num">' + U.won(r.total) + '</td></tr></tfoot></table></div>';
    }

    box.innerHTML = '' +
      '<div class="divider"></div>' +
      '<div class="grid four" style="margin-bottom:12px">' +
        stat('찾은 메뉴', U.esc(r.name) + '<br><span class="badge ' + srcCls(r.source) + '">' + r.sourceLabel + '</span>', '') +
        stat('원가', U.won(r.total), 'amber') +
        stat(r.price ? '판매가' : '추천 판매가', U.won(r.suggested), 'rose') +
        stat('이익', U.won(profit) + ' (' + rate + '%)', 'mint') +
      '</div>' +
      detail +
      '<div class="row" style="margin-top:12px">' +
        '<button class="btn ghost small" id="calcToOrder">이 내용으로 주문서 작성</button>' +
        (r.source === 'recipe' ? '<button class="btn ghost small" id="calcSaveMenu">원가표에 저장해 두기</button>' : '') +
      '</div>';

    U.$('#calcToOrder').onclick = function () {
      location.hash = '#orders';
      setTimeout(function () {
        var f = U.$('#orderForm'); if (!f) return;
        f.request.value = r.input;
        f.price.value = r.suggested;
        f.cost.value = r.total;
        f.customerName.focus();
        U.toast('주문서에 옮겼어요');
      }, 60);
    };
    var saveBtn = U.$('#calcSaveMenu');
    if (saveBtn) saveBtn.onclick = function () { menuModal(null, r.input, r.total, r.suggested); };
  }

  function calcFooter(r) {
    return '<tfoot>' +
      '<tr><td colspan="3">기본 원가 합계</td><td class="num">' + U.won(r.base) + '</td></tr>' +
      (r.multiplier !== 1 ? '<tr><td colspan="3">옵션 배수 ×' + r.multiplier.toFixed(2) + '</td><td class="num">' + U.won(r.base * r.multiplier) + '</td></tr>' : '') +
      r.adds.map(function (a) { return '<tr><td colspan="3">추가: ' + U.esc(a.name) + '</td><td class="num">' + U.won(a.cost) + '</td></tr>'; }).join('') +
      '<tr><td colspan="3">최종 원가</td><td class="num">' + U.won(r.total) + '</td></tr>' +
    '</tfoot>';
  }

  function srcCls(src) {
    return src === 'recipe' ? 'gray' : src === 'menu-option' ? 'amber' : 'mint';
  }
  function stat(label, value, cls) {
    return '<div class="stat ' + cls + '"><div class="label">' + label + '</div>' +
           '<div class="value" style="font-size:17px">' + value + '</div></div>';
  }

  /* ---------- 메뉴별 원가표 (직접 입력) ---------- */
  function menuCard() {
    var menus = DB.list('menus').slice().sort(function (a, b) {
      return String(a.name).localeCompare(String(b.name));
    });
    var rows = menus.map(menuRow).join('');
    var totalCost = menus.reduce(function (a, m) { return a + U.toNum(m.cost); }, 0);

    return '' +
    '<div class="card">' +
      '<div class="row"><h2 style="margin:0">💰 메뉴별 원가표</h2><div class="spacer"></div>' +
        '<button class="btn ghost small" id="menuCsv">CSV 저장</button>' +
        '<button class="btn small" id="addMenu">+ 메뉴 추가</button></div>' +
      '<p class="hint">사장님이 직접 원가를 적어두는 표입니다. 여기에 적어두면 계산기와 주문서의 ' +
      '[자동계산]이 이 값을 사용합니다. <b>표 안의 숫자는 바로 고쳐 쓸 수 있어요.</b></p>' +
      (menus.length
        ? '<div class="table-wrap"><table>' +
            '<thead><tr><th>메뉴 이름</th><th class="num">원가</th><th class="num">판매가</th>' +
            '<th class="num">이익</th><th class="num">이익률</th><th>메모</th><th></th></tr></thead>' +
            '<tbody id="menuBody">' + rows + '</tbody>' +
            '<tfoot><tr><td>메뉴 ' + menus.length + '개</td><td class="num">평균 ' +
              U.won(menus.length ? totalCost / menus.length : 0) + '</td><td colspan="5"></td></tr></tfoot>' +
          '</table></div>'
        : '<div class="empty">아직 등록된 메뉴가 없어요.<br>[+ 메뉴 추가]를 눌러 자주 만드는 케이크부터 적어보세요.</div>') +
    '</div>';
  }

  function menuRow(m) {
    var cost = U.toNum(m.cost), price = U.toNum(m.price);
    var profit = price - cost;
    var rate = price ? Math.round(profit / price * 100) : 0;
    return '<tr data-menu="' + m.id + '">' +
      '<td><input class="m-name" value="' + U.esc(m.name) + '" style="min-width:130px"></td>' +
      '<td class="num"><input class="m-cost" type="number" min="0" step="any" style="width:100px" value="' + U.esc(m.cost) + '"></td>' +
      '<td class="num"><input class="m-price" type="number" min="0" step="any" style="width:100px" value="' + U.esc(m.price) + '"></td>' +
      '<td class="num m-profit" style="color:' + (profit >= 0 ? 'var(--mint)' : 'var(--red)') + '"><b>' + U.num(profit) + '</b></td>' +
      '<td class="num m-rate">' + (price ? rate + '%' : '-') + '</td>' +
      '<td><input class="m-memo" value="' + U.esc(m.memo || '') + '" style="min-width:110px"></td>' +
      '<td class="num"><button class="icon-btn" data-del-menu="' + m.id + '">🗑️</button></td></tr>';
  }

  // 표에서 바로 고쳤을 때: 저장하고 이익 칸만 다시 그림 (화면 전체를 새로 그리지 않아 입력이 끊기지 않음)
  function saveMenuRow(tr) {
    var cost = U.toNum(U.$('.m-cost', tr).value);
    var price = U.toNum(U.$('.m-price', tr).value);
    DB.upsert('menus', {
      id: tr.dataset.menu,
      name: U.$('.m-name', tr).value.trim(),
      cost: cost, price: price,
      memo: U.$('.m-memo', tr).value.trim()
    });
    var profit = price - cost;
    var rate = price ? Math.round(profit / price * 100) : 0;
    var pc = U.$('.m-profit', tr);
    pc.innerHTML = '<b>' + U.num(profit) + '</b>';
    pc.style.color = profit >= 0 ? 'var(--mint)' : 'var(--red)';
    U.$('.m-rate', tr).textContent = price ? rate + '%' : '-';
    U.toast('저장했어요');
  }

  function menuModal(id, presetName, presetCost, presetPrice) {
    var m = id ? DB.find('menus', id)
               : { name: presetName || '', cost: presetCost || '', price: presetPrice || '', memo: '' };
    var html = '' +
      '<div class="field"><label>메뉴 이름 <span style="color:var(--rose)">*</span></label>' +
        '<input id="mName" value="' + U.esc(m.name) + '" placeholder="예: 생화케이크 2단"></div>' +
      '<div class="grid two">' +
        '<div class="field"><label>원가 (재료·포장·수고비 합쳐서)</label>' +
          '<input id="mCost" type="number" min="0" step="any" value="' + U.esc(m.cost) + '" placeholder="45000"></div>' +
        '<div class="field"><label>판매가</label>' +
          '<input id="mPrice" type="number" min="0" step="any" value="' + U.esc(m.price) + '" placeholder="145000"></div>' +
      '</div>' +
      '<div id="mPreview" class="info" style="margin-bottom:12px"></div>' +
      '<div class="field"><label>메모</label><input id="mMemo" value="' + U.esc(m.memo || '') + '" placeholder="예: 생화 시세에 따라 변동"></div>' +
      '<div class="row end"><button class="btn ghost" id="mCancel">취소</button><button class="btn" id="mSave">저장</button></div>';

    U.modal(id ? '메뉴 수정' : '메뉴 추가', html, function (body) {
      function preview() {
        var c = U.toNum(U.$('#mCost', body).value), p = U.toNum(U.$('#mPrice', body).value);
        if (!c) { U.$('#mPreview', body).textContent = '원가를 넣으면 이익이 계산됩니다.'; return; }
        if (!p) {
          U.$('#mPreview', body).textContent =
            '판매가를 비워두면 마진율 ' + DB.settings().defaultMarginPct + '% 기준 ' + U.won(suggestPrice(c)) + ' 을 추천합니다.';
          return;
        }
        U.$('#mPreview', body).textContent =
          '이익 ' + U.won(p - c) + ' (이익률 ' + Math.round((p - c) / p * 100) + '%)';
      }
      preview();
      U.$('#mCost', body).oninput = preview;
      U.$('#mPrice', body).oninput = preview;
      U.$('#mCancel', body).onclick = U.closeModal;
      U.$('#mSave', body).onclick = function () {
        var name = U.$('#mName', body).value.trim();
        if (!name) { U.toast('메뉴 이름을 적어주세요'); return; }
        DB.upsert('menus', {
          id: m.id, name: name,
          cost: U.toNum(U.$('#mCost', body).value),
          price: U.toNum(U.$('#mPrice', body).value),
          memo: U.$('#mMemo', body).value.trim()
        });
        U.closeModal(); U.toast('저장했어요'); App.render();
      };
    });
  }

  /* ---------- 옵션 키워드 ---------- */
  function optionCard() {
    var ops = DB.list('options');
    var rows = ops.map(function (o) {
      return '<tr><td><b>' + U.esc(o.keyword) + '</b></td>' +
        '<td>' + (o.type === 'multiply' ? '<span class="badge">배수</span>' : '<span class="badge mint">추가금액</span>') + '</td>' +
        '<td class="num">' + (o.type === 'multiply' ? '×' + o.value : U.won(o.value)) + '</td>' +
        '<td>' + U.esc(o.memo || '') + '</td>' +
        '<td class="num"><button class="icon-btn" data-del-opt="' + o.id + '">🗑️</button></td></tr>';
    }).join('');
    return '' +
    '<div class="card">' +
      '<div class="row"><h2 style="margin:0">🏷️ 옵션 키워드</h2><div class="spacer"></div>' +
      '<button class="btn small" id="addOption">+ 옵션 추가</button></div>' +
      '<p class="hint">원가표에 없는 조합이 들어와도 자동으로 계산되게 해줍니다. ' +
      '예) 원가표에 <code>생화케이크</code>만 있어도 <code>생화케이크 2단</code>을 입력하면 원가를 1.8배로 계산합니다. ' +
      '<b>원가표에 이름이 정확히 있으면 옵션은 적용되지 않습니다.</b></p>' +
      (ops.length ? '<div class="table-wrap"><table><thead><tr><th>키워드</th><th>방식</th><th class="num">값</th><th>메모</th><th></th></tr></thead><tbody>' + rows + '</tbody></table></div>'
        : '<div class="empty">등록된 옵션이 없어요.</div>') +
    '</div>';
  }

  function optionModal() {
    var html = '' +
      '<div class="field"><label>키워드</label><input id="oKey" placeholder="예: 2단"></div>' +
      '<div class="field"><label>방식</label><select id="oType">' +
        '<option value="multiply">배수 (원가 × 값)</option><option value="add">추가금액 (원가 + 값)</option></select></div>' +
      '<div class="field"><label>값</label><input id="oVal" type="number" step="any" placeholder="1.8 또는 8000"></div>' +
      '<div class="field"><label>메모</label><input id="oMemo" placeholder="2단 케이크는 재료·수고가 약 1.8배"></div>' +
      '<div class="row end"><button class="btn ghost" id="oCancel">취소</button><button class="btn" id="oSave">저장</button></div>';
    U.modal('옵션 추가', html, function (body) {
      U.$('#oCancel', body).onclick = U.closeModal;
      U.$('#oSave', body).onclick = function () {
        var k = U.$('#oKey', body).value.trim();
        if (!k) { U.toast('키워드를 적어주세요'); return; }
        DB.upsert('options', {
          keyword: k, type: U.$('#oType', body).value,
          value: U.toNum(U.$('#oVal', body).value), memo: U.$('#oMemo', body).value.trim()
        });
        U.closeModal(); U.toast('저장했어요'); App.render();
      };
    });
  }

  /* ---------- (선택) 재료로 계산하기 ---------- */
  function advancedCard() {
    return '' +
    '<details class="card adv">' +
      '<summary>🧈 재료로 계산하기 <span class="cap-sub">(선택 · 평소엔 안 쓰셔도 됩니다)</span></summary>' +
      '<p class="hint" style="margin-top:12px">재료 단가와 레시피를 등록해 두면, 원가표에 없는 메뉴는 재료비로 계산해 줍니다. ' +
      '원가를 처음 잡아볼 때나 재료값이 올랐을 때 확인용으로 쓰세요.</p>' +
      recipeSection() +
      ingredientSection() +
    '</details>';
  }

  function recipeSection() {
    var recipes = DB.list('recipes');
    var rows = recipes.map(function (r) {
      var c = recipeCost(r);
      return '<tr><td><b>' + U.esc(r.name) + '</b>' + (r.memo ? '<br><span class="cap-sub">' + U.esc(r.memo) + '</span>' : '') + '</td>' +
        '<td class="num">' + (r.items || []).length + '개</td>' +
        '<td class="num">' + U.won(c.material) + '</td>' +
        '<td class="num">' + U.won(c.packaging) + '</td>' +
        '<td class="num">' + U.won(c.labor) + '</td>' +
        '<td class="num"><b>' + U.won(c.base) + '</b></td>' +
        '<td class="num"><button class="icon-btn" data-edit-recipe="' + r.id + '">✏️</button>' +
        '<button class="icon-btn" data-del-recipe="' + r.id + '">🗑️</button></td></tr>';
    }).join('');

    return '<div class="divider"></div>' +
      '<div class="row"><h3 style="margin:0">🍰 레시피</h3><div class="spacer"></div>' +
      '<button class="btn ghost small" id="addRecipe">+ 레시피 추가</button></div>' +
      (recipes.length ? '<div class="table-wrap"><table><thead><tr><th>이름</th><th class="num">재료수</th>' +
        '<th class="num">재료비</th><th class="num">포장비</th><th class="num">인건비</th><th class="num">합계</th><th></th></tr></thead>' +
        '<tbody>' + rows + '</tbody></table></div>'
        : '<div class="empty">등록된 레시피가 없어요.</div>');
  }

  function ingredientSection() {
    var ings = DB.list('ingredients');
    var rows = ings.map(function (g) {
      return '<tr data-ing="' + g.id + '">' +
        '<td><input class="f-name" value="' + U.esc(g.name) + '" style="min-width:110px"></td>' +
        '<td class="num"><input class="f-price" type="number" min="0" step="any" style="width:95px" value="' + U.esc(g.packPrice) + '"></td>' +
        '<td class="num"><input class="f-qty" type="number" min="0" step="any" style="width:85px" value="' + U.esc(g.packQty) + '"></td>' +
        '<td><input class="f-unit" style="width:60px" value="' + U.esc(g.unit) + '"></td>' +
        '<td class="num"><b>' + U.won(unitCost(g)) + '</b> /' + U.esc(g.unit) + '</td>' +
        '<td>' + (g.url ? '<a href="' + U.esc(g.url) + '" target="_blank" rel="noopener">구매처</a>' : '<span class="cap-sub">-</span>') + '</td>' +
        '<td class="num"><button class="icon-btn" data-del-ing="' + g.id + '">🗑️</button></td></tr>';
    }).join('');

    return '<div class="divider"></div>' +
      '<div class="row"><h3 style="margin:0">🧈 재료 단가</h3><div class="spacer"></div>' +
      '<button class="btn ghost small" id="ingCsv">CSV 저장</button>' +
      '<button class="btn ghost small" id="addIngredient">+ 재료 추가</button></div>' +
      '<p class="hint">구매한 가격과 용량을 적으면 1g(또는 1개)당 단가를 자동으로 계산합니다.</p>' +
      (ings.length ? '<div class="table-wrap"><table><thead><tr><th>재료명</th><th class="num">구매가</th>' +
        '<th class="num">용량</th><th>단위</th><th class="num">단가</th><th>링크</th><th></th></tr></thead>' +
        '<tbody>' + rows + '</tbody></table></div>'
        : '<div class="empty">등록된 재료가 없어요.</div>');
  }

  function recipeModal(id) {
    var r = id ? DB.find('recipes', id) : { name: '', items: [], packItems: [], labor: '', memo: '' };
    var ings = DB.list('ingredients');
    var inv = DB.list('inventory');

    function ingRow(it) {
      it = it || { ingId: '', qty: '' };
      return '<div class="row ing-row" style="gap:6px;margin-bottom:6px">' +
        '<select class="ing-sel" style="flex:2">' + '<option value="">재료 선택</option>' +
          ings.map(function (g) { return '<option value="' + g.id + '"' + (g.id === it.ingId ? ' selected' : '') + '>' + U.esc(g.name) + ' (' + U.won(unitCost(g)) + '/' + U.esc(g.unit) + ')</option>'; }).join('') +
        '</select>' +
        '<input class="ing-qty" style="flex:1" type="number" min="0" step="any" placeholder="사용량" value="' + U.esc(it.qty) + '">' +
        '<button class="icon-btn rm-row">🗑️</button></div>';
    }
    function packRow(it) {
      it = it || { invId: '', qty: 1 };
      return '<div class="row pack-row" style="gap:6px;margin-bottom:6px">' +
        '<select class="pack-sel" style="flex:2"><option value="">포장자재 선택</option>' +
          inv.map(function (g) { return '<option value="' + g.id + '"' + (g.id === it.invId ? ' selected' : '') + '>' + U.esc(g.name) + ' (' + U.won(g.unitPrice) + ')</option>'; }).join('') +
        '</select>' +
        '<input class="pack-qty" style="flex:1" type="number" min="0" step="any" placeholder="개수" value="' + U.esc(it.qty) + '">' +
        '<button class="icon-btn rm-row">🗑️</button></div>';
    }

    var html = '' +
      '<div class="field"><label>케이크 이름 <span style="color:var(--rose)">*</span></label>' +
      '<input id="rName" value="' + U.esc(r.name) + '" placeholder="예: 생화케이크"></div>' +
      '<div class="field"><label>들어가는 재료</label><div id="ingRows">' +
        ((r.items || []).length ? r.items.map(ingRow).join('') : ingRow()) +
      '</div><button class="btn ghost small" id="addIng">+ 재료 줄 추가</button></div>' +
      '<div class="field"><label>포장 자재 (상자 · 리본 · 보냉백)</label><div id="packRows">' +
        ((r.packItems || []).length ? r.packItems.map(packRow).join('') : packRow()) +
      '</div><button class="btn ghost small" id="addPack">+ 포장 줄 추가</button></div>' +
      '<div class="field"><label>인건비 (비워두면 설정값 ' + U.won(DB.settings().laborPerCake) + ' 사용)</label>' +
      '<input id="rLabor" type="number" min="0" step="any" value="' + U.esc(r.labor) + '" placeholder="8000"></div>' +
      '<div class="field"><label>메모</label><input id="rMemo" value="' + U.esc(r.memo || '') + '"></div>' +
      '<div class="row end"><button class="btn ghost" id="rCancel">취소</button><button class="btn" id="rSave">저장</button></div>';

    U.modal(id ? '레시피 수정' : '레시피 추가', html, function (body) {
      body.addEventListener('click', function (e) {
        if (e.target.classList.contains('rm-row')) e.target.closest('.row').remove();
      });
      U.$('#addIng', body).onclick = function () { U.$('#ingRows', body).insertAdjacentHTML('beforeend', ingRow()); };
      U.$('#addPack', body).onclick = function () { U.$('#packRows', body).insertAdjacentHTML('beforeend', packRow()); };
      U.$('#rCancel', body).onclick = U.closeModal;
      U.$('#rSave', body).onclick = function () {
        var name = U.$('#rName', body).value.trim();
        if (!name) { U.toast('케이크 이름을 적어주세요'); return; }
        var items = U.$$('.ing-row', body).map(function (row) {
          return { ingId: U.$('.ing-sel', row).value, qty: U.toNum(U.$('.ing-qty', row).value) };
        }).filter(function (x) { return x.ingId && x.qty > 0; });
        var packItems = U.$$('.pack-row', body).map(function (row) {
          return { invId: U.$('.pack-sel', row).value, qty: U.toNum(U.$('.pack-qty', row).value) };
        }).filter(function (x) { return x.invId && x.qty > 0; });
        DB.upsert('recipes', {
          id: r.id, name: name, items: items, packItems: packItems,
          labor: U.$('#rLabor', body).value, memo: U.$('#rMemo', body).value.trim()
        });
        U.closeModal(); U.toast('저장했어요'); App.render();
      };
    });
  }

  function ingredientModal(id) {
    var g = id ? DB.find('ingredients', id) : { name: '', packPrice: '', packQty: '', unit: 'g', url: '' };
    var html = '' +
      '<div class="field"><label>재료명 <span style="color:var(--rose)">*</span></label><input id="gName" value="' + U.esc(g.name) + '" placeholder="예: 무염버터"></div>' +
      '<div class="grid two">' +
        '<div class="field"><label>구매 가격(원)</label><input id="gPrice" type="number" min="0" step="any" value="' + U.esc(g.packPrice) + '" placeholder="12900"></div>' +
        '<div class="field"><label>구매 용량</label><input id="gQty" type="number" min="0" step="any" value="' + U.esc(g.packQty) + '" placeholder="1000"></div>' +
      '</div>' +
      '<div class="field"><label>단위 (g, ml, 개, 송이 …)</label><input id="gUnit" value="' + U.esc(g.unit) + '"></div>' +
      '<div class="field"><label>구매처 링크 (선택)</label><input id="gUrl" value="' + U.esc(g.url || '') + '" placeholder="https://"></div>' +
      '<div class="row end"><button class="btn ghost" id="gCancel">취소</button><button class="btn" id="gSave">저장</button></div>';
    U.modal(id ? '재료 수정' : '재료 추가', html, function (body) {
      U.$('#gCancel', body).onclick = U.closeModal;
      U.$('#gSave', body).onclick = function () {
        var name = U.$('#gName', body).value.trim();
        if (!name) { U.toast('재료명을 적어주세요'); return; }
        DB.upsert('ingredients', {
          id: g.id, name: name,
          packPrice: U.toNum(U.$('#gPrice', body).value),
          packQty: U.toNum(U.$('#gQty', body).value),
          unit: U.$('#gUnit', body).value.trim() || 'g',
          url: U.$('#gUrl', body).value.trim(),
          priceCheckedAt: U.today()
        });
        U.closeModal(); U.toast('저장했어요'); App.render();
      };
    });
  }

  /* ---------- 이벤트 연결 ---------- */
  function bind(view) {
    U.$('#calcRun', view).onclick = runCalc;
    U.$('#calcInput', view).addEventListener('keydown', function (e) {
      if (e.key === 'Enter') runCalc();
    });
    U.$('#addMenu', view).onclick = function () { menuModal(null); };
    U.$('#addOption', view).onclick = optionModal;
    U.$('#addRecipe', view).onclick = function () { recipeModal(null); };
    U.$('#addIngredient', view).onclick = function () { ingredientModal(null); };

    U.$('#menuCsv', view).onclick = function () {
      var rows = [['메뉴 이름', '원가', '판매가', '이익', '이익률(%)', '메모']];
      DB.list('menus').forEach(function (m) {
        var c = U.toNum(m.cost), p = U.toNum(m.price);
        rows.push([m.name, c, p, p - c, p ? Math.round((p - c) / p * 100) : '', m.memo || '']);
      });
      U.downloadCsv('메뉴별_원가표.csv', rows);
      U.toast('CSV 파일을 저장했어요');
    };
    U.$('#ingCsv', view).onclick = function () {
      var rows = [['재료명', '구매가', '용량', '단위', '단가', '구매처']];
      DB.list('ingredients').forEach(function (g) {
        rows.push([g.name, g.packPrice, g.packQty, g.unit, Math.round(unitCost(g)), g.url || '']);
      });
      U.downloadCsv('재료단가.csv', rows);
    };

    view.addEventListener('click', function (e) {
      var t = e.target;
      if (t.dataset.delMenu && U.confirmBox('이 메뉴를 원가표에서 지울까요?')) {
        DB.remove('menus', t.dataset.delMenu); App.render();
      }
      if (t.dataset.editRecipe) recipeModal(t.dataset.editRecipe);
      if (t.dataset.delRecipe && U.confirmBox('이 레시피를 삭제할까요?')) {
        DB.remove('recipes', t.dataset.delRecipe); App.render();
      }
      if (t.dataset.delIng && U.confirmBox('이 재료를 삭제할까요?')) {
        DB.remove('ingredients', t.dataset.delIng); App.render();
      }
      if (t.dataset.delOpt && U.confirmBox('이 옵션을 삭제할까요?')) {
        DB.remove('options', t.dataset.delOpt); App.render();
      }
    });

    // 표에서 바로 수정
    view.addEventListener('change', function (e) {
      var menuTr = e.target.closest('tr[data-menu]');
      if (menuTr) { saveMenuRow(menuTr); return; }

      var ingTr = e.target.closest('tr[data-ing]');
      if (ingTr) {
        DB.upsert('ingredients', {
          id: ingTr.dataset.ing,
          name: U.$('.f-name', ingTr).value.trim(),
          packPrice: U.toNum(U.$('.f-price', ingTr).value),
          packQty: U.toNum(U.$('.f-qty', ingTr).value),
          unit: U.$('.f-unit', ingTr).value.trim() || 'g'
        });
        U.toast('저장했어요'); App.render();
      }
    });
  }

  return {
    render: render, calcFromText: calcFromText, recipeCost: recipeCost,
    unitCost: unitCost, suggestPrice: suggestPrice
  };
})();

/* ===== js/orders.js ===== */
/* 주문 등록 + 픽업 달력 */
window.Orders = (function () {

  var calMonth = U.thisMonth();   // 달력에 보이는 달
  var editingId = null;           // 수정 중인 주문

  /* ---------- 주문 목록 도우미 ---------- */
  function all() {
    return DB.list('orders').slice().sort(function (a, b) {
      return (a.pickupDate + (a.pickupTime || '')).localeCompare(b.pickupDate + (b.pickupTime || ''));
    });
  }
  function byDate(date) { return all().filter(function (o) { return o.pickupDate === date; }); }
  function byMonth(m) { return all().filter(function (o) { return (o.pickupDate || '').slice(0, 7) === m; }); }

  /* ================= 화면 ================= */
  function render(view) {
    view.innerHTML = formCard() + calendarCard() + upcomingCard();
    bind(view);
  }

  function formCard() {
    var set = DB.settings();
    return '' +
    '<div class="card">' +
      '<div class="row"><h2 style="margin:0">📝 주문서 작성</h2><div class="spacer"></div>' +
        '<button class="btn ghost small" id="pasteImport">💬 채팅 내용으로 주문 만들기</button>' +
      '</div>' +
      '<p class="hint">별표(<span style="color:var(--rose)">*</span>) 항목만 필수입니다. 저장하면 아래 달력의 픽업 날짜에 자동으로 표시돼요.</p>' +
      '<form id="orderForm" novalidate>' +
        '<input type="hidden" name="oid">' +
        '<div class="grid two">' +
          '<div class="field"><label>고객이름 <span style="color:var(--rose)">*</span></label>' +
            '<input name="customerName" required placeholder="김민지" autocomplete="off"></div>' +
          '<div class="field"><label>연락처</label>' +
            '<input name="phone" placeholder="010-1234-5678" inputmode="numeric" autocomplete="off"></div>' +
          '<div class="field"><label>픽업날짜 <span style="color:var(--rose)">*</span></label>' +
            '<input name="pickupDate" type="date" required value="' + U.today() + '"></div>' +
          '<div class="field"><label>픽업시간</label>' +
            '<input name="pickupTime" type="time" value="14:00"></div>' +
        '</div>' +
        '<div class="field"><label>주문요청사항</label>' +
          '<textarea name="request" placeholder="예: 생화케이크 2단 / 문구 &quot;생일 축하해&quot; / 핑크톤"></textarea></div>' +
        '<div class="grid three">' +
          '<div class="field"><label>가격 (판매가)</label>' +
            '<input name="price" type="number" min="0" step="any" placeholder="65000"></div>' +
          '<div class="field"><label>원가 <button type="button" class="btn ghost small" id="autoCost" style="padding:2px 8px;font-size:11px">자동계산</button></label>' +
            '<input name="cost" type="number" min="0" step="any" placeholder="24000"></div>' +
          '<div class="field"><label>예약금 (받은 돈)</label>' +
            '<input name="deposit" type="number" min="0" step="any" placeholder="20000"></div>' +
        '</div>' +
        '<div class="field"><label>참고사항</label>' +
          '<textarea name="note" placeholder="예: 알러지 - 견과류 제외 / 주차 문의"></textarea></div>' +
        '<div class="grid two">' +
          '<div class="field"><label>주문 경로</label><select name="source">' +
            '<option value="manual"' + (set.reservationSource === 'manual' ? ' selected' : '') + '>직접 입력</option>' +
            '<option value="paste"' + (set.reservationSource === 'paste' ? ' selected' : '') + '>채팅 붙여넣기</option>' +
            '<option value="phone">전화</option><option value="instagram">인스타그램</option>' +
          '</select></div>' +
          '<div class="field"><label>상태</label><select name="status">' +
            '<option value="reserved">예약</option><option value="done">픽업 완료</option><option value="canceled">취소</option>' +
          '</select></div>' +
        '</div>' +
        '<div class="row end">' +
          '<button type="button" class="btn ghost" id="formReset">새로 작성</button>' +
          '<button type="submit" class="btn" id="formSubmit">주문 저장</button>' +
        '</div>' +
      '</form>' +
    '</div>';
  }

  /* ---------- 달력 ---------- */
  function calendarCard() {
    return '<div class="card">' +
      '<div class="cal-head">' +
        '<button class="btn ghost small" id="calPrev">‹ 이전달</button>' +
        '<div class="cal-title" id="calTitle">' + U.monthTitle(calMonth) + '</div>' +
        '<button class="btn ghost small" id="calNext">다음달 ›</button>' +
      '</div>' +
      '<div id="calBody">' + calendarGrid() + '</div>' +
      '<p class="hint" style="margin-top:10px">날짜를 누르면 그날의 주문을 자세히 볼 수 있어요.</p>' +
    '</div>';
  }

  function calendarGrid() {
    var p = calMonth.split('-'), y = +p[0], m = +p[1];
    var first = new Date(y, m - 1, 1);
    var startDow = first.getDay();
    var days = U.lastDayOfMonth(calMonth);
    var today = U.today();
    var html = U.DOW.map(function (d, i) {
      return '<div class="dow' + (i === 0 ? ' sun' : '') + '">' + d + '</div>';
    }).join('');

    for (var i = 0; i < startDow; i++) html += '<div class="day empty"></div>';

    for (var d = 1; d <= days; d++) {
      var date = calMonth + '-' + U.pad(d);
      var list = byDate(date).filter(function (o) { return o.status !== 'canceled'; });
      var dow = new Date(y, m - 1, d).getDay();
      var cls = 'day' + (dow === 0 ? ' sun' : '') + (date === today ? ' today' : '');
      var evs = list.slice(0, 3).map(function (o) {
        return '<div class="ev' + (o.status === 'done' ? ' done' : '') + '">' +
          (o.pickupTime ? U.esc(o.pickupTime) + ' ' : '') + U.esc(o.customerName) + '</div>';
      }).join('');
      var more = list.length > 3 ? '<div class="more">+' + (list.length - 3) + '건 더</div>' : '';
      html += '<div class="' + cls + '" data-date="' + date + '"><div class="dnum">' + d + '</div>' + evs + more + '</div>';
    }
    return '<div class="cal">' + html + '</div>';
  }

  function dayModal(date) {
    var list = byDate(date);
    var body = list.length ? list.map(function (o) {
      return '<div class="q-item">' +
        '<div class="row"><b>' + U.esc(o.customerName) + '</b>' +
        '<span class="badge ' + statusCls(o.status) + '">' + statusText(o.status) + '</span>' +
        '<div class="spacer"></div>' +
        '<span class="cap-sub">' + U.esc(o.pickupTime || '') + '</span></div>' +
        (o.phone ? '<div class="cap-sub">📞 ' + U.esc(U.phone(o.phone)) + '</div>' : '') +
        (o.request ? '<div style="margin-top:6px;white-space:pre-wrap">' + U.esc(o.request) + '</div>' : '') +
        (o.note ? '<div class="cap-sub" style="margin-top:4px">📌 ' + U.esc(o.note) + '</div>' : '') +
        '<div class="row" style="margin-top:8px">' +
          '<span class="badge gray">판매 ' + U.won(o.price) + '</span>' +
          '<span class="badge gray">원가 ' + U.won(o.cost) + '</span>' +
          '<span class="badge mint">이익 ' + U.won(U.toNum(o.price) - U.toNum(o.cost)) + '</span>' +
        '</div>' +
        '<div class="row" style="margin-top:8px">' +
          '<button class="btn ghost small" data-edit-order="' + o.id + '">수정</button>' +
          (o.status !== 'done' ? '<button class="btn mint small" data-done-order="' + o.id + '">픽업 완료</button>' : '') +
          '<button class="btn danger small" data-del-order="' + o.id + '">삭제</button>' +
        '</div></div>';
    }).join('') : '<div class="empty">이 날짜에는 주문이 없어요.</div>';

    U.modal(U.korDateFull(date) + ' 주문 ' + list.length + '건', body, function (m) {
      m.addEventListener('click', function (e) {
        var t = e.target;
        if (t.dataset.editOrder) { U.closeModal(); loadToForm(t.dataset.editOrder); }
        if (t.dataset.doneOrder) { DB.upsert('orders', { id: t.dataset.doneOrder, status: 'done' }); U.closeModal(); U.toast('픽업 완료로 바꿨어요'); App.render(); }
        if (t.dataset.delOrder && U.confirmBox('이 주문을 삭제할까요?')) { DB.remove('orders', t.dataset.delOrder); U.closeModal(); U.toast('삭제했어요'); App.render(); }
      });
    });
  }

  function statusText(s) { return s === 'done' ? '픽업완료' : s === 'canceled' ? '취소' : '예약'; }
  function statusCls(s) { return s === 'done' ? 'mint' : s === 'canceled' ? 'red' : ''; }

  /* ---------- 다가오는 픽업 ---------- */
  function upcomingCard() {
    var today = U.today();
    var list = all().filter(function (o) {
      return o.status === 'reserved' && o.pickupDate >= today;
    }).slice(0, 8);
    if (!list.length) return '<div class="card"><h2>📅 다가오는 픽업</h2><div class="empty">예정된 픽업이 없어요.</div></div>';
    var rows = list.map(function (o) {
      var dday = U.diffDays(today, o.pickupDate);
      return '<tr><td>' + U.korDate(o.pickupDate) + ' ' + U.esc(o.pickupTime || '') +
        ' <span class="badge">' + (dday === 0 ? '오늘' : dday === 1 ? '내일' : 'D-' + dday) + '</span></td>' +
        '<td>' + U.esc(o.customerName) + '</td>' +
        '<td>' + U.esc((o.request || '').slice(0, 30)) + '</td>' +
        '<td class="num">' + U.won(o.price) + '</td>' +
        '<td class="num"><button class="icon-btn" data-edit-order="' + o.id + '">✏️</button></td></tr>';
    }).join('');
    return '<div class="card"><h2>📅 다가오는 픽업</h2><div class="table-wrap"><table>' +
      '<thead><tr><th>픽업</th><th>고객</th><th>주문내용</th><th class="num">가격</th><th></th></tr></thead>' +
      '<tbody>' + rows + '</tbody></table></div></div>';
  }

  /* ---------- 폼 처리 ---------- */
  function loadToForm(id) {
    var o = DB.find('orders', id); if (!o) return;
    editingId = id;
    var f = U.$('#orderForm');
    f.oid.value = o.id;
    f.customerName.value = o.customerName || '';
    f.phone.value = o.phone || '';
    f.pickupDate.value = o.pickupDate || '';
    f.pickupTime.value = o.pickupTime || '';
    f.request.value = o.request || '';
    f.price.value = o.price || '';
    f.cost.value = o.cost || '';
    f.deposit.value = o.deposit || '';
    f.note.value = o.note || '';
    f.source.value = o.source || 'manual';
    f.status.value = o.status || 'reserved';
    U.$('#formSubmit').textContent = '수정 저장';
    window.scrollTo({ top: 0, behavior: 'smooth' });
    U.toast('주문을 불러왔어요');
  }

  function resetForm() {
    editingId = null;
    var f = U.$('#orderForm');
    f.reset();
    f.oid.value = '';
    f.pickupDate.value = U.today();
    f.pickupTime.value = '14:00';
    U.$('#formSubmit').textContent = '주문 저장';
  }

  function saveForm(e) {
    e.preventDefault();
    var f = e.target;
    var name = f.customerName.value.trim();
    if (!name) { U.toast('고객이름을 적어주세요'); return; }
    if (!f.pickupDate.value) { U.toast('픽업날짜를 골라주세요'); return; }

    var isNew = !f.oid.value;
    var saved = DB.upsert('orders', {
      id: f.oid.value || undefined,
      customerName: name,
      phone: U.phone(f.phone.value.trim()),
      pickupDate: f.pickupDate.value,
      pickupTime: f.pickupTime.value,
      request: f.request.value.trim(),
      price: U.toNum(f.price.value),
      cost: U.toNum(f.cost.value),
      deposit: U.toNum(f.deposit.value),
      note: f.note.value.trim(),
      source: f.source.value,
      status: f.status.value,
      orderDate: f.oid.value ? undefined : U.today()
    });
    calMonth = saved.pickupDate.slice(0, 7);
    resetForm();
    U.toast(isNew ? '주문을 저장했어요 🎂' : '수정했어요');
    App.render();
  }

  /* ---------- 채팅 내용으로 주문 만들기 ---------- */

  // 서식 예시 (사장님이 고객에게 보내거나, 메모할 때 쓰는 양식)
  var FORM_SAMPLE =
    '고객이름: \n연락처: \n픽업날짜: \n픽업시간: \n주문요청사항: \n가격: \n참고사항: ';

  function pasteModal() {
    var html = '' +
      '<p class="hint">카톡·문자·메모에 적힌 예약 내용을 <b>그대로 복사해서 아래에 붙여넣으면</b> 주문 목록으로 만들어 드립니다. ' +
      '등록하기 전에 내용을 고칠 수 있어요.</p>' +
      '<div class="info">✅ <b>서식대로 적은 글</b>(고객이름: / 연락처: / 픽업날짜: …)은 정확하게 읽습니다.<br>' +
      '✅ <b>카톡 대화를 그대로</b> 붙여넣어도 이름·전화번호·날짜·금액을 최대한 찾아냅니다.</div>' +
      '<div class="row" style="margin:10px 0">' +
        '<button class="btn ghost small" id="pvCopyForm">📋 서식 복사</button>' +
        '<button class="btn ghost small" id="pvSample">예시 넣어보기</button>' +
      '</div>' +
      '<div class="field"><label>붙여넣기</label>' +
      '<textarea id="pvText" style="min-height:150px" placeholder="고객이름: 김민지&#10;연락처: 010-1234-5678&#10;픽업날짜: 2026-08-11&#10;주문요청사항: 생화케이크 2단&#10;가격: 145000"></textarea></div>' +
      '<div class="row"><button class="btn" id="pvParse">내용 읽기</button>' +
      '<span class="cap-sub">여러 건이면 이어서 붙여넣으세요</span></div>' +
      '<div id="pvPreview"></div>';

    U.modal('💬 채팅 내용으로 주문 만들기', html, function (body) {
      U.$('#pvCopyForm', body).onclick = function () { U.copyText(FORM_SAMPLE); };
      U.$('#pvSample', body).onclick = function () {
        U.$('#pvText', body).value =
          '고객이름: 김민지\n연락처: 010-1234-5678\n픽업날짜: ' + U.addDays(U.today(), 7) +
          '\n픽업시간: 14:00\n주문요청사항: 생화케이크 2단\n가격: 145000\n참고사항: 핑크톤\n\n' +
          '고객이름: 박서준\n연락처: 010-2222-3333\n픽업날짜: ' + U.addDays(U.today(), 9) +
          '\n주문요청사항: 딸기케이크 1호\n가격: 48000';
      };
      U.$('#pvParse', body).onclick = function () { showPreview(body); };
    });
  }

  function showPreview(body) {
    var rows = parseReservations(U.$('#pvText', body).value);
    var box = U.$('#pvPreview', body);
    if (!rows.length) {
      box.innerHTML = '<div class="warn" style="margin-top:12px">읽을 수 있는 예약을 찾지 못했어요.<br>' +
        '최소한 <b>이름과 픽업날짜</b>는 들어 있어야 합니다. [📋 서식 복사]를 눌러 그 모양대로 적어보세요.</div>';
      return;
    }

    var existing = DB.list('orders');
    box.innerHTML = '<div class="divider"></div>' +
      '<p class="hint">' + rows.length + '건을 찾았어요. 확인하고 고친 뒤 등록하세요.</p>' +
      rows.map(function (r, i) {
        var dup = existing.some(function (o) {
          return o.customerName === r.customerName && o.pickupDate === r.pickupDate;
        });
        var c = Cost.calcFromText(r.request);
        var cost = c.ok ? Math.round(c.total / 10) * 10 : 0;
        if (!r.price && c.ok) r.price = c.suggested;
        return '<div class="q-item pv-row" data-i="' + i + '">' +
          '<div class="row" style="margin-bottom:8px">' +
            '<label style="margin:0"><input type="checkbox" class="pv-chk" style="width:auto"' +
              (dup ? '' : ' checked') + '> 등록</label>' +
            '<div class="spacer"></div>' +
            (dup ? '<span class="badge red">이미 등록된 예약</span>'
                 : (c.ok ? '<span class="badge mint">원가 자동입력됨</span>' : '')) +
          '</div>' +
          '<div class="grid two pv-grid">' +
            '<div class="field"><label>고객이름</label><input class="pv-name" value="' + U.esc(r.customerName) + '"></div>' +
            '<div class="field"><label>연락처</label><input class="pv-phone" value="' + U.esc(r.phone) + '"></div>' +
            '<div class="field"><label>픽업날짜</label><input class="pv-date" type="date" value="' + U.esc(r.pickupDate) + '"></div>' +
            '<div class="field"><label>픽업시간</label><input class="pv-time" type="time" value="' + U.esc(r.pickupTime) + '"></div>' +
          '</div>' +
          '<div class="field"><label>주문요청사항</label><input class="pv-req" value="' + U.esc(r.request) + '"></div>' +
          '<div class="grid two pv-grid">' +
            '<div class="field"><label>가격</label><input class="pv-price" type="number" step="any" value="' + U.esc(r.price || '') + '"></div>' +
            '<div class="field"><label>원가</label><input class="pv-cost" type="number" step="any" value="' + U.esc(cost || '') + '"></div>' +
          '</div>' +
          '<div class="field" style="margin:0"><label>참고사항</label><input class="pv-note" value="' + U.esc(r.note || '') + '"></div>' +
        '</div>';
      }).join('') +
      '<div class="row end" style="margin-top:12px"><button class="btn" id="pvSave">선택한 주문 등록</button></div>';

    U.$('#pvSave', body).onclick = function () {
      var n = 0;
      U.$$('.pv-row', body).forEach(function (row) {
        if (!U.$('.pv-chk', row).checked) return;
        var name = U.$('.pv-name', row).value.trim();
        var date = U.$('.pv-date', row).value;
        if (!name || !date) return;
        DB.upsert('orders', {
          customerName: name,
          phone: U.phone(U.$('.pv-phone', row).value.trim()),
          pickupDate: date,
          pickupTime: U.$('.pv-time', row).value || '14:00',
          request: U.$('.pv-req', row).value.trim(),
          price: U.toNum(U.$('.pv-price', row).value),
          cost: U.toNum(U.$('.pv-cost', row).value),
          note: U.$('.pv-note', row).value.trim(),
          deposit: 0, source: 'paste', status: 'reserved', orderDate: U.today()
        });
        n++;
      });
      U.closeModal();
      U.toast(n ? n + '건 등록했어요 🎂' : '등록된 주문이 없어요');
      App.render();
    };
  }

  /* ---------- 붙여넣은 글 읽기 ---------- */

  // 서식에서 쓰는 이름표들 (사장님이 조금 다르게 적어도 알아듣도록)
  var LABELS = [
    { key: 'customerName', words: ['고객이름', '고객명', '예약자', '성함', '이름'] },
    { key: 'phone',        words: ['연락처', '전화번호', '핸드폰', '휴대폰', '전화', '번호'] },
    { key: 'pickupDate',   words: ['픽업날짜', '픽업일자', '픽업일', '수령일', '픽업', '날짜'] },
    { key: 'pickupTime',   words: ['픽업시간', '수령시간', '시간'] },
    { key: 'request',      words: ['주문요청사항', '주문내용', '요청사항', '주문', '요청', '메뉴', '내용'] },
    { key: 'price',        words: ['판매가', '결제금액', '가격', '금액'] },
    { key: 'note',         words: ['참고사항', '특이사항', '참고', '비고', '메모'] }
  ];
  // 긴 단어부터 찾아야 "픽업날짜"가 "픽업"으로 잘리지 않음
  var LABEL_WORDS = LABELS.reduce(function (a, l) { return a.concat(l.words); }, [])
    .sort(function (a, b) { return b.length - a.length; });
  var LABEL_RE = new RegExp('(' + LABEL_WORDS.join('|') + ')\\s*[:：]', 'g');
  // 콜론 없이 "이름 김민지 / 전화 010-…" 처럼 적은 경우용
  var LABEL_RE_LOOSE = new RegExp('(?:^|[\\s/|,\\-])(' + LABEL_WORDS.join('|') + ')\\s*[:：]?[ \\t]+', 'g');
  function labelKey(word) {
    var f = LABELS.find(function (l) { return l.words.indexOf(word) >= 0; });
    return f ? f.key : null;
  }

  function parseReservations(text) {
    var raw = String(text || '');
    if (!raw.trim()) return [];
    // 1) "고객이름: 김민지" 처럼 콜론이 있는 서식
    var labeled = parseLabeled(raw, LABEL_RE);
    if (labeled.length) return labeled;
    // 2) "이름 김민지 / 전화 010-..." 처럼 콜론 없이 적은 서식
    //    (이름표가 3종류 이상 나올 때만 서식으로 인정 - 일반 대화를 오해하지 않도록)
    var loose = parseLabeled(raw, LABEL_RE_LOOSE, 3);
    if (loose.length) return loose;
    var byLine = parseFree(raw, true);
    if (byLine.length) return byLine;
    return parseFree(raw, false);   // 줄마다 못 찾으면 전체를 한 건으로
  }

  /* 방식 A - "고객이름: 김민지" 처럼 이름표가 있는 글 */
  function parseLabeled(text, re, minKinds) {
    re.lastIndex = 0;
    var marks = [], kinds = {}, m;
    while ((m = re.exec(text)) !== null) {
      var key = labelKey(m[1]);
      if (!key) continue;
      kinds[key] = true;
      marks.push({ key: key, start: m.index, valueFrom: m.index + m[0].length });
    }
    if (!marks.length) return [];
    if (minKinds && Object.keys(kinds).length < minKinds) return [];

    var out = [], cur = null;
    marks.forEach(function (mk, i) {
      var end = i + 1 < marks.length ? marks[i + 1].start : text.length;
      var value = text.slice(mk.valueFrom, end)
        .replace(/^[\s\-|/,]+/, '').replace(/[\s\-|/,]+$/, '').trim();
      // 이미 채운 항목이 또 나오면 다음 사람 주문으로 봄
      if (!cur || cur[mk.key] !== undefined) {
        if (cur) out.push(cur);
        cur = {};
      }
      cur[mk.key] = value;
    });
    if (cur) out.push(cur);

    return out.map(normalize).filter(function (r) {
      return r.customerName && r.customerName !== '이름없음';
    });
  }

  /* 방식 B - 카톡 대화처럼 자유롭게 적힌 글 */
  function parseFree(text, perLine) {
    var chunks = perLine ? String(text).split(/\r?\n/) : [String(text)];
    var out = [];
    var speaker = '';

    chunks.forEach(function (chunk) {
      var s = String(chunk).replace(/\t/g, ' ');
      if (!s.trim()) return;

      // 카톡 내보내기 형식의 말머리 제거
      var k1 = s.match(/^\[([^\]]{1,20})\]\s*\[[^\]]{1,20}\]\s*/);
      if (k1) { speaker = k1[1]; s = s.slice(k1[0].length); }
      var k2 = s.match(/^\d{4}년\s*\d{1,2}월\s*\d{1,2}일\s*(오전|오후)\s*\d{1,2}:\d{2},\s*([^:]{1,20}):\s*/);
      if (k2) { speaker = k2[2].trim(); s = s.slice(k2[0].length); }

      var pm = s.match(/01[016789][-.\s]?\d{3,4}[-.\s]?\d{4}/);
      var date = findDate(s);
      if (!pm && !date) return;

      var mm = s.match(/([0-9]{1,3}(?:,[0-9]{3})+|[0-9]{4,7})\s*원/);
      var price = mm ? U.toNum(mm[1]) : 0;

      var rest = s;
      [pm && pm[0], mm && mm[0]].forEach(function (x) { if (x) rest = rest.replace(x, ' '); });
      var time = findTime(rest);
      rest = stripDateTime(rest);

      // 카톡 말머리가 있으면 그 사람이 곧 고객
      var name = speaker || pickName(rest);
      var request = cleanRequest(rest, name);

      out.push(normalize({
        customerName: name, phone: pm ? pm[0] : '', pickupDate: date,
        pickupTime: time, request: request, price: price
      }));
    });

    return out.filter(function (r) { return r.customerName && r.customerName !== '이름없음'; });
  }

  /* ---------- 값 다듬기 ---------- */

  // 이름이 아닌 흔한 말들 (카톡 대화에서 이름으로 잘못 잡히는 것 방지)
  var NOT_NAME = /^(안녕하세요|안녕하십니까|감사합니다|감사해요|고맙습니다|부탁드립니다|부탁드려요|부탁해요|죄송합니다|알겠습니다|알겠어요|가능할까요|가능한가요|가능해요|맞나요|맞을까요|문의드립니다|문의드려요|예약이요|주문이요|네네|넵넵|여보세요|사장님)$/;
  function looksLikeName(w) {
    if (!w) return false;
    if (NOT_NAME.test(w)) return false;
    if (/케이크|주문|예약|픽업|가격|금액|문의|배송|포장/.test(w)) return false;
    return true;
  }
  // 남은 글에서 사람 이름처럼 보이는 첫 단어 고르기
  function pickName(text) {
    // "박지훈입니다", "김민지예요", "이서연님" 처럼 뒤에 말이 붙은 경우를 먼저 봄
    var tagged = text.match(/([가-힣]{2,4})(?:입니다|입니당|이라고|이에요|예요|이구요|이고요|님|씨)/);
    if (tagged && looksLikeName(tagged[1])) return tagged[1];
    var re = /[가-힣]{2,4}/g, m;
    while ((m = re.exec(text)) !== null) {
      if (looksLikeName(m[0])) return m[0];
    }
    return '';
  }

  // 주문내용에서 인사말·이름·군더더기를 걷어냄 (미리보기에서 고칠 수 있으니 완벽할 필요는 없음)
  function cleanRequest(text, name) {
    var s = text;
    if (name) s = s.replace(new RegExp(name + '(입니다|입니당|이라고|이에요|예요|이구요|이고요|님|씨)?', 'g'), ' ');
    return s
      .replace(/(안녕하세요|안녕하십니까|감사합니다|감사해요|고맙습니다|부탁드립니다|부탁드려요|부탁해요|예약할게요|예약이요|주문할게요|주문이요|맞나요|맞을까요|가능할까요|가능한가요|찾으러 ?갈게요|가지러 ?갈게요)/g, ' ')
      .replace(/(예약자|연락처|고객명|고객이름|픽업날짜|픽업시간|참고사항|주문요청사항)/g, ' ')
      .replace(/[?!]+/g, ' ')
      // 전화번호·날짜를 걷어내고 남은 조사 부스러기 정리
      .replace(/(^|\s)(이고요|이구요|입니다|입니당|이에요|예요|에|은|는|이|가|요)(?=\s|$)/g, ' ')
      .replace(/\s{2,}/g, ' ').replace(/^[\s/,|\-]+|[\s/,|\-]+$/g, '').trim();
  }

  function findDate(s) {
    var m = s.match(/(20\d{2})\s*[-.\/년]\s*(\d{1,2})\s*[-.\/월]\s*(\d{1,2})/);
    if (m) return m[1] + '-' + U.pad(+m[2]) + '-' + U.pad(+m[3]);
    m = s.match(/(\d{1,2})\s*월\s*(\d{1,2})\s*일/);
    if (m) return yearFor(+m[1], +m[2]);
    m = s.match(/(?:^|[^\d])(\d{1,2})\s*[\/.]\s*(\d{1,2})(?![\d:])/);
    if (m) return yearFor(+m[1], +m[2]);
    return '';
  }
  // 월/일만 적혀 있으면 올해로 보되, 이미 지난 날짜면 내년으로
  function yearFor(mon, day) {
    var now = new Date();
    var y = now.getFullYear();
    var d = y + '-' + U.pad(mon) + '-' + U.pad(day);
    if (d < U.today()) d = (y + 1) + '-' + U.pad(mon) + '-' + U.pad(day);
    return d;
  }
  function findTime(s) {
    var ampm = s.match(/(오전|오후)\s*(\d{1,2})\s*(?:시|:)\s*(\d{1,2})?/);
    if (ampm) {
      var h = +ampm[2];
      if (ampm[1] === '오후' && h < 12) h += 12;
      if (ampm[1] === '오전' && h === 12) h = 0;
      return U.pad(h) + ':' + U.pad(ampm[3] ? +ampm[3] : 0);
    }
    var m = s.match(/(?:^|[^\d])(\d{1,2})\s*:\s*(\d{2})/);
    if (m) return U.pad(+m[1]) + ':' + U.pad(+m[2]);
    m = s.match(/(\d{1,2})\s*시\s*(\d{1,2})?\s*분?/);
    if (m) {
      var h = +m[1];
      // "2시" 처럼 오전/오후를 안 적었으면 케이크 픽업 시간대(오후)로 봄
      if (h >= 1 && h <= 8) h += 12;
      return U.pad(h) + ':' + U.pad(m[2] ? +m[2] : 0);
    }
    return '';
  }
  function stripDateTime(s) {
    return s
      .replace(/20\d{2}\s*[-.\/년]\s*\d{1,2}\s*[-.\/월]\s*\d{1,2}\s*일?/g, ' ')
      .replace(/\d{1,2}\s*월\s*\d{1,2}\s*일/g, ' ')
      .replace(/(오전|오후)?\s*\d{1,2}\s*[:시]\s*\d{0,2}\s*분?/g, ' ')
      .replace(/\d{1,2}\s*[\/.]\s*\d{1,2}/g, ' ');
  }

  // 읽어낸 값을 주문 형식으로 정리
  function normalize(r) {
    var date = r.pickupDate ? (findDate(r.pickupDate) || r.pickupDate) : '';
    if (!/^\d{4}-\d{2}-\d{2}$/.test(date)) date = '';
    // 시간을 따로 안 적고 "픽업날짜: 12월 24일 오후 5시" 처럼 함께 적은 경우도 읽어냄
    var time = (r.pickupTime && findTime(r.pickupTime)) ||
               (r.pickupDate && findTime(String(r.pickupDate).replace(/20\d{2}\s*[-.\/년]\s*\d{1,2}\s*[-.\/월]\s*\d{1,2}\s*일?/g, ' '))) || '';
    var name = String(r.customerName || '').replace(/(님|씨)$/, '').trim();
    return {
      customerName: name,
      phone: U.phone(String(r.phone || '').trim()),
      pickupDate: date || U.today(),
      pickupTime: time || '14:00',
      request: String(r.request || '').trim(),
      price: U.toNum(r.price),
      note: String(r.note || '').trim()
    };
  }

  /* ---------- 이벤트 연결 ---------- */
  function bind(view) {
    U.$('#orderForm', view).addEventListener('submit', saveForm);
    U.$('#formReset', view).onclick = resetForm;
    U.$('#pasteImport', view).onclick = pasteModal;

    U.$('#autoCost', view).onclick = function () {
      var f = U.$('#orderForm', view);
      var r = Cost.calcFromText(f.request.value);
      if (!r.ok) { U.toast(r.reason); return; }
      f.cost.value = Math.round(r.total / 10) * 10;   // 10원 단위로 정리
      if (!U.toNum(f.price.value)) f.price.value = r.suggested;
      U.toast('원가 ' + U.won(r.total) + ' — ' + r.name + ' (' + r.sourceLabel + ')');
    };

    U.$('#calPrev', view).onclick = function () { calMonth = U.shiftMonth(calMonth, -1); refreshCal(); };
    U.$('#calNext', view).onclick = function () { calMonth = U.shiftMonth(calMonth, 1); refreshCal(); };

    view.addEventListener('click', function (e) {
      var day = e.target.closest('.day[data-date]');
      if (day) { dayModal(day.dataset.date); return; }
      var t = e.target;
      if (t.dataset.editOrder) loadToForm(t.dataset.editOrder);
    });

    function refreshCal() {
      U.$('#calTitle', view).textContent = U.monthTitle(calMonth);
      U.$('#calBody', view).innerHTML = calendarGrid();
    }
  }

  return { render: render, all: all, byMonth: byMonth, byDate: byDate,
           statusText: statusText, statusCls: statusCls, parseReservations: parseReservations };
})();

/* ===== js/monthly.js ===== */
/* 월별 정산 - 한 달(1일~말일) 주문 전체 리스트 + 매출/원가 한눈에 보기 */
window.Monthly = (function () {

  var month = U.thisMonth();

  function render(view) {
    var orders = Orders.byMonth(month);
    var live = orders.filter(function (o) { return o.status !== 'canceled'; });

    var sales = sum(live, 'price');
    var cost = sum(live, 'cost');
    var profit = sales - cost;
    var rate = sales ? Math.round(profit / sales * 100) : 0;
    var deposit = sum(live.filter(function (o) { return o.status !== 'done'; }), 'deposit');

    view.innerHTML = '' +
      '<div class="card">' +
        '<div class="cal-head">' +
          '<button class="btn ghost small" id="mPrev">‹ 이전달</button>' +
          '<div class="cal-title">' + U.monthTitle(month) + ' 정산 <span class="cap-sub" style="font-weight:400">(1일~' + U.lastDayOfMonth(month) + '일)</span></div>' +
          '<button class="btn ghost small" id="mNext">다음달 ›</button>' +
        '</div>' +
        '<div class="grid four">' +
          tile('주문 건수', live.length + '건', '') +
          tile('총 매출', U.won(sales), 'rose') +
          tile('총 원가', U.won(cost), 'amber') +
          tile('순이익', U.won(profit) + ' (' + rate + '%)', 'mint') +
        '</div>' +
        (deposit ? '<p class="hint" style="margin-top:10px">받은 예약금 중 아직 픽업 전인 금액: <b>' + U.won(deposit) + '</b></p>' : '') +
      '</div>' +

      '<div class="card">' +
        '<div class="row"><h2 style="margin:0">📋 주문 전체 리스트</h2><div class="spacer"></div>' +
        '<button class="btn ghost small" id="mCsv">엑셀(CSV) 저장</button></div>' +
        (orders.length ? orderTable(orders) : '<div class="empty">이 달에는 주문이 없어요.</div>') +
      '</div>' +

      (live.length ? '<div class="card"><h2>🗓️ 날짜별 합계</h2>' + dailyTable(live) + '</div>' : '') +

      '<div class="card"><h2>🏆 케이크별 순위</h2>' +
        (live.length ? rankTable(live) : '<div class="empty">데이터가 없어요.</div>') +
      '</div>';

    bind(view, orders);
  }

  function sum(arr, key) {
    return arr.reduce(function (a, o) { return a + U.toNum(o[key]); }, 0);
  }
  function tile(label, value, cls) {
    return '<div class="stat ' + cls + '"><div class="label">' + label + '</div><div class="value">' + value + '</div></div>';
  }

  function orderTable(orders) {
    var rows = orders.map(function (o) {
      var profit = U.toNum(o.price) - U.toNum(o.cost);
      return '<tr' + (o.status === 'canceled' ? ' style="opacity:.45"' : '') + '>' +
        '<td>' + U.korDate(o.pickupDate) + '<br><span class="cap-sub">' + U.esc(o.pickupTime || '') + '</span></td>' +
        '<td><b>' + U.esc(o.customerName) + '</b><br><span class="cap-sub">' + U.esc(U.phone(o.phone)) + '</span></td>' +
        '<td>' + U.esc(o.request || '') + (o.note ? '<br><span class="cap-sub">📌 ' + U.esc(o.note) + '</span>' : '') + '</td>' +
        '<td class="num">' + U.num(o.price) + '</td>' +
        '<td class="num">' + U.num(o.cost) + '</td>' +
        '<td class="num" style="color:' + (profit >= 0 ? 'var(--mint)' : 'var(--red)') + '"><b>' + U.num(profit) + '</b></td>' +
        '<td><span class="badge ' + Orders.statusCls(o.status) + '">' + Orders.statusText(o.status) + '</span></td>' +
        '</tr>';
    }).join('');
    var live = orders.filter(function (o) { return o.status !== 'canceled'; });
    return '<div class="table-wrap"><table>' +
      '<thead><tr><th>픽업날짜</th><th>고객</th><th>주문내용</th><th class="num">매출</th><th class="num">원가</th><th class="num">이익</th><th>상태</th></tr></thead>' +
      '<tbody>' + rows + '</tbody>' +
      '<tfoot><tr><td colspan="3">합계 (취소 제외)</td>' +
        '<td class="num">' + U.num(sum(live, 'price')) + '</td>' +
        '<td class="num">' + U.num(sum(live, 'cost')) + '</td>' +
        '<td class="num">' + U.num(sum(live, 'price') - sum(live, 'cost')) + '</td><td></td></tr></tfoot>' +
      '</table></div>';
  }

  function dailyTable(live) {
    var map = {};
    live.forEach(function (o) {
      var d = o.pickupDate;
      if (!map[d]) map[d] = { n: 0, price: 0, cost: 0 };
      map[d].n++; map[d].price += U.toNum(o.price); map[d].cost += U.toNum(o.cost);
    });
    var rows = Object.keys(map).sort().map(function (d) {
      var v = map[d];
      return '<tr><td>' + U.korDate(d) + '</td><td class="num">' + v.n + '건</td>' +
        '<td class="num">' + U.num(v.price) + '</td><td class="num">' + U.num(v.cost) + '</td>' +
        '<td class="num">' + U.num(v.price - v.cost) + '</td></tr>';
    }).join('');
    return '<div class="table-wrap"><table><thead><tr><th>날짜</th><th class="num">건수</th>' +
      '<th class="num">매출</th><th class="num">원가</th><th class="num">이익</th></tr></thead><tbody>' + rows + '</tbody></table></div>';
  }

  function rankTable(live) {
    var map = {};
    live.forEach(function (o) {
      // 주문내용 첫 줄을 케이크 이름처럼 사용
      var key = (o.request || '기타').split('\n')[0].slice(0, 24) || '기타';
      if (!map[key]) map[key] = { n: 0, price: 0 };
      map[key].n++; map[key].price += U.toNum(o.price);
    });
    var rows = Object.keys(map).map(function (k) { return { k: k, v: map[k] }; })
      .sort(function (a, b) { return b.v.n - a.v.n || b.v.price - a.v.price; })
      .slice(0, 10)
      .map(function (x, i) {
        return '<tr><td>' + (i + 1) + '</td><td>' + U.esc(x.k) + '</td><td class="num">' + x.v.n + '건</td>' +
          '<td class="num">' + U.num(x.v.price) + '</td></tr>';
      }).join('');
    return '<div class="table-wrap"><table><thead><tr><th>순위</th><th>주문내용</th><th class="num">건수</th><th class="num">매출</th></tr></thead><tbody>' + rows + '</tbody></table></div>';
  }

  function bind(view, orders) {
    U.$('#mPrev', view).onclick = function () { month = U.shiftMonth(month, -1); App.render(); };
    U.$('#mNext', view).onclick = function () { month = U.shiftMonth(month, 1); App.render(); };
    U.$('#mCsv', view).onclick = function () {
      var rows = [['픽업날짜', '픽업시간', '고객이름', '연락처', '주문요청사항', '가격(매출)', '원가', '이익', '예약금', '참고사항', '경로', '상태']];
      orders.forEach(function (o) {
        rows.push([o.pickupDate, o.pickupTime || '', o.customerName, U.phone(o.phone), o.request || '',
          U.toNum(o.price), U.toNum(o.cost), U.toNum(o.price) - U.toNum(o.cost), U.toNum(o.deposit),
          o.note || '', o.source || '', Orders.statusText(o.status)]);
      });
      U.downloadCsv(month + '_주문정산.csv', rows);
      U.toast('CSV 파일을 저장했어요');
    };
  }

  return { render: render, setMonth: function (m) { month = m; } };
})();
