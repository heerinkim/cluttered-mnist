/* 재고 현황 - 케이크 상자, 보냉백, 리본 등 */
window.Inventory = (function () {

  var CATEGORIES = ['상자', '보냉백', '리본', '초·장식', '받침·트레이', '포장지', '기타'];
  var filter = '전체';

  function render(view) {
    var items = DB.list('inventory');
    var shown = filter === '전체' ? items : items.filter(function (i) { return i.category === filter; });
    shown = shown.slice().sort(function (a, b) {
      return (a.category || '').localeCompare(b.category || '') || (a.name || '').localeCompare(b.name || '');
    });

    var low = items.filter(isLow);
    var totalValue = items.reduce(function (a, i) { return a + U.toNum(i.qty) * U.toNum(i.unitPrice); }, 0);

    view.innerHTML = '' +
      '<div class="card">' +
        '<div class="grid three">' +
          tile('전체 품목', items.length + '종', '') +
          tile('재고 금액', U.won(totalValue), 'rose') +
          tile('부족 품목', low.length + '종', low.length ? 'amber' : 'mint') +
        '</div>' +
        (low.length ? '<div class="warn" style="margin-top:12px">⚠️ <b>주문이 필요해요:</b> ' +
          low.map(function (i) { return U.esc(i.name) + ' (' + U.num(i.qty) + U.esc(i.unit || '개') + ' 남음)'; }).join(', ') + '</div>' : '') +
      '</div>' +

      '<div class="card">' +
        '<div class="row"><h2 style="margin:0">📦 재고 현황</h2><div class="spacer"></div>' +
          '<button class="btn ghost small" id="invCsv">CSV 저장</button>' +
          '<button class="btn small" id="addItem">+ 품목 추가</button></div>' +
        '<div class="row" style="margin:10px 0">' +
          ['전체'].concat(CATEGORIES).map(function (c) {
            return '<button class="btn ' + (c === filter ? '' : 'ghost') + ' small" data-filter="' + c + '">' + c + '</button>';
          }).join('') +
        '</div>' +
        (shown.length ? table(shown) : '<div class="empty">등록된 품목이 없어요. [+ 품목 추가]를 눌러보세요.</div>') +
        '<p class="hint" style="margin-top:10px">➖ ➕ 버튼으로 수량을 바로 조절할 수 있어요. ' +
        '현재 수량이 안전재고 이하가 되면 빨갛게 표시되고 위에 알려드립니다.</p>' +
      '</div>';

    bind(view, shown);
  }

  function isLow(i) {
    var min = U.toNum(i.minQty);
    return min > 0 && U.toNum(i.qty) <= min;
  }
  function tile(label, value, cls) {
    return '<div class="stat ' + cls + '"><div class="label">' + label + '</div><div class="value">' + value + '</div></div>';
  }

  function table(items) {
    var rows = items.map(function (i) {
      var qty = U.toNum(i.qty), unit = i.unit || '개';
      return '<tr' + (isLow(i) ? ' class="low"' : '') + '>' +
        '<td><b>' + U.esc(i.name) + '</b>' + (i.memo ? '<br><span class="cap-sub">' + U.esc(i.memo) + '</span>' : '') + '</td>' +
        '<td><span class="badge gray">' + U.esc(i.category || '기타') + '</span></td>' +
        '<td class="num" style="white-space:nowrap">' +
          '<button class="icon-btn" data-minus="' + i.id + '">➖</button>' +
          '<b style="display:inline-block;min-width:46px">' + U.num(qty) + '</b>' +
          '<button class="icon-btn" data-plus="' + i.id + '">➕</button>' +
          ' <span class="cap-sub">' + U.esc(unit) + '</span>' +
        '</td>' +
        '<td class="num">' + (U.toNum(i.minQty) || '-') + '</td>' +
        '<td class="num">' + U.won(i.unitPrice) + '</td>' +
        '<td class="num">' + U.won(qty * U.toNum(i.unitPrice)) + '</td>' +
        '<td class="num">' + (isLow(i) ? '<span class="badge red">부족</span>' : '<span class="badge mint">충분</span>') + '</td>' +
        '<td class="num"><button class="icon-btn" data-edit="' + i.id + '">✏️</button>' +
        '<button class="icon-btn" data-del="' + i.id + '">🗑️</button></td></tr>';
    }).join('');
    return '<div class="table-wrap"><table><thead><tr><th>품목</th><th>분류</th><th class="num">현재 수량</th>' +
      '<th class="num">안전재고</th><th class="num">개당 단가</th><th class="num">재고 금액</th><th class="num">상태</th><th></th></tr></thead>' +
      '<tbody>' + rows + '</tbody></table></div>';
  }

  function itemModal(id) {
    var it = id ? DB.find('inventory', id) : { name: '', category: '상자', qty: 0, unit: '개', minQty: 10, unitPrice: 0, memo: '' };
    var html = '' +
      '<div class="field"><label>품목명 <span style="color:var(--rose)">*</span></label>' +
        '<input id="iName" value="' + U.esc(it.name) + '" placeholder="예: 1호 케이크 상자 (화이트)"></div>' +
      '<div class="grid two">' +
        '<div class="field"><label>분류</label><select id="iCat">' +
          CATEGORIES.map(function (c) { return '<option' + (c === it.category ? ' selected' : '') + '>' + c + '</option>'; }).join('') +
        '</select></div>' +
        '<div class="field"><label>단위</label><input id="iUnit" value="' + U.esc(it.unit || '개') + '" placeholder="개, 롤, 장"></div>' +
        '<div class="field"><label>현재 수량</label><input id="iQty" type="number" step="any" value="' + U.esc(it.qty) + '"></div>' +
        '<div class="field"><label>안전재고 (이하면 알림)</label><input id="iMin" type="number" step="any" value="' + U.esc(it.minQty) + '"></div>' +
        '<div class="field"><label>개당 단가(원)</label><input id="iPrice" type="number" step="any" value="' + U.esc(it.unitPrice) + '"></div>' +
        '<div class="field"><label>구매처 링크 (선택)</label><input id="iUrl" value="' + U.esc(it.url || '') + '" placeholder="https://"></div>' +
      '</div>' +
      '<div class="field"><label>메모</label><input id="iMemo" value="' + U.esc(it.memo || '') + '" placeholder="예: 100개 묶음 구매"></div>' +
      '<div class="row end"><button class="btn ghost" id="iCancel">취소</button><button class="btn" id="iSave">저장</button></div>';

    U.modal(id ? '품목 수정' : '품목 추가', html, function (body) {
      U.$('#iCancel', body).onclick = U.closeModal;
      U.$('#iSave', body).onclick = function () {
        var name = U.$('#iName', body).value.trim();
        if (!name) { U.toast('품목명을 적어주세요'); return; }
        DB.upsert('inventory', {
          id: it.id, name: name,
          category: U.$('#iCat', body).value,
          unit: U.$('#iUnit', body).value.trim() || '개',
          qty: U.toNum(U.$('#iQty', body).value),
          minQty: U.toNum(U.$('#iMin', body).value),
          unitPrice: U.toNum(U.$('#iPrice', body).value),
          url: U.$('#iUrl', body).value.trim(),
          memo: U.$('#iMemo', body).value.trim()
        });
        U.closeModal(); U.toast('저장했어요'); App.render();
      };
    });
  }

  function adjust(id, delta) {
    var it = DB.find('inventory', id); if (!it) return;
    var next = Math.max(0, U.toNum(it.qty) + delta);
    DB.upsert('inventory', { id: id, qty: next });
    App.render();
  }

  function bind(view, shown) {
    U.$('#addItem', view).onclick = function () { itemModal(null); };
    U.$('#invCsv', view).onclick = function () {
      var rows = [['품목명', '분류', '현재수량', '단위', '안전재고', '개당단가', '재고금액', '메모']];
      DB.list('inventory').forEach(function (i) {
        rows.push([i.name, i.category, U.toNum(i.qty), i.unit, U.toNum(i.minQty), U.toNum(i.unitPrice),
          U.toNum(i.qty) * U.toNum(i.unitPrice), i.memo || '']);
      });
      U.downloadCsv('재고현황.csv', rows);
    };
    view.addEventListener('click', function (e) {
      var t = e.target;
      if (t.dataset.filter) { filter = t.dataset.filter; App.render(); }
      if (t.dataset.edit) itemModal(t.dataset.edit);
      if (t.dataset.del && U.confirmBox('이 품목을 삭제할까요?')) { DB.remove('inventory', t.dataset.del); App.render(); }
      if (t.dataset.plus) adjust(t.dataset.plus, 1);
      if (t.dataset.minus) adjust(t.dataset.minus, -1);
    });
  }

  return { render: render, CATEGORIES: CATEGORIES, isLow: isLow };
})();

/* ===== js/gallery.js ===== */
/* 케이크 디자인 갤러리
   사진은 브라우저 안(IndexedDB)에 저장되고 인터넷으로 올라가지 않습니다. */
window.Gallery = (function () {

  var urlCache = {};   // id -> objectURL (화면을 다시 그릴 때 정리)
  var tagFilter = '전체';

  function render(view) {
    releaseUrls();
    var photos = DB.list('photos').slice().sort(function (a, b) {
      return (b.date || '').localeCompare(a.date || '') || (b.createdAt || '').localeCompare(a.createdAt || '');
    });
    var tags = {};
    photos.forEach(function (p) { (p.tags || []).forEach(function (t) { tags[t] = (tags[t] || 0) + 1; }); });
    var tagList = Object.keys(tags).sort();
    var shown = tagFilter === '전체' ? photos : photos.filter(function (p) { return (p.tags || []).indexOf(tagFilter) >= 0; });

    view.innerHTML = '' +
      '<div class="card">' +
        '<div class="row"><h2 style="margin:0">🖼️ 케이크 디자인 갤러리</h2><div class="spacer"></div>' +
          '<label class="btn small" for="photoInput" style="margin:0">+ 사진 올리기</label>' +
          '<input type="file" id="photoInput" accept="image/*" multiple style="display:none;width:auto">' +
        '</div>' +
        '<p class="hint">사진 ' + photos.length + '장 · 여러 장을 한 번에 올릴 수 있어요. ' +
        '사진은 자동으로 가볍게 줄여서 저장합니다.</p>' +
        (tagList.length ? '<div class="row" style="margin-bottom:12px">' +
          ['전체'].concat(tagList).map(function (t) {
            return '<button class="btn ' + (t === tagFilter ? '' : 'ghost') + ' small" data-tag="' + U.esc(t) + '">' +
              U.esc(t) + (t === '전체' ? '' : ' ' + tags[t]) + '</button>';
          }).join('') + '</div>' : '') +
        (shown.length ? '<div class="gal" id="galGrid">' + shown.map(card).join('') + '</div>'
          : '<div class="empty">아직 사진이 없어요.<br>지금까지 만든 케이크 사진을 올려보세요 🎂</div>') +
      '</div>';

    bind(view);
    shown.forEach(loadImage);
  }

  function card(p) {
    return '<figure data-photo="' + p.id + '">' +
      '<img id="img-' + p.id + '" alt="' + U.esc(p.title || '케이크 사진') + '" loading="lazy">' +
      '<figcaption><div class="cap-title">' + U.esc(p.title || '(제목 없음)') + '</div>' +
      '<div class="cap-sub">' + (p.date ? U.korDate(p.date) : '') +
      ((p.tags || []).length ? ' · ' + U.esc(p.tags.join(', ')) : '') + '</div></figcaption></figure>';
  }

  function loadImage(p) {
    DB.photoGet(p.id).then(function (blob) {
      if (!blob) return;
      var el = document.getElementById('img-' + p.id);
      if (!el) return;
      var url = URL.createObjectURL(blob);
      urlCache[p.id] = url;
      el.src = url;
    }).catch(function () { });
  }
  function releaseUrls() {
    Object.keys(urlCache).forEach(function (k) { URL.revokeObjectURL(urlCache[k]); });
    urlCache = {};
  }

  /* ---------- 업로드 (자동 축소) ---------- */
  function handleFiles(files) {
    var arr = Array.prototype.slice.call(files).filter(function (f) { return /^image\//.test(f.type); });
    if (!arr.length) return;
    U.toast(arr.length + '장 저장 중...');
    var chain = Promise.resolve();
    arr.forEach(function (file) {
      chain = chain.then(function () { return shrink(file); }).then(function (blob) {
        var meta = DB.upsert('photos', {
          title: file.name.replace(/\.[^.]+$/, '').slice(0, 40),
          date: U.today(), tags: [], memo: ''
        });
        return DB.photoPut(meta.id, blob);
      });
    });
    chain.then(function () { U.toast('사진을 저장했어요'); App.render(); })
      .catch(function (e) { U.toast('저장 실패: ' + e.message); });
  }

  // 긴 변 1400px 이하 JPEG 로 변환 (용량 절약)
  function shrink(file) {
    return new Promise(function (resolve, reject) {
      var img = new Image();
      var url = URL.createObjectURL(file);
      img.onload = function () {
        var max = 1400;
        var w = img.width, h = img.height;
        var scale = Math.min(1, max / Math.max(w, h));
        var cw = Math.round(w * scale), ch = Math.round(h * scale);
        var c = document.createElement('canvas');
        c.width = cw; c.height = ch;
        c.getContext('2d').drawImage(img, 0, 0, cw, ch);
        URL.revokeObjectURL(url);
        c.toBlob(function (blob) {
          resolve(blob || file);
        }, 'image/jpeg', 0.85);
      };
      img.onerror = function () { URL.revokeObjectURL(url); reject(new Error('이미지를 읽을 수 없어요')); };
      img.src = url;
    });
  }

  /* ---------- 자세히 보기 / 수정 ---------- */
  function detail(id) {
    var p = DB.find('photos', id); if (!p) return;
    var html = '<div class="lightbox"><img id="bigImg" alt=""></div>' +
      '<div class="field"><label>제목</label><input id="pTitle" value="' + U.esc(p.title || '') + '"></div>' +
      '<div class="grid two">' +
        '<div class="field"><label>만든 날짜</label><input id="pDate" type="date" value="' + U.esc(p.date || '') + '"></div>' +
        '<div class="field"><label>태그 (쉼표로 구분)</label><input id="pTags" value="' + U.esc((p.tags || []).join(', ')) + '" placeholder="생화, 2단, 웨딩"></div>' +
      '</div>' +
      '<div class="field"><label>메모</label><textarea id="pMemo">' + U.esc(p.memo || '') + '</textarea></div>' +
      '<div class="row end"><button class="btn danger" id="pDel">삭제</button>' +
      '<button class="btn ghost" id="pClose">닫기</button><button class="btn" id="pSave">저장</button></div>';

    U.modal(p.title || '사진', html, function (body) {
      DB.photoGet(id).then(function (blob) {
        if (!blob) return;
        var url = URL.createObjectURL(blob);
        var img = U.$('#bigImg', body);
        if (img) { img.src = url; img.onload = function () { setTimeout(function () { URL.revokeObjectURL(url); }, 3000); }; }
      });
      U.$('#pClose', body).onclick = U.closeModal;
      U.$('#pSave', body).onclick = function () {
        DB.upsert('photos', {
          id: id,
          title: U.$('#pTitle', body).value.trim(),
          date: U.$('#pDate', body).value,
          tags: U.$('#pTags', body).value.split(',').map(function (s) { return s.trim(); }).filter(Boolean),
          memo: U.$('#pMemo', body).value.trim()
        });
        U.closeModal(); U.toast('저장했어요'); App.render();
      };
      U.$('#pDel', body).onclick = function () {
        if (!U.confirmBox('이 사진을 삭제할까요?')) return;
        DB.photoDel(id).finally(function () {
          DB.remove('photos', id); U.closeModal(); U.toast('삭제했어요'); App.render();
        });
      };
    });
  }

  function bind(view) {
    var input = U.$('#photoInput', view);
    input.onchange = function () { handleFiles(input.files); input.value = ''; };
    view.addEventListener('click', function (e) {
      var t = e.target;
      if (t.dataset.tag) { tagFilter = t.dataset.tag; App.render(); return; }
      var fig = t.closest('figure[data-photo]');
      if (fig) detail(fig.dataset.photo);
    });
  }

  return { render: render };
})();

/* ===== js/notify.js ===== */
/* 고객 알림 - 주문 당일 / 픽업 전날 / 픽업 후 3가지 문자
   문자는 사장님 요금제의 기본 제공 문자를 쓰기 때문에 추가 비용이 들지 않습니다.
   (버튼을 누르면 문자앱이 내용이 채워진 채로 열립니다) */
window.Notify = (function () {

  var STAGES = [
    { key: 'orderDay',    label: '주문 당일',  emoji: '🧾', desc: '주문을 받은 날 보내는 확인 문자' },
    { key: 'dayBefore',   label: '픽업 전날',  emoji: '⏰', desc: '픽업 하루 전에 보내는 안내 문자' },
    { key: 'afterPickup', label: '픽업 후',    emoji: '💐', desc: '픽업이 끝난 뒤 보내는 감사 문자' }
  ];

  /* ---------- 문구 만들기 ---------- */
  function buildMessage(stageKey, order) {
    var t = DB.templates()[stageKey] || '';
    var set = DB.settings();
    var price = U.toNum(order.price), dep = U.toNum(order.deposit);
    var map = {
      '가게이름': set.shopName || '케이크 공방',
      '고객명': order.customerName || '',
      '픽업일': U.korDate(order.pickupDate),
      '픽업시간': order.pickupTime || '',
      '주문내용': (order.request || '').replace(/\n/g, ' '),
      '금액': U.won(price),
      '예약금': U.won(dep),
      '잔금': U.won(Math.max(0, price - dep)),
      '참고사항': order.note || ''
    };
    return t.replace(/\{\{\s*([^}]+?)\s*\}\}/g, function (m, k) {
      return map.hasOwnProperty(k) ? map[k] : m;
    });
  }

  /* ---------- 보낼 대상 찾기 ----------
     아직 안 보낸 건은 날짜가 지나도 사라지지 않고 "놓침"으로 남습니다. */
  function queue() {
    var today = U.today();
    var tomorrow = U.addDays(today, 1);
    var orders = DB.list('orders').filter(function (o) { return o.status !== 'canceled'; });

    function sent(o, k) { return !!(o.notify && o.notify[k] && o.notify[k].sent); }
    function withLate(o, isLate) { return { order: o, late: isLate }; }

    var q = { orderDay: [], dayBefore: [], afterPickup: [] };

    orders.forEach(function (o) {
      var od = o.orderDate || (o.createdAt || '').slice(0, 10);

      // 주문 당일 - 주문받은 날. 못 보냈으면 7일까지 놓침으로 남김
      if (od && !sent(o, 'orderDay')) {
        var dOrder = U.diffDays(od, today);
        if (dOrder >= 0 && dOrder <= 7) q.orderDay.push(withLate(o, dOrder >= 1));
      }

      // 픽업 전날 - 내일 픽업이면 오늘 발송. 픽업 당일까지 못 보냈으면 놓침
      if (!sent(o, 'dayBefore') && o.pickupDate >= today) {
        if (o.pickupDate === tomorrow) q.dayBefore.push(withLate(o, false));
        else if (o.pickupDate === today) q.dayBefore.push(withLate(o, true));
      }

      // 픽업 후 - 픽업이 끝난 뒤. 7일까지 남김
      if (!sent(o, 'afterPickup')) {
        var dPick = U.diffDays(o.pickupDate, today);
        if (dPick >= 1 && dPick <= 7) q.afterPickup.push(withLate(o, dPick >= 2));
        else if (dPick === 0 && o.status === 'done') q.afterPickup.push(withLate(o, false));
      }
    });

    // 픽업이 가까운 순서로
    Object.keys(q).forEach(function (k) {
      q[k].sort(function (a, b) { return (a.order.pickupDate || '').localeCompare(b.order.pickupDate || ''); });
    });
    return q;
  }

  function totalCount() {
    var q = queue();
    return STAGES.reduce(function (a, s) { return a + q[s.key].length; }, 0);
  }

  function markSent(orderId, stage, value) {
    var o = DB.find('orders', orderId); if (!o) return;
    var n = Object.assign({}, o.notify || {});
    n[stage] = value ? { sent: true, at: new Date().toISOString() } : { sent: false, at: '' };
    DB.upsert('orders', { id: orderId, notify: n });
  }

  // 최근에 보낸 기록
  function history(limit) {
    var out = [];
    DB.list('orders').forEach(function (o) {
      STAGES.forEach(function (s) {
        var rec = o.notify && o.notify[s.key];
        if (rec && rec.sent && rec.at) out.push({ order: o, stage: s, at: rec.at });
      });
    });
    out.sort(function (a, b) { return b.at.localeCompare(a.at); });
    return out.slice(0, limit || 10);
  }

  /* ---------- 화면 ---------- */
  function render(view) {
    var q = queue();
    var total = STAGES.reduce(function (a, s) { return a + q[s.key].length; }, 0);
    var set = DB.settings();
    var lateCount = STAGES.reduce(function (a, s) {
      return a + q[s.key].filter(function (x) { return x.late; }).length;
    }, 0);

    view.innerHTML = '' +
      '<div class="card">' +
        '<h2>💬 오늘 보낼 알림 ' + (total ? '<span class="badge">' + total + '건</span>' : '') + '</h2>' +
        '<p class="hint">사장님 요금제의 기본 문자를 쓰기 때문에 <b>추가 비용이 들지 않습니다.</b> ' +
        '[문자 보내기]를 누르면 휴대폰 문자앱이 내용이 채워진 채로 열려요. 보내기만 누르시면 됩니다.</p>' +
        '<div class="grid three">' +
          STAGES.map(function (s) {
            return '<div class="stat ' + (q[s.key].length ? 'rose' : '') + '">' +
              '<div class="label">' + s.emoji + ' ' + s.label + '</div>' +
              '<div class="value">' + q[s.key].length + '건</div></div>';
          }).join('') +
        '</div>' +
        (lateCount ? '<div class="warn" style="margin-top:12px">⚠️ 보낼 때를 <b>놓친 알림이 ' + lateCount + '건</b> 있어요. ' +
          '아래 <span class="badge red">놓침</span> 표시를 확인해 주세요.</div>' : '') +
        (total ? '<div class="row" style="margin-top:12px"><button class="btn" id="startSend">📱 순서대로 보내기 시작</button>' +
          '<span class="cap-sub">한 건 보낼 때마다 다음 사람으로 넘어갑니다</span></div>' : '') +
      '</div>' +

      STAGES.map(function (s) { return stageCard(s, q[s.key]); }).join('') +

      historyCard() +

      '<div class="card">' +
        '<h2>💻 컴퓨터에서 무료로 문자 보내기</h2>' +
        '<p class="hint">휴대폰을 들지 않고 컴퓨터에서 바로 보내고 싶다면, 아래 서비스로 휴대폰을 연결해 두세요. ' +
        '문자는 사장님 휴대폰에서 나가므로 <b>추가 요금이 없습니다.</b></p>' +
        '<div class="row">' +
          '<button class="btn ghost small" data-open="https://messages.google.com/web">안드로이드 · 메시지 웹</button>' +
          '<button class="btn ghost small" data-open="https://www.samsung.com/sec/apps/samsung-messages/">갤럭시 · 삼성 메시지</button>' +
        '</div>' +
        '<p class="hint" style="margin-top:8px">아이폰은 같은 애플 계정의 맥에서 메시지 앱으로 보낼 수 있어요.</p>' +
      '</div>' +

      '<div class="card">' +
        '<h2>✍️ 알림 문구 편집</h2>' +
        '<p class="hint">중괄호 두 개로 감싼 부분은 주문 내용으로 자동으로 바뀝니다: ' +
        ['가게이름', '고객명', '픽업일', '픽업시간', '주문내용', '금액', '예약금', '잔금'].map(function (v) {
          return '<code>{{' + v + '}}</code>';
        }).join(' ') + '</p>' +
        STAGES.map(function (s) {
          return '<div class="field"><label>' + s.emoji + ' ' + s.label + ' <span style="font-weight:400">— ' + s.desc + '</span></label>' +
            '<textarea data-tpl="' + s.key + '" style="min-height:110px">' + U.esc(DB.templates()[s.key]) + '</textarea></div>';
        }).join('') +
        '<div class="row end"><button class="btn ghost" id="tplReset">기본 문구로 되돌리기</button>' +
        '<button class="btn" id="tplSave">문구 저장</button></div>' +
      '</div>' +

      '<div class="card">' +
        '<h2>⚙️ 예약 받는 방식</h2>' +
        '<div class="field"><select id="resSource" style="max-width:340px">' +
          '<option value="manual"' + (set.reservationSource === 'manual' ? ' selected' : '') + '>직접 입력 (주문서에 사장님이 입력)</option>' +
          '<option value="paste"' + (set.reservationSource === 'paste' ? ' selected' : '') + '>채팅 내용 붙여넣기</option>' +
        '</select></div>' +
        '<p class="hint">주문서 화면의 [💬 채팅 내용으로 주문 만들기]는 어느 쪽을 골라도 언제든 쓸 수 있어요. ' +
        '이 설정은 주문서의 <b>주문 경로 기본값</b>만 정합니다.</p>' +
        '<div class="warn">📱 정해진 시각에 <b>사장님이 안 눌러도 자동으로</b> 문자가 나가게 하려면 문자 발송 서비스 가입 · ' +
        '발신번호 사전등록 · 작은 서버가 필요하고 건당 10~20원이 듭니다. 주문이 많아져 손으로 보내기 번거로워지면 그때 붙이면 됩니다.</div>' +
      '</div>';

    bind(view);
  }

  function stageCard(stage, list) {
    var body = list.length ? list.map(function (x, i) {
      var o = x.order;
      var msg = buildMessage(stage.key, o);
      return '<div class="q-item send-item" data-order="' + o.id + '" data-stage="' + stage.key + '">' +
        '<div class="row">' +
          '<span class="badge gray">' + (i + 1) + ' / ' + list.length + '</span>' +
          '<b>' + U.esc(o.customerName) + '</b>' +
          '<span class="cap-sub">' + U.esc(U.phone(o.phone) || '연락처 없음') + '</span>' +
          (x.late ? '<span class="badge red">놓침</span>' : '') +
          '<div class="spacer"></div>' +
          '<span class="badge">픽업 ' + U.korDate(o.pickupDate) + ' ' + U.esc(o.pickupTime || '') + '</span></div>' +
        '<div class="q-msg">' + U.esc(msg) + '</div>' +
        '<div class="row">' +
          (U.phoneDigits(o.phone) ? '<button class="btn small" data-sms>📱 문자 보내기</button>'
                                  : '<span class="badge red">연락처가 없어 문자를 보낼 수 없어요</span>') +
          '<button class="btn ghost small" data-copy>📋 카톡용 복사</button>' +
          '<button class="btn mint small" data-mark>✓ 보냄 표시</button>' +
        '</div></div>';
    }).join('') : '<div class="empty">지금 보낼 ' + stage.label + ' 알림이 없어요.</div>';

    return '<div class="card" id="stage-' + stage.key + '"><h2>' + stage.emoji + ' ' + stage.label +
      (list.length ? ' <span class="badge">' + list.length + '</span>' : '') + '</h2>' +
      '<p class="hint">' + stage.desc + '</p>' + body + '</div>';
  }

  function historyCard() {
    var h = history(10);
    if (!h.length) return '';
    return '<details class="card adv"><summary>📮 보낸 기록 ' +
      '<span class="cap-sub">(최근 ' + h.length + '건)</span></summary>' +
      '<div class="table-wrap" style="margin-top:12px"><table>' +
      '<thead><tr><th>보낸 때</th><th>고객</th><th>종류</th><th></th></tr></thead><tbody>' +
      h.map(function (x) {
        return '<tr><td>' + U.korDate(x.at.slice(0, 10)) + ' ' + U.esc(x.at.slice(11, 16)) + '</td>' +
          '<td>' + U.esc(x.order.customerName) + '</td>' +
          '<td>' + x.stage.emoji + ' ' + x.stage.label + '</td>' +
          '<td class="num"><button class="btn ghost small" data-undo="' + x.order.id + '" data-undo-stage="' + x.stage.key + '">되돌리기</button></td></tr>';
      }).join('') + '</tbody></table></div></details>';
  }

  /* ---------- 문자앱 열기 ---------- */
  function smsLink(phone, text) {
    var num = U.phoneDigits(phone);
    var isIOS = /iP(hone|ad|od)|Macintosh/.test(navigator.userAgent) && 'ontouchend' in document;
    var sep = isIOS ? '&' : '?';
    return 'sms:' + num + sep + 'body=' + encodeURIComponent(text);
  }

  function bind(view) {
    view.addEventListener('click', function (e) {
      var t = e.target;

      if (t.dataset.open) { window.open(t.dataset.open, '_blank', 'noopener'); return; }

      if (t.dataset.undo) {
        markSent(t.dataset.undo, t.dataset.undoStage, false);
        U.toast('안 보낸 상태로 되돌렸어요'); App.render(); return;
      }

      var item = t.closest('.send-item');
      if (item) {
        var id = item.dataset.order, stage = item.dataset.stage;
        var o = DB.find('orders', id);
        if (!o) return;
        var msg = buildMessage(stage, o);
        if (t.hasAttribute('data-sms')) {
          window.location.href = smsLink(o.phone, msg);
          setTimeout(function () { markSent(id, stage, true); next(); }, 1200);
        }
        if (t.hasAttribute('data-copy')) U.copyText(msg);
        if (t.hasAttribute('data-mark')) { markSent(id, stage, true); next(); }
      }
    });

    // 보낸 뒤 남은 건수를 알려주고 다음 대상으로 이동
    function next() {
      var left = totalCount();
      U.toast(left ? '보냄 표시 완료 — ' + left + '건 남았어요' : '오늘 보낼 알림을 모두 끝냈어요 🎉');
      App.render();
      if (left) scrollToFirst();
    }
    function scrollToFirst() {
      setTimeout(function () {
        var first = U.$('.send-item');
        if (!first) return;
        first.scrollIntoView({ behavior: 'smooth', block: 'center' });
        first.style.outline = '2px solid var(--rose)';
        setTimeout(function () { first.style.outline = ''; }, 1600);
      }, 60);
    }

    var start = U.$('#startSend', view);
    if (start) start.onclick = scrollToFirst;

    U.$('#tplSave', view).onclick = function () {
      var t = {};
      U.$$('[data-tpl]', view).forEach(function (ta) { t[ta.dataset.tpl] = ta.value; });
      DB.saveTemplates(t); U.toast('문구를 저장했어요'); App.render();
    };
    U.$('#tplReset', view).onclick = function () {
      if (!U.confirmBox('기본 문구로 되돌릴까요?')) return;
      DB.write('templates', {}); U.toast('되돌렸어요'); App.render();
    };
    U.$('#resSource', view).onchange = function () {
      DB.saveSettings({ reservationSource: this.value });
      U.toast('예약 받는 방식을 바꿨어요');
    };
  }

  return { render: render, queue: queue, totalCount: totalCount,
           buildMessage: buildMessage, STAGES: STAGES };
})();

/* ===== js/cloud.js ===== */
/* 깃허브 백업
   주문·재고·원가표·사진을 사장님의 "비공개" 깃허브 저장소에 올리고 내려받습니다.
   - 토큰은 이 컴퓨터에만 저장되며, 백업 파일(JSON)에는 절대 포함되지 않습니다.
   - 공개 저장소에는 올리지 못하도록 막아 두었습니다 (고객 개인정보 보호). */
window.Cloud = (function () {

  var API = 'https://api.github.com';
  var DATA_PATH = 'data/backup.json';
  var PHOTO_DIR = 'photos/';

  /* ---------- 설정 ---------- */
  function cfg() {
    return Object.assign({ repo: '', lastSyncAt: '', lastCheck: null }, DB.read('github', {}));
  }
  function saveCfg(c) { return DB.write('github', Object.assign(cfg(), c)); }
  // 토큰은 별도 키에 저장 -> 백업 파일(exportAll)에 섞여 나가지 않음
  function token() { return DB.read('githubToken', ''); }
  function saveToken(t) { DB.write('githubToken', String(t || '').trim()); }
  function configured() { return !!(cfg().repo && token()); }

  /* ---------- 글자 <-> base64 (한글 안전) ---------- */
  function toB64(str) {
    var bytes = new TextEncoder().encode(str);
    return bytesToB64(bytes);
  }
  function bytesToB64(bytes) {
    var bin = '', chunk = 0x8000;
    for (var i = 0; i < bytes.length; i += chunk) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + chunk));
    }
    return btoa(bin);
  }
  function b64ToBytes(b64) {
    var bin = atob(String(b64).replace(/\s/g, ''));
    var bytes = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    return bytes;
  }
  function fromB64(b64) { return new TextDecoder().decode(b64ToBytes(b64)); }
  function blobToB64(blob) {
    return new Promise(function (resolve, reject) {
      var r = new FileReader();
      r.onload = function () { resolve(String(r.result).split(',')[1] || ''); };
      r.onerror = function () { reject(new Error('사진을 읽지 못했어요')); };
      r.readAsDataURL(blob);
    });
  }

  /* ---------- 통신 ---------- */
  function fail(msg, status) { var e = new Error(msg); e.status = status; return e; }

  function api(path, opts) {
    opts = opts || {};
    var headers = Object.assign({
      'Accept': 'application/vnd.github+json',
      'X-GitHub-Api-Version': '2022-11-28'
    }, opts.headers || {});
    if (token()) headers.Authorization = 'Bearer ' + token();

    return fetch(API + path, Object.assign({}, opts, { headers: headers }))
      .catch(function () {
        // 인터넷이 끊겼거나, 파일을 직접 열었을 때 브라우저 보안정책에 막힌 경우
        var e = fail('깃허브에 연결하지 못했어요.\n' +
          '① 인터넷이 연결되어 있는지 확인해 주세요.\n' +
          '② 그래도 안 되면 브라우저 보안정책 때문일 수 있어요. ' +
          '아래 [손으로 백업하기]를 쓰시면 100% 확실하게 저장됩니다.');
        e.network = true;
        throw e;
      })
      .then(function (res) {
        if (res.status === 401) throw fail('토큰이 잘못되었거나 만료됐어요. 새로 발급해서 다시 넣어주세요.', 401);
        if (res.status === 403) throw fail('권한이 없어요. 토큰 권한에서 Contents를 "Read and write"로 설정했는지 확인해 주세요.', 403);
        if (res.status === 404) throw fail('저장소를 찾을 수 없어요. 저장소 이름(아이디/저장소)과 토큰 권한을 확인해 주세요.', 404);
        if (res.status === 409 || res.status === 422) throw fail('깃허브에 이미 다른 내용이 저장되어 있어요. [깃허브에서 불러오기]를 먼저 해보세요.', res.status);
        if (!res.ok) throw fail('깃허브 오류가 발생했어요 (코드 ' + res.status + ')', res.status);
        return res.status === 204 ? null : res.json();
      });
  }

  // 파일 읽기 - 없으면 null (오류 아님)
  function getFile(path) {
    var c = cfg();
    return api('/repos/' + c.repo + '/contents/' + path + '?ref=' + encodeURIComponent(c.branch || 'main'))
      .catch(function (e) {
        if (e.status === 404) return null;   // 아직 백업한 적이 없는 상태
        throw e;
      });
  }

  function putFile(path, base64, sha, message) {
    var c = cfg();
    var body = { message: message, content: base64 };
    if (sha) body.sha = sha;
    if (c.branch) body.branch = c.branch;
    return api('/repos/' + c.repo + '/contents/' + path, {
      method: 'PUT', body: JSON.stringify(body)
    });
  }

  /* ---------- 연결 확인 ---------- */
  function check() {
    var c = cfg();
    if (!c.repo) return Promise.reject(fail('저장소 이름을 먼저 넣어주세요. (예: 아이디/cake-shop-data)'));
    if (!/^[\w.-]+\/[\w.-]+$/.test(c.repo)) {
      return Promise.reject(fail('저장소 이름은 "아이디/저장소이름" 모양이어야 해요. (예: heerinkim/cake-shop-data)'));
    }
    if (!token()) return Promise.reject(fail('토큰을 먼저 넣어주세요.'));

    return api('/repos/' + c.repo).then(function (repo) {
      var info = {
        name: repo.full_name,
        isPrivate: !!repo.private,
        canPush: !!(repo.permissions && repo.permissions.push),
        branch: repo.default_branch || 'main',
        checkedAt: new Date().toISOString()
      };
      saveCfg({ branch: info.branch, lastCheck: info });
      return info;
    });
  }

  /* ---------- 올리기 ---------- */
  function upload(onStep) {
    var step = onStep || function () {};
    var c = cfg();

    return check().then(function (info) {
      if (!info.canPush) throw fail('이 저장소에 저장할 권한이 없어요. 토큰 권한을 확인해 주세요.');
      if (!info.isPrivate) {
        throw fail('⚠️ 이 저장소는 "공개(Public)" 입니다. 고객 이름과 전화번호가 전 세계에 공개되므로 올릴 수 없습니다. ' +
                   '깃허브에서 비공개(Private) 저장소를 만들어 그 이름을 넣어주세요.');
      }
      return uploadPhotos(step);
    }).then(function (photoCount) {
      step('주문 자료를 올리는 중...');
      var data = DB.exportAll();
      data.syncedAt = new Date().toISOString();
      var json = JSON.stringify(data, null, 2);

      return getFile(DATA_PATH).then(function (cur) {
        var stamp = U.korDateFull(U.today()) + ' ' + new Date().toTimeString().slice(0, 5);
        return putFile(DATA_PATH, toB64(json), cur && cur.sha, '주문 자료 백업 - ' + stamp);
      }).then(function () {
        saveCfg({ lastSyncAt: new Date().toISOString() });
        return { photos: photoCount, orders: DB.list('orders').length };
      });
    });
  }

  // 아직 안 올린 사진만 올립니다
  function uploadPhotos(step) {
    var metas = DB.list('photos').filter(function (m) { return !m.remoteAt; });
    if (!metas.length) return Promise.resolve(0);

    var done = 0;
    return metas.reduce(function (chain, meta) {
      return chain.then(function () {
        step('사진 올리는 중... (' + (done + 1) + '/' + metas.length + ')');
        return DB.photoGet(meta.id).then(function (blob) {
          if (!blob) return null;                       // 사진 파일이 없으면 건너뜀
          return blobToB64(blob).then(function (b64) {
            var path = PHOTO_DIR + meta.id + '.jpg';
            return getFile(path).then(function (cur) {
              return putFile(path, b64, cur && cur.sha, '사진 백업 - ' + (meta.title || meta.id));
            });
          });
        }).then(function () {
          DB.upsert('photos', { id: meta.id, remoteAt: new Date().toISOString() });
          done++;
        });
      });
    }, Promise.resolve()).then(function () { return done; });
  }

  /* ---------- 내려받기 ---------- */
  function download(onStep) {
    var step = onStep || function () {};
    return check().then(function () {
      step('주문 자료를 내려받는 중...');
      return getFile(DATA_PATH);
    }).then(function (file) {
      if (!file) throw fail('깃허브에 아직 백업이 없어요. 먼저 [깃허브에 저장]을 해주세요.');
      var data;
      try { data = JSON.parse(fromB64(file.content)); }
      catch (e) { throw fail('백업 파일을 읽지 못했어요. 파일이 손상됐을 수 있습니다.'); }
      DB.importAll(data);
      return downloadPhotos(step);
    }).then(function (n) {
      saveCfg({ lastSyncAt: new Date().toISOString() });
      return { photos: n, orders: DB.list('orders').length };
    });
  }

  // 이 컴퓨터에 없는 사진만 내려받습니다
  function downloadPhotos(step) {
    var metas = DB.list('photos');
    if (!metas.length) return Promise.resolve(0);
    var done = 0;

    return metas.reduce(function (chain, meta) {
      return chain.then(function () {
        return DB.photoGet(meta.id).then(function (has) {
          if (has) return null;                          // 이미 있으면 건너뜀
          step('사진 내려받는 중... (' + (done + 1) + '/' + metas.length + ')');
          return getFile(PHOTO_DIR + meta.id + '.jpg').then(function (file) {
            if (!file || !file.content) return null;
            var blob = new Blob([b64ToBytes(file.content)], { type: 'image/jpeg' });
            return DB.photoPut(meta.id, blob).then(function () { done++; });
          });
        }).catch(function () { /* 사진 한 장 실패로 전체가 멈추지 않도록 */ });
      });
    }, Promise.resolve()).then(function () { return done; });
  }

  /* ---------- 마지막 저장 시각 ---------- */
  function lastSyncText() {
    var t = cfg().lastSyncAt;
    if (!t) return '아직 저장한 적 없음';
    var d = new Date(t);
    var days = U.diffDays(t.slice(0, 10), U.today());
    var when = U.korDateFull(t.slice(0, 10)) + ' ' + U.pad(d.getHours()) + ':' + U.pad(d.getMinutes());
    return when + (days >= 1 ? ' (' + days + '일 전)' : ' (오늘)');
  }

  return {
    cfg: cfg, saveCfg: saveCfg, token: token, saveToken: saveToken, configured: configured,
    check: check, upload: upload, download: download, lastSyncText: lastSyncText,
    DATA_PATH: DATA_PATH
  };
})();

    }
    function busy(on) {
      ['#ghUpload', '#ghDownload', '#ghCheck'].forEach(function (s) {
        var b = U.$(s, view); if (b) b.disabled = on;
      });
    }
    function saveFields() {
      Cloud.saveCfg({ repo: U.$('#ghRepo', view).value.trim() });
      Cloud.saveToken(U.$('#ghToken', view).value);
    }

    U.$('#ghSave', view).onclick = function () {
      saveFields(); U.toast('저장했어요'); App.render();
    };
    U.$('#ghHelp', view).onclick = tokenHelp;
    U.$('#ghOpenRepo', view).onclick = function () {
      var repo = U.$('#ghRepo', view).value.trim();
      if (!repo) { U.toast('저장소 이름을 먼저 넣어주세요'); return; }
      window.open('https://github.com/' + repo + '/upload/main/data', '_blank', 'noopener');
    };

    U.$('#ghCheck', view).onclick = function () {
      saveFields(); busy(true); step('깃허브에 연결하는 중...');
      Cloud.check().then(function (info) {
        busy(false);
        if (!info.isPrivate) {
          progress.innerHTML = '<div class="warn">🚨 <b>' + U.esc(info.name) + '</b> 는 공개(Public) 저장소예요. ' +
            '고객 정보가 공개되므로 저장할 수 없습니다. 비공개 저장소를 새로 만들어 주세요.</div>';
        } else if (!info.canPush) {
          progress.innerHTML = '<div class="warn">토큰에 저장 권한이 없어요. Contents를 "Read and write"로 바꿔주세요.</div>';
        } else {
          done('연결 성공! ' + info.name + ' (비공개) 에 저장할 수 있어요.');
        }
        App.render();
      }).catch(function (e) { busy(false); oops(e); });
    };

    U.$('#ghUpload', view).onclick = function () {
      saveFields(); busy(true); step('시작하는 중...');
      Cloud.upload(step).then(function (r) {
        busy(false);
        done('깃허브에 저장했어요. 주문 ' + r.orders + '건' + (r.photos ? ' · 새 사진 ' + r.photos + '장' : '') + ' 백업 완료.');
        U.toast('깃허브 저장 완료 ☁️');
        App.render();
      }).catch(function (e) { busy(false); oops(e); });
    };

    U.$('#ghDownload', view).onclick = function () {
      if (!U.confirmBox('깃허브에 저장된 내용으로 이 컴퓨터의 자료를 바꿉니다.\n지금 이 컴퓨터에만 있는 최근 주문은 사라질 수 있어요.\n계속할까요?')) return;
      saveFields(); busy(true); step('시작하는 중...');
      Cloud.download(step).then(function (r) {
        busy(false);
        done('불러왔어요. 주문 ' + r.orders + '건' + (r.photos ? ' · 사진 ' + r.photos + '장' : '') + '.');
        U.toast('불러오기 완료');
        App.render(); App.refreshShopName();
      }).catch(function (e) { busy(false); oops(e); });
    };
  }

  function bind(view) {
    bindCloud(view);
    U.$('#sSave', view).onclick = function () {
      DB.saveSettings({
        shopName: U.$('#sName', view).value.trim() || '케이크 공방',
        ownerPhone: U.$('#sPhone', view).value.trim(),
        laborPerCake: U.toNum(U.$('#sLabor', view).value),
        defaultMarginPct: U.toNum(U.$('#sMargin', view).value)
      });
      U.toast('저장했어요'); App.render(); App.refreshShopName();
    };

    U.$('#bkExport', view).onclick = function () {
      var data = JSON.stringify(DB.exportAll(), null, 2);
      U.downloadBlob(new Blob([data], { type: 'application/json' }),
        '케이크공방_백업_' + U.today() + '.json');
      U.toast('백업 파일을 내려받았어요');
    };

    var file = U.$('#bkFile', view);
    file.onchange = function () {
      var f = file.files[0]; if (!f) return;
      var reader = new FileReader();
      reader.onload = function () {
        try {
          var data = JSON.parse(reader.result);
          if (!U.confirmBox('지금 자료를 백업 파일 내용으로 바꿉니다. 계속할까요?')) return;
          DB.importAll(data);
          U.toast('불러왔어요'); App.render(); App.refreshShopName();
        } catch (e) { U.toast('불러오기 실패: ' + e.message); }
      };
      reader.readAsText(f);
      file.value = '';
    };

    U.$('#seedBtn', view).onclick = function () {
      if (!U.confirmBox('예시 데이터를 추가할까요? (기존 자료는 지워지지 않아요)')) return;
      Seed.install(); U.toast('예시 데이터를 넣었어요'); App.render();
    };

    U.$('#resetBtn', view).onclick = function () {
      if (!U.confirmBox('정말 모든 자료를 지울까요? 되돌릴 수 없습니다.')) return;
      if (!U.confirmBox('마지막 확인입니다. 백업 파일은 받으셨나요?')) return;
      DB.clearAll(); DB.write('seeded', true);
      U.toast('초기화했어요'); App.render(); App.refreshShopName();
    };
  }

  return { render: render };
})();

/* ===== js/home.js ===== */
/* 홈 - 오늘 할 일 한눈에 보기 */
window.Home = (function () {

  function render(view) {
    var today = U.today();
    var tomorrow = U.addDays(today, 1);
    var month = U.thisMonth();
    var todayList = Orders.byDate(today).filter(function (o) { return o.status !== 'canceled'; });
    var tomorrowList = Orders.byDate(tomorrow).filter(function (o) { return o.status !== 'canceled'; });
    var live = Orders.byMonth(month).filter(function (o) { return o.status !== 'canceled'; });
    var sales = live.reduce(function (a, o) { return a + U.toNum(o.price); }, 0);
    var cost = live.reduce(function (a, o) { return a + U.toNum(o.cost); }, 0);
    var q = Notify.queue();
    var notifyCount = Notify.STAGES.reduce(function (a, s) { return a + q[s.key].length; }, 0);
    var lowStock = DB.list('inventory').filter(Inventory.isLow);

    view.innerHTML = '' +
      '<div class="card">' +
        '<h2>👋 오늘도 좋은 하루 되세요!</h2>' +
        '<div class="grid four">' +
          tile('오늘 픽업', todayList.length + '건', todayList.length ? 'rose' : '') +
          tile('내일 픽업', tomorrowList.length + '건', '') +
          tile(U.monthTitle(month) + ' 매출', U.won(sales), 'mint') +
          tile('보낼 알림', notifyCount + '건', notifyCount ? 'amber' : '') +
        '</div>' +
      '</div>' +

      '<div class="card">' +
        '<h2>🎂 오늘 픽업 (' + U.korDateFull(today) + ')</h2>' +
        (todayList.length ? list(todayList) : '<div class="empty">오늘 픽업 예정인 케이크가 없어요.</div>') +
      '</div>' +

      '<div class="card">' +
        '<h2>⏰ 내일 준비할 것</h2>' +
        (tomorrowList.length ? list(tomorrowList) : '<div class="empty">내일 픽업 예정이 없어요.</div>') +
      '</div>' +

      '<div class="card">' +
        '<h2>📊 이번 달 요약</h2>' +
        '<div class="grid four">' +
          tile('주문', live.length + '건', '') +
          tile('매출', U.won(sales), 'rose') +
          tile('원가', U.won(cost), 'amber') +
          tile('이익', U.won(sales - cost), 'mint') +
        '</div>' +
        '<div class="row" style="margin-top:12px"><button class="btn ghost small" data-go="monthly">월별정산 자세히 보기 →</button></div>' +
      '</div>' +

      (lowStock.length ? '<div class="card"><h2>📦 재고가 부족해요</h2>' +
        '<div class="warn">' + lowStock.map(function (i) {
          return U.esc(i.name) + ' <b>' + U.num(i.qty) + U.esc(i.unit || '개') + '</b> 남음';
        }).join('<br>') + '</div>' +
        '<div class="row" style="margin-top:12px"><button class="btn ghost small" data-go="inventory">재고 관리로 가기 →</button></div></div>' : '') +

      backupReminder() +

      '<div class="card">' +
        '<h2>⚡ 바로 가기</h2>' +
        '<div class="row">' +
          '<button class="btn" data-go="orders">📝 주문 등록</button>' +
          '<button class="btn ghost" data-go="cost">🧮 원가 계산</button>' +
          '<button class="btn ghost" data-go="notify">💬 알림 보내기</button>' +
          '<button class="btn ghost" data-go="gallery">🖼️ 갤러리</button>' +
        '</div>' +
      '</div>';

    view.addEventListener('click', function (e) {
      if (e.target.dataset.go) location.hash = '#' + e.target.dataset.go;
    });
  }

  function tile(label, value, cls) {
    return '<div class="stat ' + cls + '"><div class="label">' + label + '</div><div class="value">' + value + '</div></div>';
  }

  // 백업한 지 오래됐으면 알려줍니다 (자료를 잃지 않는 게 제일 중요해서)
  function backupReminder() {
    var last = Cloud.cfg().lastSyncAt;
    var days = last ? U.diffDays(last.slice(0, 10), U.today()) : 999;
    if (days < 3) return '';
    var msg = !last
      ? '아직 깃허브에 백업한 적이 없어요. 컴퓨터가 고장 나면 자료가 사라집니다.'
      : '마지막 백업이 <b>' + days + '일 전</b>이에요. 오늘 자료를 올려두세요.';
    return '<div class="card"><h2>☁️ 백업하셨나요?</h2>' +
      '<div class="warn">' + msg + '</div>' +
      '<div class="row" style="margin-top:12px">' +
      '<button class="btn" data-go="settings">지금 백업하러 가기 →</button></div></div>';
  }

  function list(orders) {
    return '<div class="table-wrap"><table><thead><tr><th>시간</th><th>고객</th><th>주문내용</th><th class="num">잔금</th><th>상태</th></tr></thead><tbody>' +
      orders.map(function (o) {
        var rest = Math.max(0, U.toNum(o.price) - U.toNum(o.deposit));
        return '<tr><td><b>' + U.esc(o.pickupTime || '-') + '</b></td>' +
          '<td>' + U.esc(o.customerName) + '<br><span class="cap-sub">' + U.esc(U.phone(o.phone)) + '</span></td>' +
          '<td>' + U.esc(o.request || '') + (o.note ? '<br><span class="cap-sub">📌 ' + U.esc(o.note) + '</span>' : '') + '</td>' +
          '<td class="num">' + U.won(rest) + '</td>' +
          '<td><span class="badge ' + Orders.statusCls(o.status) + '">' + Orders.statusText(o.status) + '</span></td></tr>';
      }).join('') + '</tbody></table></div>';
  }

  return { render: render };
})();

/* ===== js/app.js ===== */
/* 화면 전환(라우터) + 시작 */
window.App = (function () {

  var ROUTES = {
    home: Home,
    orders: Orders,
    monthly: Monthly,
    inventory: Inventory,
    gallery: Gallery,
    cost: Cost,
    notify: Notify,
    settings: Settings
  };

  function current() {
    var r = (location.hash || '#home').slice(1);
    return ROUTES[r] ? r : 'home';
  }

  function render() {
    var route = current();
    // 화면을 새 요소로 갈아끼웁니다.
    // (이전 화면에 붙여둔 클릭 이벤트가 쌓여서 두 번씩 실행되는 것을 막기 위함)
    var old = U.$('#view');
    var view = document.createElement('main');
    view.id = 'view';
    view.className = 'view';
    old.parentNode.replaceChild(view, old);
    U.$$('#tabs button').forEach(function (b) {
      b.classList.toggle('active', b.dataset.route === route);
    });
    try {
      ROUTES[route].render(view);
    } catch (e) {
      view.innerHTML = '<div class="card"><h2>문제가 생겼어요</h2><p class="hint">' +
        U.esc(e.message) + '</p><button class="btn ghost" onclick="location.hash=\'#home\'">홈으로</button></div>';
      console.error(e);
    }
    refreshShopName();
    window.scrollTo({ top: 0 });
  }

  function refreshShopName() {
    var s = DB.settings();
    var name = s.shopName || '케이크 공방';
    U.$('#shopName').textContent = name;
    // 보낼 알림이 있으면 브라우저 탭 제목에 건수를 붙여 놓치지 않게 함
    var n = 0;
    try { n = Notify.totalCount(); } catch (e) { n = 0; }
    document.title = (n ? '(' + n + ') ' : '') + name + ' 운영 노트';
  }

  function start() {
    Seed.installIfEmpty();
    refreshShopName();
    U.$('#todayLabel').textContent = U.korDateFull(U.today());

    U.$$('#tabs button').forEach(function (b) {
      b.onclick = function () { location.hash = '#' + b.dataset.route; };
    });
    window.addEventListener('hashchange', render);

    U.$('#modalClose').onclick = U.closeModal;
    U.$('#modal').addEventListener('click', function (e) {
      if (e.target.id === 'modal') U.closeModal();
    });
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape' && !U.$('#modal').hidden) U.closeModal();
    });

    if (!DB.storageOk) {
      U.toast('저장이 안 되는 환경이에요. 설정 화면의 안내를 확인해 주세요.');
    }
    render();
  }

  // 화면이 이미 준비된 뒤에 불러와도 정상 동작하도록
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start);
  else start();

  return { render: render, refreshShopName: refreshShopName };
})();

</script>
