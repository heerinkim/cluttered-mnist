<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>케이크 공방 운영 노트</title>
<style>
:root{
  --cream:#fff9f3;
  --card:#ffffff;
  --ink:#3d2b23;
  --ink-soft:#7a6259;
  --line:#f0e2d6;
  --rose:#d9738a;
  --rose-dark:#c25a73;
  --rose-soft:#fdeef1;
  --mint:#4aa792;
  --amber:#e0973f;
  --red:#d9534f;
  --shadow:0 2px 10px rgba(120,80,60,.08);
  --radius:14px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--cream);
  color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
  font-size:15px;line-height:1.55;
  -webkit-text-size-adjust:100%;
}
h1,h2,h3,h4{margin:0 0 .5rem;font-weight:700;letter-spacing:-.02em}
p{margin:0 0 .5rem}
a{color:var(--rose-dark)}

/* ---------- top bar ---------- */
.topbar{
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:14px 18px;background:#fff;border-bottom:1px solid var(--line);
  position:sticky;top:0;z-index:20;
}
.brand{display:flex;align-items:center;gap:12px}
.logo{font-size:30px;line-height:1}
.topbar h1{font-size:19px;margin:0}
.sub{font-size:12px;color:var(--ink-soft);margin:0}
.today-chip{
  background:var(--rose-soft);color:var(--rose-dark);
  padding:6px 12px;border-radius:999px;font-size:13px;font-weight:600;white-space:nowrap;
}

/* ---------- tabs ---------- */
.tabs{
  display:flex;gap:6px;padding:10px 14px;overflow-x:auto;
  background:#fff;border-bottom:1px solid var(--line);
  position:sticky;top:63px;z-index:19;-webkit-overflow-scrolling:touch;
}
.tabs::-webkit-scrollbar{height:0}
.tabs button{
  flex:0 0 auto;border:1px solid var(--line);background:#fff;color:var(--ink-soft);
  padding:8px 14px;border-radius:999px;font-size:14px;font-weight:600;cursor:pointer;
  font-family:inherit;
}
.tabs button:hover{background:var(--rose-soft)}
.tabs button.active{background:var(--rose);border-color:var(--rose);color:#fff}

/* ---------- layout ---------- */
.view{max-width:1080px;margin:0 auto;padding:18px 14px 80px}
.card{
  background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  padding:16px;margin-bottom:16px;box-shadow:var(--shadow);
}
.card h2{font-size:17px;display:flex;align-items:center;gap:8px}
.card h3{font-size:15px}
.hint{font-size:13px;color:var(--ink-soft);margin:4px 0 12px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row.end{justify-content:flex-end}
.spacer{flex:1}
.grid{display:grid;gap:12px}
.grid.two{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.grid.three{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.grid.four{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}

/* ---------- forms ---------- */
label{display:block;font-size:13px;font-weight:600;color:var(--ink-soft);margin-bottom:4px}
input,select,textarea{
  width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;
  font-size:15px;font-family:inherit;color:var(--ink);background:#fff;
}
input:focus,select:focus,textarea:focus{outline:2px solid var(--rose-soft);border-color:var(--rose)}
textarea{min-height:70px;resize:vertical}
.field{margin-bottom:12px}
.inline-field{display:flex;gap:8px;align-items:flex-end}
.inline-field>div{flex:1}

button{font-family:inherit}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  background:var(--rose);color:#fff;border:none;padding:11px 18px;border-radius:10px;
  font-size:15px;font-weight:700;cursor:pointer;
}
.btn:hover{background:var(--rose-dark)}
.btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}
.btn.ghost:hover{background:var(--rose-soft)}
.btn.small{padding:7px 12px;font-size:13px;border-radius:8px}
.btn.danger{background:var(--red)}
.btn.mint{background:var(--mint)}
.icon-btn{
  background:transparent;border:none;font-size:17px;cursor:pointer;color:var(--ink-soft);
  padding:4px 6px;border-radius:6px;
}
.icon-btn:hover{background:var(--rose-soft)}

/* ---------- tables ---------- */
.table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{width:100%;border-collapse:collapse;font-size:14px;min-width:520px}
th,td{padding:10px 8px;text-align:left;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:12px;color:var(--ink-soft);font-weight:700;background:#fffdfb;white-space:nowrap}
td.num,th.num{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
tr.low td{background:#fff6f5}
tfoot td{font-weight:700;background:#fffdfb}
table input,table select{padding:6px 8px;font-size:14px}

/* ---------- stats ---------- */
.stat{
  background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:14px;
  box-shadow:var(--shadow);
}
.stat .label{font-size:12px;color:var(--ink-soft);font-weight:700}
.stat .value{font-size:22px;font-weight:800;letter-spacing:-.03em;margin-top:2px;font-variant-numeric:tabular-nums}
.stat.rose .value{color:var(--rose-dark)}
.stat.mint .value{color:var(--mint)}
.stat.amber .value{color:var(--amber)}

/* ---------- badges ---------- */
.badge{
  display:inline-block;padding:3px 9px;border-radius:999px;font-size:11px;font-weight:700;
  background:var(--rose-soft);color:var(--rose-dark);white-space:nowrap;
}
.badge.gray{background:#f2efec;color:var(--ink-soft)}
.badge.mint{background:#e4f4f0;color:#2f7d6c}
.badge.amber{background:#fdf1e0;color:#a86c1c}
.badge.red{background:#fdeceb;color:#b93b37}

/* ---------- calendar ---------- */
.cal-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.cal-title{font-size:17px;font-weight:800}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .dow{text-align:center;font-size:12px;font-weight:700;color:var(--ink-soft);padding:4px 0}
.cal .dow.sun{color:var(--red)}
.cal .day{
  min-height:88px;border:1px solid var(--line);border-radius:10px;padding:5px;background:#fff;
  cursor:pointer;overflow:hidden;
}
.cal .day.empty{background:transparent;border:none;cursor:default}
.cal .day:hover{border-color:var(--rose)}
.cal .day.today{border:2px solid var(--rose);background:var(--rose-soft)}
.cal .dnum{font-size:12px;font-weight:700;color:var(--ink-soft)}
.cal .day.sun .dnum{color:var(--red)}
.cal .ev{
  font-size:11px;background:var(--rose-soft);color:var(--rose-dark);border-radius:6px;
  padding:2px 5px;margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600;
}
.cal .ev.done{background:#eef0ef;color:var(--ink-soft)}
.cal .more{font-size:10px;color:var(--ink-soft);margin-top:2px}
@media (max-width:640px){
  .cal .day{min-height:64px;padding:3px}
  .cal .ev{font-size:10px;padding:1px 3px}
}

/* ---------- gallery ---------- */
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.gal figure{margin:0;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#fff;cursor:pointer}
.gal img{width:100%;aspect-ratio:1/1;object-fit:cover;display:block}
.gal figcaption{padding:7px 8px;font-size:12px}
.gal .cap-title{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gal .cap-sub{color:var(--ink-soft);font-size:11px}
.lightbox img{width:100%;border-radius:10px;margin-bottom:10px}

/* ---------- notify queue ---------- */
.q-item{
  border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px;background:#fff;
}
.q-item.sent{opacity:.55}
.q-msg{
  background:#fffdfb;border:1px dashed var(--line);border-radius:10px;padding:10px;
  font-size:13px;white-space:pre-wrap;margin:8px 0;
}

/* ---------- modal ---------- */
.modal-back{
  position:fixed;inset:0;background:rgba(60,40,32,.45);z-index:50;
  display:flex;align-items:flex-start;justify-content:center;padding:20px;overflow-y:auto;
}
/* hidden 속성이 display:flex 에 밀리지 않도록 */
.modal-back[hidden]{display:none}
.modal{
  background:#fff;border-radius:16px;width:min(560px,100%);margin:auto;
  box-shadow:0 12px 40px rgba(60,40,32,.25);
}
.modal-head{
  display:flex;align-items:center;justify-content:space-between;
  padding:14px 16px;border-bottom:1px solid var(--line);
}
.modal-head h3{margin:0;font-size:16px}
.modal-body{padding:16px}

/* ---------- toast ---------- */
.toast{
  position:fixed;left:50%;bottom:26px;transform:translate(-50%,24px);
  background:var(--ink);color:#fff;padding:11px 18px;border-radius:999px;font-size:14px;font-weight:600;
  opacity:0;pointer-events:none;transition:.25s;z-index:100;max-width:90vw;text-align:center;
}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* 붙여넣기 미리보기 - 좁은 팝업에서도 두 칸으로 */
.pv-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
.pv-row .field{margin-bottom:8px}
.pv-row label{font-size:12px}

/* ---------- 접었다 펴는 영역 ---------- */
details.adv summary{
  cursor:pointer;font-size:16px;font-weight:700;letter-spacing:-.02em;
  list-style:none;display:flex;align-items:center;gap:8px;
}
details.adv summary::-webkit-details-marker{display:none}
details.adv summary::before{content:'▸';color:var(--rose);font-size:14px}
details.adv[open] summary::before{content:'▾'}
details.adv summary:hover{color:var(--rose-dark)}

.empty{text-align:center;color:var(--ink-soft);padding:28px 10px;font-size:14px}
.divider{height:1px;background:var(--line);margin:14px 0}
code{background:#f6efe9;padding:1px 5px;border-radius:5px;font-size:13px}
.warn{background:#fff8e8;border:1px solid #f3e2bd;border-radius:10px;padding:10px 12px;font-size:13px;color:#7a5a1c}
.info{background:#eef6f4;border:1px solid #cfe6e0;border-radius:10px;padding:10px 12px;font-size:13px;color:#2f6b5e}

</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎂</text></svg>">
</head>
<body>

<header class="topbar">
  <div class="brand">
    <span class="logo">🎂</span>
    <div>
      <h1 id="shopName">케이크 공방</h1>
      <p class="sub">주문 · 정산 · 재고 · 원가 관리</p>
    </div>
  </div>
  <div class="topbar-right">
    <span id="todayLabel" class="today-chip"></span>
  </div>
</header>

<nav class="tabs" id="tabs">
  <button data-route="home">🏠 홈</button>
  <button data-route="orders">📝 주문·달력</button>
  <button data-route="monthly">📊 월별정산</button>
  <button data-route="inventory">📦 재고</button>
  <button data-route="gallery">🖼️ 갤러리</button>
  <button data-route="cost">💰 원가표</button>
  <button data-route="notify">💬 알림</button>
  <button data-route="settings">⚙️ 설정</button>
</nav>

<main id="view" class="view"></main>

<div id="toast" class="toast"></div>

<div id="modal" class="modal-back" hidden>
  <div class="modal" role="dialog" aria-modal="true">
    <div class="modal-head">
      <h3 id="modalTitle">제목</h3>
      <button class="icon-btn" id="modalClose" aria-label="닫기">✕</button>
    </div>
    <div class="modal-body" id="modalBody"></div>
  </div>
</div>
<script>
/* ===== js/utils.js ===== */
/* 공통 도구 모음 (날짜, 금액, 화면 그리기 도우미) */
window.U = (function () {

  /* ---------- 날짜 ---------- */
  function pad(n) { return String(n).padStart(2, '0'); }

  // Date -> "2026-07-27"
  function ymd(d) {
    return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
  }
  // "2026-07-27" -> Date (시간은 00:00, 로컬 기준)
  function parseYmd(s) {
    if (!s) return null;
    var p = String(s).split('-');
    if (p.length !== 3) return null;
    return new Date(+p[0], +p[1] - 1, +p[2]);
  }
  function today() { return ymd(new Date()); }
  // 날짜 문자열에 일수 더하기 ("2026-07-27", 1) -> "2026-07-28"
  function addDays(s, n) {
    var d = parseYmd(s); if (!d) return '';
    d.setDate(d.getDate() + n);
    return ymd(d);
  }
  var DOW = ['일', '월', '화', '수', '목', '금', '토'];
  // "2026-07-27" -> "7월 27일 (월)"
  function korDate(s) {
    var d = parseYmd(s); if (!d) return '';
    return (d.getMonth() + 1) + '월 ' + d.getDate() + '일 (' + DOW[d.getDay()] + ')';
  }
  // "2026-07-27" -> "2026년 7월 27일 (월)"
  function korDateFull(s) {
    var d = parseYmd(s); if (!d) return '';
    return d.getFullYear() + '년 ' + korDate(s);
  }
  // "2026-07" 형태의 이번 달
  function thisMonth() { var d = new Date(); return d.getFullYear() + '-' + pad(d.getMonth() + 1); }
  // "2026-07" 을 n개월 이동
  function shiftMonth(m, n) {
    var p = m.split('-'), d = new Date(+p[0], +p[1] - 1 + n, 1);
    return d.getFullYear() + '-' + pad(d.getMonth() + 1);
  }
  function monthTitle(m) { var p = m.split('-'); return +p[0] + '년 ' + (+p[1]) + '월'; }
  // 해당 달의 마지막 날짜 (28~31)
  function lastDayOfMonth(m) { var p = m.split('-'); return new Date(+p[0], +p[1], 0).getDate(); }
  // 두 날짜 사이 일수 (b - a)
  function diffDays(a, b) {
    var da = parseYmd(a), db = parseYmd(b);
    if (!da || !db) return 0;
    return Math.round((db - da) / 86400000);
  }

  /* ---------- 금액/숫자 ---------- */
  function won(n) {
    n = Math.round(Number(n) || 0);
    return n.toLocaleString('ko-KR') + '원';
  }
  function num(n) { return (Math.round(Number(n) || 0)).toLocaleString('ko-KR'); }
  // "35,000원" / "35000" -> 35000
  function toNum(v) {
    if (v === null || v === undefined) return 0;
    var s = String(v).replace(/[^0-9.\-]/g, '');
    var n = parseFloat(s);
    return isNaN(n) ? 0 : n;
  }
  // 전화번호 정리: 01012345678 -> 010-1234-5678
  function phone(p) {
    var d = String(p || '').replace(/[^0-9]/g, '');
    if (d.length === 11) return d.slice(0, 3) + '-' + d.slice(3, 7) + '-' + d.slice(7);
    if (d.length === 10) return d.slice(0, 3) + '-' + d.slice(3, 6) + '-' + d.slice(6);
    return p || '';
  }
  function phoneDigits(p) { return String(p || '').replace(/[^0-9]/g, ''); }

  function uid() {
    return Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  }

  /* ---------- 화면 도우미 ---------- */
  function esc(s) {
    return String(s === null || s === undefined ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }
  function $(sel, root) { return (root || document).querySelector(sel); }
  function $$(sel, root) { return Array.prototype.slice.call((root || document).querySelectorAll(sel)); }

  var toastTimer = null;
  function toast(msg) {
    var t = $('#toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.classList.remove('show'); }, 2200);
  }

  function modal(title, html, onOpen) {
    $('#modalTitle').textContent = title;
    $('#modalBody').innerHTML = html;
    $('#modal').hidden = false;
    if (onOpen) onOpen($('#modalBody'));
  }
  function closeModal() { $('#modal').hidden = true; $('#modalBody').innerHTML = ''; }

  function confirmBox(msg) { return window.confirm(msg); }

  // 표를 CSV 파일로 내려받기 (엑셀에서 열림)
  function downloadCsv(filename, rows) {
    var csv = rows.map(function (r) {
      return r.map(function (c) {
        var s = String(c === null || c === undefined ? '' : c);
        return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
      }).join(',');
    }).join('\r\n');
    // 엑셀 한글 깨짐 방지용 BOM
    downloadBlob(new Blob(['﻿' + csv], { type: 'text/csv;charset=utf-8;' }), filename);
  }
  function downloadBlob(blob, filename) {
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
  }

  function copyText(text) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      return navigator.clipboard.writeText(text).then(function () { toast('복사했어요'); })
        .catch(function () { fallbackCopy(text); });
    }
    fallbackCopy(text);
    return Promise.resolve();
  }
  function fallbackCopy(text) {
    var ta = document.createElement('textarea');
    ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); toast('복사했어요'); } catch (e) { toast('복사 실패 - 직접 선택해 주세요'); }
    ta.remove();
  }

  return {
    ymd: ymd, parseYmd: parseYmd, today: today, addDays: addDays, korDate: korDate,
    korDateFull: korDateFull, thisMonth: thisMonth, shiftMonth: shiftMonth,
    monthTitle: monthTitle, lastDayOfMonth: lastDayOfMonth, diffDays: diffDays, DOW: DOW, pad: pad,
    won: won, num: num, toNum: toNum, phone: phone, phoneDigits: phoneDigits, uid: uid,
    esc: esc, $: $, $$: $$, toast: toast, modal: modal, closeModal: closeModal,
    confirmBox: confirmBox, downloadCsv: downloadCsv, downloadBlob: downloadBlob, copyText: copyText
  };
})();

/* ===== js/db.js ===== */
/* 데이터 저장소
   - 글자 데이터(주문/재고/재료/레시피/설정)는 localStorage 에 저장합니다.
   - 사진은 용량이 커서 IndexedDB(브라우저 안의 큰 창고)에 따로 저장합니다.
   - 모든 데이터는 "사장님 브라우저 안"에만 저장되며 외부로 나가지 않습니다.
     => 그래서 설정 화면의 [백업 파일 내려받기]를 주기적으로 꼭 눌러주세요. */
window.DB = (function () {

  var PREFIX = 'cakeshop:';
  var memoryFallback = {};   // localStorage 를 못 쓰는 환경(사파리 파일열기 등) 대비
  var storageOk = (function () {
    try {
      window.localStorage.setItem(PREFIX + '__t', '1');
      window.localStorage.removeItem(PREFIX + '__t');
      return true;
    } catch (e) { return false; }
  })();

  function read(key, fallback) {
    var raw;
    try { raw = storageOk ? localStorage.getItem(PREFIX + key) : memoryFallback[key]; }
    catch (e) { raw = memoryFallback[key]; }
    if (raw === null || raw === undefined) return fallback;
    try { return JSON.parse(raw); } catch (e) { return fallback; }
  }
  function write(key, value) {
    var raw = JSON.stringify(value);
    memoryFallback[key] = raw;
    if (storageOk) {
      try { localStorage.setItem(PREFIX + key, raw); }
      catch (e) { U.toast('저장 공간이 가득 찼어요. 설정에서 백업 후 정리해 주세요.'); }
    }
    return value;
  }

  /* ---------- 컬렉션(목록) 공통 ---------- */
  function list(key) { return read(key, []); }
  function saveList(key, arr) { return write(key, arr); }
  function upsert(key, item) {
    var arr = list(key);
    if (!item.id) { item.id = U.uid(); item.createdAt = new Date().toISOString(); }
    item.updatedAt = new Date().toISOString();
    var i = arr.findIndex(function (x) { return x.id === item.id; });
    if (i >= 0) arr[i] = Object.assign({}, arr[i], item); else arr.push(item);
    saveList(key, arr);
    return item;
  }
  function remove(key, id) {
    saveList(key, list(key).filter(function (x) { return x.id !== id; }));
  }
  function find(key, id) {
    return list(key).find(function (x) { return x.id === id; }) || null;
  }

  /* ---------- 설정 ---------- */
  var DEFAULT_SETTINGS = {
    shopName: '케이크 공방',
    ownerPhone: '',
    defaultMarginPct: 65,       // 판매가 제안 시 쓰는 마진율(%)
    laborPerCake: 8000,         // 케이크 1개당 기본 인건비(원)
    reservationSource: 'manual' // 'manual'(직접 입력) 또는 'paste'(채팅 붙여넣기)
  };
  function settings() { return Object.assign({}, DEFAULT_SETTINGS, read('settings', {})); }
  function saveSettings(s) { return write('settings', Object.assign(settings(), s)); }

  /* ---------- 알림 문구 ---------- */
  var DEFAULT_TEMPLATES = {
    orderDay: '[{{가게이름}}] {{고객명}}님, 주문 감사합니다 🎂\n· 픽업: {{픽업일}} {{픽업시간}}\n· 내용: {{주문내용}}\n· 금액: {{금액}}\n변경이 필요하시면 편하게 연락 주세요!',
    dayBefore: '[{{가게이름}}] {{고객명}}님, 내일 {{픽업시간}}에 케이크 픽업 예정입니다 🍰\n· 내용: {{주문내용}}\n· 잔금: {{잔금}}\n케이크는 서늘한 곳에 보관해 주세요. 내일 뵙겠습니다!',
    afterPickup: '[{{가게이름}}] {{고객명}}님, 오늘 케이크는 어떠셨나요? 😊\n소중한 순간 함께하게 해주셔서 감사합니다.\n후기를 남겨주시면 큰 힘이 됩니다!'
  };
  function templates() { return Object.assign({}, DEFAULT_TEMPLATES, read('templates', {})); }
  function saveTemplates(t) { return write('templates', Object.assign(templates(), t)); }

  /* ---------- 사진 창고 (IndexedDB) ---------- */
  var idbPromise = null;
  function idb() {
    if (idbPromise) return idbPromise;
    idbPromise = new Promise(function (resolve, reject) {
      if (!window.indexedDB) { reject(new Error('이 브라우저는 사진 저장을 지원하지 않아요')); return; }
      var req = indexedDB.open('cakeshop-photos', 1);
      req.onupgradeneeded = function () {
        var db = req.result;
        if (!db.objectStoreNames.contains('photos')) db.createObjectStore('photos');
      };
      req.onsuccess = function () { resolve(req.result); };
      req.onerror = function () { reject(req.error); };
    });
    return idbPromise;
  }
  function photoPut(id, blob) {
    return idb().then(function (db) {
      return new Promise(function (resolve, reject) {
        var tx = db.transaction('photos', 'readwrite');
        tx.objectStore('photos').put(blob, id);
        tx.oncomplete = function () { resolve(id); };
        tx.onerror = function () { reject(tx.error); };
      });
    });
  }
  function photoGet(id) {
    return idb().then(function (db) {
      return new Promise(function (resolve, reject) {
        var tx = db.transaction('photos', 'readonly');
        var r = tx.objectStore('photos').get(id);
        r.onsuccess = function () { resolve(r.result || null); };
        r.onerror = function () { reject(r.error); };
      });
    });
  }
  function photoDel(id) {
    return idb().then(function (db) {
      return new Promise(function (resolve) {
        var tx = db.transaction('photos', 'readwrite');
        tx.objectStore('photos').delete(id);
        tx.oncomplete = function () { resolve(); };
      });
    });
  }

  /* ---------- 백업 / 복원 ---------- */
  function exportAll() {
    return {
      _type: 'cakeshop-backup',
      _version: 1,
      exportedAt: new Date().toISOString(),
      settings: settings(),
      templates: templates(),
      orders: list('orders'),
      menus: list('menus'),
      inventory: list('inventory'),
      ingredients: list('ingredients'),
      recipes: list('recipes'),
      options: list('options'),
      photos: list('photos')   // 사진 설명만 (이미지 파일은 용량이 커서 제외)
    };
  }
  function importAll(data) {
    if (!data || data._type !== 'cakeshop-backup') throw new Error('백업 파일이 아니에요');
    if (data.settings) write('settings', data.settings);
    if (data.templates) write('templates', data.templates);
    ['orders', 'menus', 'inventory', 'ingredients', 'recipes', 'options', 'photos'].forEach(function (k) {
      if (Array.isArray(data[k])) saveList(k, data[k]);
    });
  }
  function clearAll() {
    ['settings', 'templates', 'orders', 'menus', 'inventory', 'ingredients', 'recipes', 'options', 'photos']
      .forEach(function (k) { write(k, k === 'settings' || k === 'templates' ? {} : []); });
  }

  return {
    storageOk: storageOk,
    list: list, saveList: saveList, upsert: upsert, remove: remove, find: find,
    settings: settings, saveSettings: saveSettings,
    templates: templates, saveTemplates: saveTemplates, DEFAULT_TEMPLATES: DEFAULT_TEMPLATES,
    photoPut: photoPut, photoGet: photoGet, photoDel: photoDel,
    exportAll: exportAll, importAll: importAll, clearAll: clearAll,
    read: read, write: write
  };
})();
